        voltageBN: { type: number, description: "Scenario 6 — voltage B→N, V" }
        voltageCN: { type: number, description: "Scenario 6 — voltage C→N, V" }
        voltageAB: { type: number, description: "Scenario 6 — voltage A→B, V" }
        voltageBC: { type: number, description: "Scenario 6 — voltage B→C, V" }
        voltageCA: { type: number, description: "Scenario 6 — voltage C→A, V" }
