              a:
                type: number
                x-unit: A
              b:
                type: number
                x-unit: A
              c:
                type: number
                x-unit: A
    InternalMeterInfo:
      title: InternalMeter configuration
      type: object
      properties:
        enabled:
          type: boolean
          description: Read-only mirror of the running state; cannot be changed via PATCH — use /start and /stop instead.
          readOnly: true
        modbusHost:
          type: string
          description: IP address or hostname the Modbus TCP server binds to (e.g. "0.0.0.0" for all interfaces).
          example: "0.0.0.0"
        modbusPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: TCP port the Modbus server listens on.
          example: 5502
        unitId:
          type: integer
          minimum: 1
          maximum: 247
          description: Modbus slave/unit ID. Valid range is 1–247; addresses 248–255 are reserved by the Modbus specification.
          example: 1
        serialNumber:
          type: string
          description: Meter serial number reported in status responses.
          example: "HUB-001-IM"
        nominalVoltage:
          type: number
          description: Nominal line-to-neutral voltage (V) used for idle readings before the first engine tick.
          example: 230
        nominalFrequency:
          type: number
          description: Nominal grid frequency (Hz) used for idle readings before the first engine tick.
          example: 50
        meterModel:
          type: string
          enum: [SDM630]
          description: Modbus register layout. Empty string defaults to SDM630.
          example: SDM630
    InternalMeterStatus:
      title: InternalMeter status response
      type: object
      properties:
        info:
          $ref: "#/components/schemas/InternalMeterInfo"
        running:
          type: boolean
          description: True if the Modbus TCP server is currently accepting connections.
        mode:
          type: string
          enum: [live, forced]
          description: |
            "live" — values are derived from the simulation engine each tick.
            "forced" — values are pinned by a PUT /internalmeter/readings call.
    InternalMeterReadings:
      title: InternalMeter readings snapshot (SDM630 register layout)
      description: |
        All power values are in Watts (W). All energy values are in Watt-hours (Wh)
        — note that the Modbus wire format stores energy in kWh; the conversion
        happens inside the Modbus handler. Reactive (var) and apparent (VA)
        registers are not served; those Modbus addresses return 0.
      type: object
      properties:
        power:
          type: number
          description: Total active power, signed (positive = import, negative = export). W.
        importPower:
          type: number
          description: Total import (consumption) power, non-negative. W.
        exportPower:
          type: number
          description: Total export (generation) power, non-negative. W.
        importEnergy:
          type: number
          description: Cumulative total import energy. Wh.
        exportEnergy:
          type: number
          description: Cumulative total export energy. Wh.
        frequency:
          type: number
          description: Grid frequency. Hz.
        powerFactor:
          type: number
          description: Total power factor (active-power-weighted average of per-phase PFs).
        l1Power:
          type: number
          description: L1 active power (signed). W.
        l2Power:
          type: number
          description: L2 active power (signed). W.
        l3Power:
          type: number
          description: L3 active power (signed). W.
        l1Current:
          type: number
          description: L1 current magnitude. A.
        l2Current:
          type: number
          description: L2 current magnitude. A.
        l3Current:
          type: number
          description: L3 current magnitude. A.
        l1Voltage:
          type: number
          description: L1 line-to-neutral voltage. V.
        l2Voltage:
          type: number
          description: L2 line-to-neutral voltage. V.
        l3Voltage:
          type: number
          description: L3 line-to-neutral voltage. V.
        l1ImportPower:
          type: number
          description: L1 import power, non-negative. W.
        l2ImportPower:
          type: number
          description: L2 import power, non-negative. W.
        l3ImportPower:
          type: number
          description: L3 import power, non-negative. W.
        l1ExportPower:
          type: number
          description: L1 export power, non-negative. W.
        l2ExportPower:
          type: number
          description: L2 export power, non-negative. W.
        l3ExportPower:
          type: number
          description: L3 export power, non-negative. W.
        l1ImportEnergy:
          type: number
          description: L1 cumulative import energy. Wh.
        l2ImportEnergy:
          type: number
          description: L2 cumulative import energy. Wh.
        l3ImportEnergy:
          type: number
          description: L3 cumulative import energy. Wh.
        l1ExportEnergy:
          type: number
          description: L1 cumulative export energy. Wh.
        l2ExportEnergy:
          type: number
          description: L2 cumulative export energy. Wh.
        l3ExportEnergy:
          type: number
          description: L3 cumulative export energy. Wh.
        l1PowerFactor:
          type: number
          description: L1 power factor.
        l2PowerFactor:
          type: number
          description: L2 power factor.
        l3PowerFactor:
          type: number
          description: L3 power factor.
    EnergyMeterReadings:
      title: readings of the Energy Meter
      description: >-
        The `EnergyMeter` singleton's grid measurement plus cumulative consumption
        (`api.EnergyMeterReadings`). Unlike the Internal Meter's `InternalMeterReadings`
        (which mirrors the SDM630 Modbus register layout, one scalar per phase for every
        quantity), this meter reports voltage/current/frequency/powerFactor per phase
        but a single scalar total `power` — there is no per-phase power split here.
      type: object
      properties:
        totalConsumption:
          type: number
          x-unit: kWh
          description: >-
            Cumulative energy consumed from the grid since the last simulation reset
            (accumulates only while power is positive/importing; never decreases).
        measurement:
          type: object
          properties:
            voltage:
              type: object
              description: Per-phase line-to-neutral voltage.
              properties:
                a:
                  type: number
                  x-unit: V
                b:
                  type: number
                  x-unit: V
                c:
                  type: number
                  x-unit: V
            current:
              type: object
              description: Per-phase current magnitude.
              properties:
                a:
                  type: number
                  x-unit: A
                b:
                  type: number
                  x-unit: A
                c:
                  type: number
                  x-unit: A
            power:
              type: number
              x-unit: W
              description: >-
                Total (all-phase) active power at the grid connection, signed:
                positive = importing from the grid, negative = exporting/feeding in.
                Unlike voltage/current/frequency/powerFactor, this is a single scalar,
                not a per-phase a/b/c object.
            frequency:
              type: object
              description: Per-phase grid frequency (all three are normally identical).
              properties:
                a:
                  type: number
                  x-unit: Hz
                b:
                  type: number
                  x-unit: Hz
                c:
                  type: number
                  x-unit: Hz
            powerFactor:
              type: object
              description: >-
                Per-phase power factor (0-1, unitless). Reported as 0 while undefined
                (NaN) rather than propagating NaN into the JSON response.
              properties:
                a:
                  type: number
                b:
                  type: number
                c:
                  type: number
    EVSEState:
      title: the state of the EVSE
      type: object
      properties:
        currentState:
          description: Empty string if the EVSE has no controllable system (LPC disabled). See CSState for
            the meaning of each value.
          allOf:
          - $ref: '#/components/schemas/CSState'
          type: string
