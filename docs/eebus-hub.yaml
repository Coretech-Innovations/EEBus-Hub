                    $ref: "#/components/schemas/lppAPPL"
        '400':
          description: Invalid ID, wrong entity type, or the inverter has no LPP controllable system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/lpcFailsafeValues:
    get:
      tags:
        - Inverter
      summary: Get the inverter's configured LPC failsafe value/duration
      operationId: getInverterLpcFailsafeValues
      description: >-
        Derived directly from the LPC controllable system's own config
        (failsafeValue, failsafeDuration × 3600 for seconds) — not read from a SPINE
        device-configuration reply. Never errors; returns a zero-value FCAPL if the
        inverter has no LPC controllable system.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  result:
                    $ref: "#/components/schemas/FCAPL"
        '400':
          $ref: "#/components/responses/InvalidIdBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/lppFailsafeValues:
    get:
      tags:
        - Inverter
      summary: Get the inverter's configured LPP failsafe value/duration
      operationId: getInverterLppFailsafeValues
      description: Production-side counterpart of GET .../lpcFailsafeValues. Never errors; returns a zero-value FSAPPL if the inverter has no LPP controllable system.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  result:
                    $ref: "#/components/schemas/lppFSAPPL"
        '400':
          $ref: "#/components/responses/InvalidIdBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/latestSentHeartbeat:
    get:
      tags:
        - Inverter
      summary: Get the inverter's latest sent heartbeat
      operationId: getInverterLatestSentHeartbeat
      description: >-
        Read from the LPC controllable system's heartbeat sender if present,
        otherwise the LPP one (an inverter always has at least one, since both are
        required at creation).
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatWrapper"
        '400':
          description: Invalid ID, wrong entity type, or neither LPC nor LPP use case is enabled on this inverter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/latestReceivedHeartbeat:
    get:
      tags:
        - Inverter
      summary: Get the inverter's latest received heartbeat
      operationId: getInverterLatestReceivedHeartbeat
      description: >-
        The heartbeat the inverter last received from its paired HEMS/ControlBox, read
        from the LPC side if present, otherwise the LPP side.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatWrapper"
        '400':
          description: Invalid ID, wrong entity type, or neither LPC nor LPP use case is enabled on this inverter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/lpcPowerConstraints:
    get:
      tags:
        - Inverter
      summary: Get the inverter's LPC (consumption) power constraints
      operationId: getInverterLpcPowerConstraints
      description: >-
        Nominal/contractual maximum consumption power, read from the LPC
        controllable system's electrical-connection characteristics (same shared
        shape used by EVSE/HeatPump — see `EVSEPowerConstraints`). There is no
        equivalent `lppPowerConstraints` route for the production side —
        `Inverter.GetLPPCSPowerConstraints` exists in the Go code but is not wired to
        any REST endpoint.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  result:
                    $ref: "#/components/schemas/EVSEPowerConstraints"
        '400':
          description: Invalid ID, wrong entity type, or the LPC use case is not enabled on this inverter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/electricalMeasurements:
    get:
      tags:
        - Inverter
      summary: Get the inverter's AC electrical measurements
      operationId: getInverterElectricalMeasurements
      description: >-
        Returns the inverter's current total power, energy consumed/produced, and
        per-phase current/voltage — derived each simulation tick from its battery/PV
        sub-devices' physics (`Inverter.updateMpcData`), in the array-based
        `measurementData` shape (distinct from the object-keyed `MPCMeasurements`
        shape EVSE/HeatPump use for their own electricalMeasurements GET). Always
        200; there is no error path once the ID resolves.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/measurementData"
        '400':
          $ref: "#/components/responses/InvalidIdBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
    patch:
      tags:
        - Inverter
      summary: Manually inject electrical measurements into the inverter
      operationId: patchInverterElectricalMeasurements
      description: >-
        Overwrites the inverter's electrical measurements (power/current/voltage per
        phase, energy, frequency) for simulation/testing purposes, bypassing normal
        use-case computation. Requires: the simulation must be running, and no PV
        string or battery may currently be available on this inverter (checked via
        `IsBatteryOrPVStringAvailable`) — if either is available, the request is
        rejected so manual measurements cannot fight their own simulated behavior.
        Only fields present in the request body are changed; omitted fields keep
        their current value (the current measurement snapshot is read first and the
        body is bound on top of it).


        Known quirk: injected values are written into the SPINE MPC local data
        (visible to a paired HEMS/ControlBox via `GET /hems/MpcMeasurementData` /
        `GET /controlbox/MpcMeasurementData`) but are **not** reflected back on the
        sibling `GET /inverter/{inverterId}/electricalMeasurements` — the code path
        that would sync them back (`h.measurements = measurements`) is commented out,
        the same quirk documented on `PATCH /evse/{evseId}/electricalMeasurements`.
        Use the HEMS/ControlBox MPC endpoint to verify an injected value took effect,
        not this endpoint's own GET.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MPCMeasurements"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            Invalid inverterId, simulation not running, a PV string or battery is
            available on this inverter, or the request body could not be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/InverterNotFound"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /inverter/gridToggle:
    post:
      tags:
        - Inverter
      summary: Toggle the simulated grid connection (all inverters)
      operationId: postInverterGridToggle
      description: >-
        Flips a single process-wide grid-connection flag shared by every inverter —
        not per-inverter. While disconnected ("OFF"), each simulation tick skips
        recomputing PV production and battery charge/discharge targets entirely for
        every inverter (their power output freezes at its last simulated value rather
        than dropping to zero), simulating an islanding/outage condition. The
        disconnected state is also reported to any paired HEMS/ControlBox via MOI
        (`InverterState.gridConnection` = "disconnected") and via a
        DeviceConfiguration key. There is no error path — this endpoint always
        succeeds.
      responses:
        '200':
          description: The grid connection state after toggling
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  grid_status:
                    type: string
                    enum: ["ON", "OFF"]
                    description: '"ON" if the grid is now connected, "OFF" if it was just disconnected'
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    get:
      tags:
        - Inverter
      summary: Get the simulated grid connection status
      operationId: getInverterGridToggle
      description: Reads the same process-wide flag toggled by POST /inverter/gridToggle.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  grid_status:
                    type: string
                    enum: ["ON", "OFF"]
                    description: '"ON" when the simulated grid is connected, "OFF" when disconnected (see POST /inverter/gridToggle for the effect)'
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /inverter/setPvSunFactor:
    patch:
      tags:
        - Inverter
      summary: Set the irradiance (sun) factor on every inverter's PV string
      operationId: setInverterPvSunFactor
      description: >-
        Applies `sunFactor` to every inverter's PV string in one call — for
        per-inverter control use `PATCH /inverter/{inverterId}/pvstring` instead.
        Validated up front (before iterating inverters): if no inverter has a PV
        string, an out-of-range value is still rejected rather than silently
        accepted. Inverters without a PV string are skipped (not an error). See
        `ValidateSunFactor`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sunFactor:
                  type: number
                  x-unit: ratio
                  description: Irradiance scaling factor, 0 (night) to 1 (full sun) inclusive.
            example:
              sunFactor: 0.75
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: sunFactor is outside the 0..1 range, or malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /inverter/{inverterId}/batteryStats:
    get:
      tags:
        - Inverter
      summary: Get the inverter battery's state of charge
      operationId: getInverterBatteryStats
      description: >-
        Thin wrapper returning just the battery's state of charge — for the full
        configuration and live values use `GET /inverter/{inverterId}/battery`
        instead. When the inverter has no battery the call is a 400 ("Battery is not
        available") and no state of charge is returned.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  soc:
                    type: number
                    x-unit: percent
                    description: Battery state of charge, 0..100
        '400':
          description: Invalid ID, wrong entity type, or the inverter has no battery ("Battery is not available")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /ev/{evId}/mode:
    get:
      tags:
        - EV
      summary: Get the EV simulation/testing mode and pinned values
      operationId: getEvMode
      description: >-
        mode is "simulation" (default, values driven by the hub's charging model)
        or "testing" (values pinned to whatever was last set via PATCH
        /ev/{evId}/values). live always reports the currently effective
        readings, whichever mode is active.
      parameters:
        - $ref: "#/components/parameters/EvIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVModeStatus"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: EV not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    patch:
      tags:
        - EV
      summary: Toggle the EV simulation/testing mode
      description: >-
        Switches the EV between simulation and testing mode. The pinned override
        values are set separately via PATCH /ev/{evId}/values.
        While the EV's EVSE is in testing mode the EV must stay in it: testingMode false
        is rejected with 409 (see lockedByParent in the response).
        An EV put into testing mode by this endpoint stays in it when its EVSE leaves
        testing mode and when it is unplugged. This includes an EV that was already in
        testing mode because of its EVSE: testingMode true makes that testing mode the
        EV's own.
      operationId: updateEvMode
      parameters:
        - $ref: "#/components/parameters/EvIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationModeRequest"
      responses:
        '200':
          description: The EV mode status after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVModeStatus"
        '400':
          $ref: "#/components/responses/InvalidRequestBodyBadRequest"
        '409':
          description: >-
            testingMode false while the EV's EVSE is in testing mode: an EV must stay in
            testing mode until its EVSE leaves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: EV not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /ev/{evId}/values:
    patch:
      tags:
        - EV
      summary: Set the EV forced measurement values (testing mode only)
      description: >-
        Pins the EV's reported charging power/current/SoC verbatim. Requires testing
        mode (400 otherwise). Every field optional; omitted fields keep their value.
