            $ref: '#/components/schemas/statusError'
    InvalidDataBadRequest:
      description: Invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/statusError'
    BadRequestGeneric:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/statusError'
    InvalidIdNumberLowerBadRequest:
      description: invalid Id number
      content:
        application/json:
