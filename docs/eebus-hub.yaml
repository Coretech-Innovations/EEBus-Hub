  /heatpump/{heatPumpId}/forceOhpcfState:
    post:
      tags:
        - Heat Pump
      summary: Force the HeatPump OHPCF power-sequence state (testing aid)
      description: >-
        Inject the heat pump's OHPCF power-sequence state directly, bypassing the
        transition table `POST /heatpump/{heatPumpId}/setState` enforces. Internally
        this reuses the normal announcement path (the same code
        `POST /heatpump/{heatPumpId}/announceOptional` calls) to set up the
        announced power, then sets the state; the next simulate tick treats it as a
        genuine entry and the OHPCF state machine resumes (auto-advance timers +
        CEM start-time handling).


        Requires: the heat pump must already be in testing mode
        (`PATCH /heatpump/{heatPumpId}/mode` with `testingMode: true`) — 400
        otherwise. Per target `state`: `running`/`scheduled`/`paused` need a power
        value (`powerMaxInWatts` in the request, or a prior announcement already in
        place); `scheduled` additionally needs `startDelayInSeconds`;
        `completed`/`invalid` need a prior announcement to already exist;
        `inactive` needs nothing. When `powerMaxInWatts` is supplied, the resulting
        announcement must still satisfy the pausable/stoppable requirement (at
        least one of `isPausable`/`isStoppable` must resolve to true, falling back
        to the heat pump's config then to defaults — see `OhpcfForceStateRequest`).
      operationId: forceHeatPumpOhpcfState
      parameters:
        - name: heatPumpId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OhpcfForceStateRequest"
            example:
              state: scheduled
              powerMaxInWatts: 3000
              startDelayInSeconds: 120
      responses:
        '200':
          description: The forced OHPCF state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    description: The heat pump's OHPCF state after the forced transition — see the `state` property on OhpcfMonitorData.
                    enum: [inactive, scheduled, running, paused, completed, invalid]
        '400':
          description: Invalid state, missing required value, or not in testing mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: HeatPump not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
