    EVSEControlBlock:
      title: EVSE status and control information
      type: object
      description: >-
        Response shape of `GET /evse/list` (array) and `GET /evse/{evseId}`
        (single). Serialized from api.EVSEControlBlock. DeviceInfo and DeviceState
        carry no JSON tag on the Go struct, so they appear under the capitalized
        field name, not camelCase.
      properties:
        testingMode:
          type: boolean
          description: >-
            Whether the EVSE is in testing mode (pinned values) rather than simulation
            mode. Enabling it also enables it on every connected EV, and an EV connected
            later enters it too; while the EVSE stays in testing mode its EVs cannot leave
            it. Disabling returns the EVs that are in testing mode because of the EVSE to
            simulation mode.
        evseId:
          type: integer
        DeviceInfo:
          description: Full EVSE configuration, as returned by GET /evse/{evseId}
          $ref: "#/components/schemas/EVSEConfig"
        ski:
          type: string
          description: Local SKI. Empty until the EVSE has been started (see POST /evse/{evseId}/trust).
        deviceAddress:
          type: string
          description: SPINE device address, empty if the EVSE's EEBUS service has not started
        connectedToHEMS:
          type: boolean
          description: >-
            Whether a remote controller is currently connected over SHIP. Populated
            at the SHIP transport level (RemoteServiceConnected/Disconnected,
            ServicePairingDetailUpdate), so it reflects any connected controller
            regardless of which use cases (e.g. EVSECC) are enabled.
        remoteSki:
          type: string
          description: >-
            SKI of the currently connected controller (HEMS/CEM), empty if none is
            connected. Use this to corroborate SKI-trust pairing initiated via
            POST /evse/{evseId}/trust: after trust is registered on both sides,
            `remoteSki` should equal the expected controller's SKI once pairing
            completes.
        LPCCurrentState:
          allOf:
            - $ref: "#/components/schemas/CSState"
          description: >-
            Omitted if the EVSE has no controllable system (LPC disabled). See
            CSState for the meaning of each value.
        LPCActivePowerLimit:
          type: number
          format: double
          x-unit: W
          description: Omitted (zero-valued) if the EVSE has no controllable system.
        DeviceState:
          allOf:
            - $ref: "#/components/schemas/DeviceErrorState"
          description: >-
            Always present (no omitempty on this Go field), but only actually
            populated when the EVSE has a local SKI and GetErrorState succeeds
            (EVSECC enabled and readable) — otherwise both operatingState and
            lastErrorCode are empty strings, not absent.
    EVSEListConfig:
      title: response when listing all EVSEs
      type: array
      items:
        $ref: "#/components/schemas/EVSEControlBlock"
