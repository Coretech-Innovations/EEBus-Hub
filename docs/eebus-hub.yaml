        limitValue:
          type: integer
    SystemState:
      title: one EV's aggregated system state
      type: object
      properties:
        evId:
          type: integer
        loadControlLimit:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/LoadControlLimitListData'
          description: null if the EV is not connected to an EVSE or OPEV is unavailable (the underlying error
            is not surfaced here).
        measurementData:
          $ref: '#/components/schemas/currentMeasurementData'
        chargingdata:
          $ref: '#/components/schemas/ChargingStatus'
    APILoggingState:
      title: the state of logging the APIs
      type: object
      properties:
        status:
          type: string
        state:
          type: string
          description: Whether the API call recorder is currently active.
          enum:
            - Running
            - Stopped
    lpcAPCL:
      title: Active Power Consumption Limit (APCL) data point
      type: object
      properties:
        isValueChangeable:
          type: boolean
          nullable: true
          description: >-
            Whether the consumption limit value may be changed by the controller.
            Reported by the device; ignored on write.
        active:
          type: boolean
          nullable: true
          description: >-
            Whether the limit is active. Required on POST (a request with
            active=null, or active=true with no value, is rejected with 400). Not
            required on PATCH.
        isLimitChangeable:
          type: boolean
          nullable: true
          description: >-
            Ignored on input — the server always clears this field before applying
            the request, since it is a device-reported (read-only) property, not
            something a client sets.
        value:
          type: number
          x-unit: W
          nullable: true
          description: Power limit value. Required when active=true.
        durationSeconds:
          type: number
          x-unit: s
          nullable: true
          description: >-
            How long the limit stays in force, as a relative end time computed from
            now. Takes precedence over durationIndefinite: if both are set, the
            device still receives a finite expiry.
        durationIndefinite:
          type: boolean
          nullable: true
          description: >-
            When true and durationSeconds is omitted, clears any expiry the device
            previously had for this limit (making it indefinite). Has no effect if
            the device had no prior expiry, or if durationSeconds is also set.
    FCAPL:
      title: Failsafe Consumption Active Power Limit (FSCAPL) data point
      type: object
      properties:
        isValueChangeable:
          type: boolean
          nullable: true
          description: Ignored on input — always cleared by the server before sending (read-only, device-reported).
        value:
          type: number
          x-unit: W
          nullable: true
          description: >-
            Failsafe power limit value applied when the device loses its heartbeat.
            Required on POST /hems/FailsafeActivePowerLimit{,/{deviceAddress}} (400
            if missing); not required on PATCH or on the
            FailsafeDurationForLpc endpoints (which send only durationSeconds).
        isDurationChangeable:
          type: boolean
          nullable: true
          description: Ignored on input — always cleared by the server before sending (read-only, device-reported).
        durationSeconds:
          type: number
          x-unit: s
          nullable: true
          description: >-
            Minimum failsafe duration. Required on POST
            /hems/FailsafeDurationForLpc{,/{deviceAddress}} (400 if missing); those
            two endpoints send only this field (value is cleared).
    EVSEPowerConstraints:
      title: LPC power constraints value (shared by EVSE, HeatPump, Inverter)
      type: object
      properties:
        powerConsumptionNominalMax:
          type: number
          format: double
          x-unit: W
          description: Nominal (rated) maximum power consumption
        contractualConsumptionNominalMax:
          type: number
          format: double
          x-unit: W
          description: Contractually agreed maximum power consumption (0 if unset)
    lppAPPL:
      title: Active Power Production Limit (APPL) data point
      type: object
      properties:
        isValueChangeable:
          type: boolean
          nullable: true
          description: >-
            Whether the production limit value may be changed by the controller.
            Reported by the device; ignored on write.
        active:
          type: boolean
          nullable: true
          description: >-
            Whether the limit is active. Required on POST (a request with
            active=null, or active=true with no value, is rejected with 400). Not
            required on PATCH.
        isLimitChangeable:
          type: boolean
          nullable: true
          description: >-
            Ignored on input — always cleared by the server before applying the
            request (read-only, device-reported).
        value:
          type: number
          x-unit: W
          nullable: true
          description: Power limit value. Required when active=true.
        durationSeconds:
          type: number
          x-unit: s
          nullable: true
          description: >-
            How long the limit stays in force, as a relative end time computed from
            now. Takes precedence over durationIndefinite: if both are set, the
            device still receives a finite expiry.
        durationIndefinite:
          type: boolean
          nullable: true
          description: >-
            When true and durationSeconds is omitted, clears any expiry the device
            previously had for this limit (making it indefinite). Has no effect if
            the device had no prior expiry, or if durationSeconds is also set.
    CobLimitDetails:
      title: COB power/PCC mode limit setpoint
      type: object
      description: >-
        Sent as-is to the device's SPINE Setpoint (ScaledNumber value, IsSetpointActive flag,
        optional TimePeriod.EndTime). Not range-checked against the device's or any LPP
        entity's nominal power limits before sending — the hub forwards whatever value the
        caller provides. The setpoint is a protocol write only; it is not coupled into the
        simulated battery's physics/state of charge.
      properties:
        active:
          type: boolean
          nullable: true
          description: Activates or deactivates the setpoint. Required (with value) to activate a limit.
        value:
          type: number
          x-unit: W
          nullable: true
          description: Setpoint value in Watts. Required when active is true. Not range-checked.
        duration:
          type: number
          x-unit: s
          nullable: true
          description: Setpoint validity duration in seconds. Omit or 0 for indefinite.
    CobFailsafeDetails:
      title: COB power/PCC mode failsafe setpoint
      type: object
      description: >-
        Sent as-is to the device's "failsafe*PowerSetpoint" device-configuration key. Not
        range-checked before sending.
      properties:
        value:
          type: number
          x-unit: W
          nullable: true
          description: Failsafe setpoint value in Watts. Required. Not range-checked.
        duration:
          type: number
          x-unit: s
          nullable: true
          description: Failsafe duration in seconds.
    CobModeData:
      title: COB mode data (either power or PCC mode) for one device
      type: object
      properties:
        limitDetails:
          $ref: '#/components/schemas/CobLimitDetails'
        failsafeDetails:
          $ref: '#/components/schemas/CobFailsafeDetails'
        setpoints:
          type: array
          description: 'One entry per setpoint the Inverter describes for this control mode: batteryAcPower
            or batteryDcPower for the power mode, pccPower for the PCC mode. A conformant Inverter describes
            exactly one per mode; every described setpoint is still listed, so an Inverter that wrongly publishes
            more stays visible. The first entry is the one limitDetails describes and every write for this
            control mode targets.'
          items:
            $ref: '#/components/schemas/CobSetpointConstraints'
    CobDeviceData:
      title: COB data for one paired controllable-system device
      type: object
      properties:
        deviceAddress:
          type: string
          description: SPINE device address of the remote entity
        ski:
          type: string
          description: Remote device SKI
        lastUpdate:
          type: string
          nullable: true
          description: ISO 8601 timestamp of the last received COB update
        activeMode:
          type: string
          nullable: true
          description: Currently active COB mode, "power" or "pcc"
        powerMode:
          $ref: "#/components/schemas/CobModeData"
        pccMode:
          $ref: "#/components/schemas/CobModeData"
    lppFSAPPL:
      title: Failsafe Production Active Power Limit (FSPAPL) data point
      type: object
      properties:
        isValueChangeable:
          type: boolean
          nullable: true
          description: Ignored on input — always cleared by the server before sending (read-only, device-reported).
        value:
          type: number
          x-unit: W
          nullable: true
          description: >-
            Failsafe power limit value applied when the device loses its heartbeat.
            Required on POST /hems/FailsafeActivePowerProductionLimit{,/{deviceAddress}}
            (400 if missing); not required on PATCH or on the
            FailsafeDurationForLpp endpoints (which send only durationSeconds).
        isDurationChangeable:
          type: boolean
          nullable: true
          description: Ignored on input — always cleared by the server before sending (read-only, device-reported).
        durationSeconds:
          type: number
          x-unit: s
          nullable: true
          description: >-
            Minimum failsafe duration. Required on POST
            /hems/FailsafeDurationForLpp{,/{deviceAddress}} (400 if missing); those
            two endpoints send only this field (value is cleared).
    realDevice:
      title: Real device registration request (POST /realDevice)
      description: >-
        Request body of `POST /realDevice`. The stored/returned record additionally
        carries a `deviceType`-scoped `id` assigned by the server and never carries
        `trustConnections` back — see `RealDeviceRecord` for the read shape
        (`GET /realDevices`, `GET /realDevice/{deviceType}/{deviceId}`).
      type: object
      required:
        - remoteSki
        - deviceType
      properties:
        trustConnections:
          type: array
          description: >-
            Optional simulated peers (must set `id`, not `ski` — see
            `POST /realDevice`) to mutually trust once the simulation starts.
            Write-only: never echoed back on read.
          items:
            $ref: "#/components/schemas/TrustPeerRef"
        remoteSki:
          type: string
          description: 40-character SKI of the physical device. Must not already be registered.
          example: "00-1D-A0-00-00-00-00-00-00-00-00-00-00-00-00-00-00-00"
        deviceName:
          type: string
        imgBase64:
          type: string
          description: Base64-encoded image, if any.
        deviceType:
          type: string
          description: >-
            SPINE device type of the real device. Exactly one value of type
            `EnergyManagementSystem` may exist across both real and simulated
            devices (see `POST /realDevice`); the other 13 values are unrestricted.
          enum:
            - Dishwasher
            - Dryer
            - EnvironmentSensor
            - Generic
            - HeatGenerationSystem
            - HeatSinkSystem
            - HeatStorageSystem
            - HVACController
            - SubMeter
            - Washer
            - ElectricitySupplySystem
            - EnergyManagementSystem
            - Inverter
            - ChargingStation
    RealDeviceRecord:
      title: Registered real device (read shape)
      description: >-
        The stored record returned by `GET /realDevices` and
        `GET /realDevice/{deviceType}/{deviceId}` (`internal.RealDevice`). Unlike
        the `realDevice` request schema, this never carries `trustConnections` (that
        field is write-only, consumed once at registration time) and always carries
        `id`.
      type: object
      properties:
        id:
          type: integer
          format: uint
          description: Id scoped to this record's `deviceType` (not globally unique).
        remoteSki:
          type: string
        deviceName:
          type: string
        imgBase64:
          type: string
        deviceType:
          type: string
          description: See the `realDevice` schema's `deviceType` enum for the full list of values.
    measurementData:
      title: Electrical measurement data
      type: object
      properties:
        power:
          type: array
          description: Power measurements per phase
          items:
            $ref: "#/components/schemas/MeasurementDataElementPower"
        energyConsumed:
          type: number
          description: Total energy consumed in Wh
        energyProduced:
          type: number
          description: Total energy produced in Wh
        current:
          type: array
          description: Current measurements per phase
          items:
            $ref: "#/components/schemas/MeasurementDataElementCurrent"
        voltage:
          type: array
          description: Voltage measurements per phase
          items:
            $ref: "#/components/schemas/MeasurementDataElementVoltage"
        frequency:
          type: number
          description: Grid frequency in Hz
    MPCMeasurementElement:
      title: Single MPC measurement value
      type: object
      properties:
        value:
          type: number
          format: double
          description: Meaning/unit depends on which MPCMeasurements field this element is under.
        valueState:
          type: string
          nullable: true
          description: Optional SPINE measurement value state (e.g. normal/error/outOfRange).
        timestamp:
          type: string
          nullable: true
          description: >-
            Optional RFC3339 timestamp for this reading. Only consumed on
            PATCH /evse/{evseId}/electricalMeasurements; the GET response never
            sets it.
    MPCMeasurements:
      title: MPC electrical measurements (mapped shape)
      type: object
      description: >-
        Mapped from the device's raw MeasurementData: total/per-phase values grouped
        by quantity, each carrying a bare numeric value (plus optional valueState
        and timestamp on write). This is the actual response shape of
        GET /evse/{evseId}/electricalMeasurements, and the request body shape of
        PATCH /inverter/{inverterId}/electricalMeasurements — the flat power/current/
        voltage arrays used by /evse/{evseId}/{mode,values},
        GET /inverter/{inverterId}/electricalMeasurements and other endpoints are a
        different, unrelated representation (measurementData).
      properties:
        powerTotal:
          allOf:
            - $ref: "#/components/schemas/MPCMeasurementElement"
          description: Total power. x-unit W.
        powerPerPhase:
          type: object
          description: Per-phase power, keyed by phase name (a, b, c). x-unit W.
          additionalProperties:
            $ref: "#/components/schemas/MPCMeasurementElement"
        energyConsumption:
          allOf:
            - $ref: "#/components/schemas/MPCMeasurementElement"
          description: Total energy consumed. x-unit Wh.
        energyProduction:
          allOf:
            - $ref: "#/components/schemas/MPCMeasurementElement"
          description: Total energy produced. x-unit Wh.
        currentPerPhase:
          type: object
          description: Per-phase current, keyed by phase name (a, b, c). x-unit A.
          additionalProperties:
            $ref: "#/components/schemas/MPCMeasurementElement"
        voltagePerPhase:
          type: object
          description: Per-phase voltage, keyed by phase name (a, b, c). x-unit V.
          additionalProperties:
            $ref: "#/components/schemas/MPCMeasurementElement"
        frequency:
          allOf:
            - $ref: "#/components/schemas/MPCMeasurementElement"
          description: Grid frequency. x-unit Hz.
    HeatPumpInfo:
      title: Heat Pump configuration
      description: Request/response body for `POST /heatpump/add`, `PATCH /heatpump/{heatPumpId}` and (embedded
        as `DeviceInfo`) `HeatPumpControlBlock`. Field bounds noted below are enforced by `validateHeatPumpInfo`
        on both add and update.
      type: object
      properties:
        trustConnections:
          type: array
          description: 'Optional peers to mutually trust when the simulation starts (see `POST /heatpump/add`).
            Write-only: never echoed back on read.'
          items:
            $ref: '#/components/schemas/TrustPeerRef'
        deviceName:
          type: string
          description: Required (non-empty), and must be unique across every existing heat pump.
        deviceCode:
          type: string
          description: Required (non-empty).
        serialNumber:
          type: string
          description: Required (non-empty). Combined with vendor.code and deviceModel must be unique.
        softwareRev:
          type: string
        hardwareRev:
          type: string
        vendor:
          type: object
          properties:
            name:
              type: string
              description: Required (non-empty).
            code:
              type: string
              description: Required (non-empty). Combined with serialNumber and deviceModel must be unique.
        brandName:
          type: string
          description: Required (non-empty) on the request, but ignored on create — the server always overwrites
            it to "Coretech-Innovations" regardless of what is sent (see POST /heatpump/add). Preserved from
            the existing value on PATCH regardless of what is sent there too.
        manufacturer:
          type: object
          properties:
            label:
              type: string
            description:
              type: string
        deviceModel:
          type: string
          description: Combined with vendor.code and serialNumber must be unique.
        imgBase64:
          type: string
        evseccEnabled:
          type: boolean
        mpcEnabled:
          type: boolean
          description: Overwritten from the server's license-derived MPC availability on create — see POST
            /heatpump/add.
        lpcEnabled:
          type: boolean
          description: LPC use case enabled. Overwritten from the server's license-derived LPC availability
            on create when that value is set — see POST /heatpump/add.
        power:
          type: number
          x-unit: W
          description: Good approximation of power consumption (OHPCF).
        powerMax:
          type: number
          x-unit: W
          description: Maximum power consumption (OHPCF).
        failsafeValue:
          type: number
          x-unit: W
          minimum: 0
          description: Failsafe power limit value. Required, must be >= 0.
        failsafeDuration:
          type: number
          x-unit: h
          minimum: 2
          maximum: 24
          description: Failsafe duration. Required, must be in [2, 24] hours.
        failsafeDurationMax:
          type: number
          x-unit: h
          minimum: 2
          maximum: 24
          description: Maximum failsafe duration. Required, must be in [2, 24] hours.
        nominalPower:
          type: object
          description: Nominal power range. Despite the omitempty JSON tag, this object is effectively required
            — a missing object is rejected the same as an invalid one.
          properties:
            min:
              type: number
              x-unit: W
              minimum: 0
              description: Must be >= 0 and less than nominalPower.max.
            max:
              type: number
              x-unit: W
              minimum: 0
              description: Must be >= 0 and, when nominalCurrent is present, strictly greater than nominalCurrent.min
                (a cross-field bound, not a units mismatch).
        contractualPowerMax:
          type: number
          x-unit: W
          description: Maximum contractual power in W
        nominalCurrent:
          type: object
          description: Nominal current range. Despite the omitempty JSON tag, this object is effectively required
            — a missing object is rejected the same as an invalid one.
          properties:
            min:
              type: number
              x-unit: A
              minimum: 0
              description: Must be >= 0 and strictly less than nominalPower.max.
            max:
              type: number
              x-unit: A
              minimum: 0
              description: Must be >= 0 and strictly greater than nominalCurrent.min.
        approveWriteLimit:
          type: boolean
          description: Whether to approve write limit operations
        state:
          type: string
          description: OHPCF state (see the `state` property on OhpcfMonitorData for the reachable values).
        startTime:
          type: string
          description: OHPCF scheduled start time (SPINE AbsoluteOrRelativeTime string).
        activeDurationMinSeconds:
          type: number
          x-unit: s
          description: 'Minimum active duration for the announced OHPCF power sequence. Pointer field on the
            Go side: null until the heat pump reports it.'
          nullable: true
        pauseDurationMinSeconds:
          type: number
          x-unit: s
          description: 'Minimum pause duration for the announced OHPCF power sequence. Pointer field on the
            Go side: null until the heat pump reports it.'
          nullable: true
        isstoppable:
          type: boolean
          nullable: true
          description: 'Pointer field on the Go side: null until the heat pump reports it.'
        ispauseable:
          type: boolean
          nullable: true
          description: 'Pointer field on the Go side: null until the heat pump reports it.'
        heartbeatTimeoutInSeconds:
          type: integer
          format: int64
          minimum: 2
          maximum: 86400
          description: 'SPINE heartbeat timeout advertised to peers, in seconds. Optional: when the field
            is omitted the device type''s default applies - 4 for EVSE, heat pump and HEMS, 60 for inverter
            and control box. An explicit 0, or a value outside 2..86400, is rejected with 400; the lower bound
            exists because SPINE only applies its 2 s transmit margin above 2 s, the upper bound because the
            value is converted to a duration. The timeout is handed to the eebus service at setup, so it can
            only be changed while that service does not exist yet; a change after the device is started is
            rejected with 409.'
    HeatPumpControlBlock:
      title: Heat Pump status and control information
      description: >-
        Response shape of `GET /heatpump/list` (array) and `GET /heatpump/{heatPumpId}`
        (single). Serialized from a Go struct where `DeviceInfo` and `DeviceState`
        have no JSON tag, so those two keys are capitalized on the wire — every
        other field is the usual camelCase.
      type: object
      properties:
        testingMode:
          type: boolean
          description: >-
            Whether the heat pump is in testing mode (pinned values) rather than
            simulation mode.
        heatPumpId:
          type: integer
          format: uint
        DeviceInfo:
          allOf:
            - $ref: "#/components/schemas/HeatPumpInfo"
          description: >-
            On GET, embeds a populated `OhpcfMonitorData` snapshot (state, power,
            durations, etc. — see `GetOhpcfMonitorData`) even though the request-body
            side of `HeatPumpInfo` treats those as plain top-level fields.
        ski:
          type: string
          description: Local SKI (empty until the heat pump's EEBUS service has started — see POST /heatpump/{heatPumpId}/trust).
        deviceAddress:
          type: string
        connectedToHEMS:
          type: boolean
        remoteSki:
          type: string
        LPCCurrentState:
          description: The controllable-system FSM state. Empty if LPC is disabled. See CSState for the meaning of each value.
          allOf:
            - $ref: "#/components/schemas/CSState"
        LPCActivePowerLimit:
          type: number
          x-unit: W
          description: >-
            The effective total power limit (`GetTotalPowerLimit`) — nominal max
            power when there is no controllable system, else the CS's current
            effective limit. Populated on both `GET /heatpump/list` and
            `GET /heatpump/{heatPumpId}`.
        DeviceState:
          $ref: "#/components/schemas/DeviceStateData"
        currentPower:
          type: number
          x-unit: W
          description: >-
            Current power consumption. Only set on `GET /heatpump/list`;
            `GET /heatpump/{heatPumpId}` (single) does not compute it, and because
            the field carries `omitempty` the key is absent from that response
            entirely rather than present as 0.
        ohpcfAccepted:
          type: boolean
          description: >-
            Whether the heat pump's current OHPCF state is one the HEMS has accepted
            into an active process (scheduled/running/paused — see `IsOhpcfAccepted`).
            Only computed on `GET /heatpump/list`; on `GET /heatpump/{heatPumpId}`
            (single) this field has no `omitempty` tag, so it is always present but
            always `false` there regardless of the heat pump's actual OHPCF state.
    OhpcfMonitorData:
      title: OHPCF (Optimization Of Self Consumption by Heat Pump Compressor Flexibility) data
      type: object
      description: >-
        The SPINE PowerSequence the heat pump's Compressor entity most recently announced
        (Alternatives[0].PowerSequence[0] of its SmartEnergyManagementPsData). Only populated
        once the heat pump has announced an optional power-consumption process — see
        `POST /heatpump/{heatPumpId}/announceOptional` — otherwise the device is omitted
        entirely from `GET /hems/OhpcfMonitorData`.
      properties:
        state:
          type: string
          nullable: true
          description: >-
            Current PowerSequence state, as last reported by the heat pump. The
            underlying SPINE type defines a broader value set, but this
            implementation's state machine (`ohpcfAllowedTransitions`,
            `isValidOhpcfState`, `GetDeviceState`) only ever produces/accepts these
            six — `inactive` is also the fallback reported before any process has
            ever been announced.
          enum: [inactive, scheduled, running, paused, completed, invalid]
        startTime:
          type: string
          nullable: true
          description: Scheduled/last-written start time, as reported by the device (SPINE AbsoluteOrRelativeTime string).
        activeDurationMinSeconds:
          type: number
          x-unit: s
          nullable: true
          description: Minimum active duration for the announced power sequence, in seconds.
        pauseDurationMinSeconds:
          type: number
          x-unit: s
          nullable: true
          description: Minimum pause duration for the announced power sequence, in seconds.
        isstoppable:
          type: boolean
          nullable: true
          description: Whether the heat pump reports the running sequence can be stopped early.
        ispauseable:
          type: boolean
          nullable: true
          description: >-
            Whether the heat pump reports the running sequence can be paused. Informational
            only — PATCH /hems/ChangeOhpcfState does not enforce this before writing "paused".
        completionDuration:
          type: string
          nullable: true
          description: Reserved for a future completion-duration field. Never populated by the current handler.
        stateResetTimeout:
          type: string
          nullable: true
          description: Reserved for a future state-reset-timeout field. Never populated by the current handler.
        power:
          type: number
          x-unit: W
          nullable: true
          description: Approximate power consumption of the announced sequence, from its PowerTimeSlot ValueList.
        powerMax:
          type: number
          x-unit: W
          nullable: true
          description: Maximum power consumption of the announced sequence, from its PowerTimeSlot ValueList.
    ohpcfStartTime:
      title: OHPCF start time write request
      type: object
      description: >-
        Body for POST/PATCH /hems/SendOhpcfStartTime/{deviceAddress}. Both methods are
        identical (POST and PATCH register the same handler) and behave the same way.
      properties:
        startTime:
          type: number
          x-unit: s
          description: >-
            Start time to schedule, as a duration in seconds converted internally to a SPINE
            AbsoluteOrRelativeTime and written to the device's PowerSequence.Schedule.StartTime.
            Not an ISO 8601 timestamp despite the field name.
          example: 3600
    ohpcfChangeState:
      title: OHPCF state write request
      type: object
      properties:
        state:
          type: string
          description: >-
            Target PowerSequence state to write. The hub is a testing tool: this value is
            forwarded to the device as-is with no client-side transition validation — a
            tester can request a transition the OHPCF state machine would normally forbid
            to observe the device's reaction. The values below are the SPINE-defined states;
            any string is accepted and sent verbatim.
          enum: [running, paused, scheduled, scheduledPaused, pending, inactive, completed, invalid]

    MdnsEntry:
      title: Discovered mDNS entry
      type: object
      description: One SHIP-capable device advertisement seen by the mDNS scanner.
      properties:
        name:
          type: string
          description: mDNS service instance name.
        host:
          type: string
          description: Advertised hostname.
        addresses:
          type: array
          description: IP addresses the device advertised.
          items:
            type: string
        port:
          type: integer
          description: SHIP WebSocket port.
        elements:
          type: object
          description: >-
            Raw mDNS TXT record key/value pairs as advertised by the device.
            Always includes "ski" (the device's 40-character SHIP identity),
            which is required for the entry to be listed at all; other keys are
            device-specific (e.g. "brand" is used to identify and, by default,
            suppress this hub's own simulated entities from the list).
          additionalProperties:
            type: string

    testingDUTEnvironment:
      type: object
      properties:
        ski:
          type: string
          description: DUT SKI, formatted as 40 hexadecimal characters
        shipId:
          type: string
        rpcUrl:
          type: string
          description: DUT JSON-RPC server address in host:port format
          example: 127.0.0.1:8081
        stopOnFirstFailure:
          type: boolean
          description: Stop the active run after the first failed test case.

    testingSuiteConfig:
      type: object
      properties:
        dutNominalPowerConsumptionMaxWatt:
          type: number
          format: double
        dutFailsafeDurationMaxSeconds:
          type: number
          format: double
          minimum: 7200
          maximum: 86400
        dutFailsafeInitialDurationSeconds:
          type: number
          format: double
          minimum: 7200
          maximum: 86400
        dutFailsafeInitialValueWatt:
          type: number
          format: double
        dutActivePowerConsumptionLimitMinWatt:
          type: number
          format: double
        dutNominalPowerProductionMaxWatt:
          type: number
          format: double
        dutActivePowerProductionLimitMinWatt:
          type: number
          format: double
        dutFailsafeProductionInitialValueWatt:
          type: number
          format: double
        dutIsHEMS:
          type: boolean
          description: Declares whether the DUT (acting as a Controllable System) is also a HEMS. Gates ATC_COM_PT_CSUnlCntrl_002
            (runs only when true) and ATC_COM_PT_CSUnlCntrl_003 (runs only when false) in the lpc-cs/lpp-cs
            suites. Optional; defaults to false (non-HEMS) when omitted.
        spsRingBufferSize:
          type: integer
        mpcMu:
          $ref: '#/components/schemas/testingMpcMuCapabilities'
        mpcMa:
          $ref: '#/components/schemas/testingMpcMaCapabilities'
        dutFailsafeConsumptionLimitMinWatt:
          type: number
          format: double
          description: FCAPLmin, the lower bound of the declared Failsafe Consumption Active Power Limit range
            (TestSpec V1.0.2 section 6.11.5). Optional; when this and dutFailsafeConsumptionMaxWatt are both
            unset the APCL range is used instead.
        dutFailsafeConsumptionMaxWatt:
          type: number
          format: double
          description: FCAPLmax, the upper bound of the declared failsafe consumption range.
        dutFailsafeProductionLimitMinWatt:
          type: number
          format: double
          description: FPAPLmin, the lower bound of the declared Failsafe Production Active Power Limit range.
            Optional; falls back to the APPL range when unset. Unlike APPL, FPAPL values are positive magnitudes.
        dutFailsafeProductionMaxWatt:
          type: number
          format: double
          description: FPAPLmax, the upper bound of the declared failsafe production range.
        dutStartUpDurationCsSeconds:
          type: number
          format: double
          minimum: 0
          description: 'StartUpDur_CS from the LPC ParameterSheet: seconds from power on until the Controllable
            System reaches CF_CS_Init. Required for the lpc-cs suite; ATC_LPC_COM_PT_CSConnection_009 compares
            it with dutStartUpDurationEgSeconds to evaluate TestSpec V1.0.2 Table 31 step 4.'
        dutStartUpDurationEgSeconds:
          type: number
          format: double
          minimum: 0
          description: 'StartUpDur_EG from the LPC ParameterSheet: seconds from power on until the Energy
            Guard reaches CF_EG_ConnectionEstablished. Required for the lpc-cs suite; see dutStartUpDurationCsSeconds.'
        lpcOptionalSupport:
          $ref: '#/components/schemas/testingLpcOptionalSupport'
        lppOptionalSupport:
          $ref: '#/components/schemas/testingLppOptionalSupport'
        ship:
          $ref: '#/components/schemas/testingShipParameters'
