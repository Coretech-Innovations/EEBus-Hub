    HeatPumpNotFound:
      description: Heat pump not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/statusError'
    NoExistingEvIdNotFound:
      description: no existing EV with this ID number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/statusError'
    NoHemsFoundUpper:
      description: no HEMS found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/statusError'
    HemsNotFound:
      description: HEMS not found
      content:
        application/json:
