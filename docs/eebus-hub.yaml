          description: MOI live value, set only for the inverter.
        acYieldYearInWattHours:
          type: number
          x-unit: Wh
          description: MOI live value, set only for the inverter.
    SimulationModeRequest:
      title: Simulation/testing mode toggle
      description: >-
        Body of PATCH /{device}/:id/mode. It toggles the mode; pinned values are set
        via the matching /values endpoint. On an EVSE or inverter, enabling also puts
        its children (connected EVs; battery and PV string) into testing mode, and
        they cannot leave it while the parent stays in it. Disabling returns the
        children that are in testing mode because of the parent to simulation mode. On
        a child, enabling makes its testing mode its own, so it no longer follows the
        parent.
      type: object
      required:
        - testingMode
      properties:
        testingMode:
          type: boolean
          description: True enables testing mode, false returns to simulation.
    EVForcedValuesRequest:
      title: EV forced-values request
      description: >-
        Body of PATCH /ev/:id/values — measurement overrides pinned while in testing
        mode. Every field is optional; an omitted field keeps its current value.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - type: object
          properties:
            forcedPowerInWatts:
              type: number
              description: Total AC charging power pinned in testing mode (positive = charging, negative = discharging).
            forcedStateOfChargeInPercent:
              type: number
              description: State of charge pinned in testing mode, 0..100.
    EVModeStatus:
      title: EV simulation/testing mode status
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - type: object
          properties:
            mode:
              $ref: "#/components/schemas/DeviceSimulationMode"
            lockedByParent:
              type: boolean
              description: >-
                True while the EV's EVSE is in testing mode: the EV must stay in testing
                mode, and PATCH /ev/{evId}/mode with testingMode false returns 409.
            forcedPowerInWatts:
              type: number
              nullable: true
            forcedStateOfChargeInPercent:
              type: number
              nullable: true
            live:
              $ref: "#/components/schemas/TestingLiveReadings"
    EVSEForcedValuesRequest:
      title: EVSE forced-values request
      description: >-
        Body of PATCH /evse/:id/values — measurement overrides pinned while in testing
        mode. Every field is optional; an omitted field keeps its current value.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - $ref: "#/components/schemas/TestingPerPhasePower"
        - type: object
          properties:
            forcedPowerInWatts:
              type: number
              description: Total power pinned in testing mode, split evenly across the three phases.
    EVSEModeStatus:
      title: EVSE simulation/testing mode status
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - $ref: "#/components/schemas/TestingPerPhasePower"
        - type: object
          properties:
            mode:
              $ref: "#/components/schemas/DeviceSimulationMode"
            forcedPowerInWatts:
              type: number
              nullable: true
            currentState:
              $ref: "#/components/schemas/CSState"
            live:
              $ref: "#/components/schemas/TestingLiveReadings"
    HeatPumpForcedValuesRequest:
      title: Heat pump forced-values request
      description: >-
        Body of PATCH /heatpump/:id/values — measurement overrides pinned while in
        testing mode. Every field is optional; an omitted field keeps its current value.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - type: object
          properties:
            forcedPowerInWatts:
              type: number
              x-unit: W
              description: Total power pinned in testing mode.
    HeatPumpModeStatus:
      title: Heat pump simulation/testing mode status
      description: Response of GET/PATCH /heatpump/{heatPumpId}/mode and PATCH /heatpump/{heatPumpId}/values.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - type: object
          properties:
            mode:
              $ref: "#/components/schemas/DeviceSimulationMode"
            forcedPowerInWatts:
              type: number
              x-unit: W
              nullable: true
            currentState:
              description: The controllable-system FSM state. Empty if the heat pump has no controllable system (LPC disabled). See CSState for the meaning of each value.
              allOf:
                - $ref: "#/components/schemas/CSState"
            ohpcfState:
              type: string
              description: >-
                Live OHPCF power-sequence state (empty only if OHPCF not supported;
                "inactive" once supported but no process has been announced) — see
                the `state` property on OhpcfMonitorData for the reachable values.
            ohpcfSupported:
              type: boolean
              description: >-
                True when the heatpump exposes the OHPCF feature; the UI shows the
                Force OHPCF State control only then.
            live:
              $ref: "#/components/schemas/TestingLiveReadings"
    InverterForcedValuesRequest:
      title: Inverter AC-level forced-values request
      description: >-
        Body of PATCH /inverter/:id/values — pins the inverter's AC MPC report verbatim
        while in testing mode. The inverter's AC values are otherwise derived from its
        battery/PV sub-devices. The inverter reports no per-phase power over SPINE, so it
        has no per-phase power pins. Every field optional.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - $ref: "#/components/schemas/TestingInverterMOI"
        - type: object
          properties:
            forcedTotalPowerInWatts:
              type: number
              x-unit: W
              description: Total AC power pinned in testing mode.
    InverterModeStatus:
      title: Inverter AC-level simulation/testing mode status
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - $ref: "#/components/schemas/TestingInverterMOI"
        - type: object
          properties:
            mode:
              $ref: "#/components/schemas/DeviceSimulationMode"
            forcedTotalPowerInWatts:
              type: number
              x-unit: W
              nullable: true
              description: The pinned total AC power, if testing mode is active.
            lpcState:
              $ref: "#/components/schemas/CSState"
            lppState:
              $ref: "#/components/schemas/CSState"
            live:
              $ref: "#/components/schemas/TestingLiveReadings"
    InverterControlBlock:
      title: Inverter status and control information
      type: object
      properties:
        testingMode:
          type: boolean
          description: >-
            Whether the inverter is in testing mode (pinned values) rather than
            simulation mode. Enabling it also enables it on its battery and PV string;
            while the inverter stays in testing mode they cannot leave it. Disabling
            returns the sub-devices that are in testing mode because of the inverter to
            simulation mode.
        batteryTestingMode:
          type: boolean
          description: >-
            Whether the battery sub-device is in testing mode; false when the inverter
            has no battery.
        pvStringTestingMode:
          type: boolean
          description: >-
            Whether the PV string sub-device is in testing mode; false when the
            inverter has no PV string.
        inverterId:
          type: integer
        DeviceInfo:
          $ref: "#/components/schemas/InverterInfo"
        ski:
          type: string
        deviceAddress:
          type: string
        connectedToHEMS:
          type: boolean
        remoteSki:
          type: string
        LPCCurrentState:
          $ref: "#/components/schemas/CSState"
        LPPCurrentState:
          $ref: "#/components/schemas/CSState"
        DeviceState:
          $ref: "#/components/schemas/DeviceStateData"
    ControlBoxInfo:
      title: ControlBox configuration
      description: 'Go type `api.ControlBoxInfo`. Note the mixed field-name casing carried over from the Go
        JSON tags: DeviceName/ImgBase64 are capitalized while every other property is lowerCamelCase.'
      type: object
      properties:
        trustConnections:
          type: array
          description: Optional peers to mutually trust when the simulation starts. Accepted on POST /controlbox/add
            only.
          items:
            $ref: '#/components/schemas/TrustPeerRef'
        DeviceName:
          type: string
        vendorCode:
          type: string
          description: Required on POST /controlbox/add (400 "Invalid" per-field otherwise).
        deviceBrand:
          type: string
          description: Required non-empty on POST /controlbox/add, but the value sent is discarded — the server
            always overwrites it with "Coretech-Innovations" after validation.
        deviceModel:
          type: string
          description: Required on POST /controlbox/add (400 "Invalid" per-field otherwise).
        serialNumber:
          type: string
          description: Required on POST /controlbox/add (400 "Invalid" per-field otherwise).
        ImgBase64:
          type: string
          description: Base64-encoded device image. Managed on GET/PATCH /controlbox and the /controlbox/image
            endpoints.
        heartbeatState:
          type: string
          enum:
          - Running
          - Stopped
          description: Whether the ControlBox's heartbeat sender is running. Reflects the same state as GET
            /controlbox/heartbeat (that endpoint's response wraps this value as {status, state} rather than
            exposing it bare).
        lpcUseCaseEnabled:
          type: boolean
          nullable: true
          description: Set server-side from the license/feature configuration when the ControlBox is created
            — not settable by the client. See LPC use case gating notes on /controlbox/ActivePowerConsumptionLimit.
        mpcUseCaseEnabled:
          type: boolean
          nullable: true
          description: Set server-side from the license/feature configuration; not settable by the client.
        lppUseCaseEnabled:
          type: boolean
          nullable: true
          description: Set server-side from the license/feature configuration; not settable by the client.
        mgcpUseCaseEnabled:
          type: boolean
          nullable: true
          description: Set server-side from the license/feature configuration; not settable by the client.
            Gates the ControlBox's MGCP GCP (grid connection point) meter role — see the ControlBox role note
            on GET /controlbox/MpcMeasurementData.
        heartbeatTimeoutInSeconds:
          type: integer
          format: int64
          minimum: 2
          maximum: 86400
          description: 'SPINE heartbeat timeout advertised to peers, in seconds. Optional: when the field
            is omitted the device type''s default applies - 4 for EVSE, heat pump and HEMS, 60 for inverter
            and control box. An explicit 0, or a value outside 2..86400, is rejected with 400; the lower bound
            exists because SPINE only applies its 2 s transmit margin above 2 s, the upper bound because the
            value is converted to a duration. The timeout is handed to the eebus service at setup, so it can
            only be changed while that service does not exist yet; a change after the device is started is
            rejected with 409.'
    ControlBoxPairRequest:
      title: ControlBox SHIP pairing request
      description: Go type `api.ControlBoxPairRequest`. Either `qrcodeText` alone, or the three `for*`/`secret`
        fields together, must be supplied — see POST /controlbox/pairRequest for the exact precedence and
        validation.
      type: object
      properties:
        qrcodeText:
          type: string
          nullable: true
          description: The full text encoded in the target device's SHIP pairing QR code. When present (non-empty),
            shipId/fingerprint/secret are extracted from it via regex and the for*/secret fields below are
            ignored.
        forId:
          type: string
          nullable: true
          description: SHIP ID of the target device. Used only when qrcodeText is absent.
        forPar:
          type: string
          nullable: true
          description: SHA-256 fingerprint (hex) of the target device's certificate. Used only when qrcodeText
            is absent.
        secret:
          type: string
          nullable: true
          description: Pairing secret, hex-encoded. Used only when qrcodeText is absent.
        remoteSki:
          type: string
        deviceAddress:
          type: string
    LpcDeviceData:
      title: LPC data for a specific device
      description: Go type `api.LpcDeviceData`. Field names below are the actual JSON keys (`json:"activePowerConsumptionLimit"`
        etc.) — do not confuse with the shorter Go field names (Apcl/Fscapl/Constraints).
      type: object
      properties:
        deviceAddress:
          type: string
          description: SPINE device address, usable as the `{deviceAddress}` path parameter on the per-device
            LPC endpoints
        ski:
          type: string
          description: SKI of the remote device
        activePowerConsumptionLimit:
          $ref: '#/components/schemas/lpcAPCL'
          description: Current Active Power Consumption Limit reported by the device. Null if it could not
            be read.
        failsafeActivePowerConsumption:
          $ref: '#/components/schemas/FCAPL'
          description: Current failsafe consumption power limit/duration reported by the device. Null if it
            could not be read.
        powerConsumptionConstraints:
          type: object
          nullable: true
          description: Null if the device's electrical-connection characteristics could not be read.
          properties:
            powerConsumptionNominalMax:
              type: number
              x-unit: W
              description: Device's nominal maximum power consumption
            contractualConsumptionNominalMax:
              type: number
              x-unit: W
              description: Contractually agreed maximum power consumption
    LppDeviceData:
      title: LPP data for a specific device
      description: Go type `api.LppDeviceData`. Field names below are the actual JSON keys (`json:"activePowerProductionLimit"`
        etc.) — do not confuse with the shorter Go field names (Appl/Fspapl/Constraints).
      type: object
      properties:
        deviceAddress:
          type: string
          description: SPINE device address, usable as the `{deviceAddress}` path parameter on the per-device
            LPP endpoints
        ski:
          type: string
          description: SKI of the remote device
        activePowerProductionLimit:
          $ref: '#/components/schemas/lppAPPL'
          description: Current Active Power Production Limit reported by the device. Null if it could not
            be read.
        failsafeActivePowerProduction:
          $ref: '#/components/schemas/lppFSAPPL'
          description: Current failsafe production power limit/duration reported by the device. Null if it
            could not be read.
        powerProductionConstraints:
          type: object
          nullable: true
          description: Null if the device's electrical-connection characteristics could not be read.
          properties:
            powerProductionNominalMax:
              type: number
              x-unit: W
              description: Device's nominal maximum power production
            contractualProductionNominalMax:
              type: number
              x-unit: W
              description: Contractually agreed maximum power production
    BatteryManufacturerData:
      title: Battery manufacturer identification (MOB use case)
      type: object
      description: Static manufacturer/nameplate data for a remote battery, discovered over MOB.
      properties:
        deviceName:
          type: string
          nullable: true
        deviceCode:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        softwareRevision:
          type: string
          nullable: true
        hardwareRevision:
          type: string
          nullable: true
        manufacturerName:
          type: string
          nullable: true
        batteryLabel:
          type: string
          nullable: true
        batteryType:
          type: string
          nullable: true
        batteryCapacityNominalMax:
          type: number
          x-unit: Wh
          nullable: true
          description: Nominal maximum energy capacity.
        batteryDCChargePowerNominalMax:
          type: number
          x-unit: W
          nullable: true
          description: Nominal maximum DC charge power.
        batteryDCDischargePowerNominalMax:
          type: number
          x-unit: W
          nullable: true
          description: Nominal maximum DC discharge power.
        batteryMaximumChargeDischargeCycleCountPerDay:
          type: integer
          nullable: true
        capacity:
          type: number
        nominalVoltage:
          type: number
        manufacturer:
          type: string
    BatteryStateData:
      title: Battery state data (MOB use case)
      type: object
      description: Instantaneous battery state, discovered over MOB.
      properties:
        batteryStateOfCharge:
          type: number
          x-unit: '%'
          nullable: true
        batteryStateOfEnergy:
          type: number
          x-unit: Wh
          nullable: true
        batteryDCPower:
          type: number
          x-unit: W
          nullable: true
          description: Positive sign convention per the device's MOB reporting; not normalized by the hub.
        batteryDCCurrent:
          type: number
          x-unit: A
          nullable: true
        batteryDCVoltage:
          type: number
          x-unit: V
          nullable: true
        internalTemperature:
          type: number
          x-unit: C
          nullable: true
        temperature:
          type: number
        errorState:
          type: string
        operatingState:
          type: string
        chargingState:
          type: string
    BatteryMeasurements:
      title: Battery measurement data (MOB use case)
      type: object
      description: Cumulative/health measurements for a remote battery, discovered over MOB.
      properties:
        batteryState:
          type: string
          nullable: true
          description: Device-reported battery state string (e.g. charging/discharging/idle), not a fixed
            hub-defined enum.
        batteryStateOfHealth:
          type: number
          x-unit: '%'
          nullable: true
        batteryUsableCapacity:
          type: number
          x-unit: Wh
          nullable: true
        batteryTotalDCChargeEnergy:
          type: number
          x-unit: Wh
          nullable: true
          description: Lifetime cumulative DC charge energy.
        batteryTotalDCDischargeEnergy:
          type: number
          x-unit: Wh
          nullable: true
          description: Lifetime cumulative DC discharge energy.
        cumulatedLoadCycleCount:
          type: number
          nullable: true
        power:
          type: number
        current:
          type: number
        voltage:
          type: number
        energyProduced:
          type: number
        energyConsumed:
          type: number
    InverterIdentification:
      title: Inverter identification data (MOI use case)
      type: object
      description: Static identification/classification data for a remote inverter, discovered over MOI. Two
        fields carry unusual (capitalized) JSON keys — VendorName/VendorCode — this mirrors the actual wire
        format, it is not a documentation typo.
      properties:
        deviceName:
          type: string
        deviceCode:
          type: string
        serialNumber:
          type: string
        softwareRevision:
          type: string
        hardwareRevision:
          type: string
        VendorName:
          type: string
          description: Capitalized JSON key as sent on the wire (not "vendorName").
        VendorCode:
          type: string
          description: Capitalized JSON key as sent on the wire (not "vendorCode").
        brandName:
          type: string
        inverterLabel:
          type: string
          nullable: true
        inverterDescription:
          type: string
          nullable: true
        gridCode:
          type: string
        manufacturer:
          type: string
        softwareRev:
          type: string
        hardwareRev:
          type: string
        inverterType:
          type: string
    InverterState:
      title: Inverter operating state (MOI use case)
      type: object
      properties:
        operatingState:
          type: string
        vendorStateCode:
          type: string
        pvStringAvailability:
          type: string
        batteryAvailability:
          type: string
        gridConnection:
          type: string
        functionalityStates:
          type: array
          items:
            type: string
          description: Detailed inverter-state functionality flags reported by the device.
        failureStates:
          type: array
          items:
            type: string
          description: Detailed inverter-state failure flags reported by the device.
    InverterCapabilities:
      title: Inverter capability limits (embedded in inverter measurement data)
      type: object
      description: Nominal power limits discovered from the device's ElectricalConnection characteristics. Absent (0-value) fields were not discovered.
      properties:
        activePowerProdNominalMax:
          type: number
          x-unit: W
          nullable: true
        apparentPowerProdNominalMax:
          type: number
          x-unit: VA
          nullable: true
        activePowerConsNominalMax:
          type: number
          x-unit: W
          nullable: true
        apparentPowerConsNominalMax:
          type: number
          x-unit: VA
          nullable: true
        batteryChargePowerNominalMin:
          type: number
          x-unit: W
          nullable: true
        batteryChargePowerNominalMax:
          type: number
          x-unit: W
          nullable: true
        batteryChargePowerMax:
          type: number
          x-unit: W
          nullable: true
        timeToChargePowerMax:
          type: number
          x-unit: s
          nullable: true
        batteryDischargePowerNominalMin:
          type: number
          x-unit: W
          nullable: true
        batteryDischargePowerNominalMax:
          type: number
          x-unit: W
          nullable: true
        batteryDischargePowerMax:
          type: number
          x-unit: W
          nullable: true
        timeToDischargePowerMax:
          type: number
          x-unit: s
          nullable: true
    InverterMeasurementDataElementEnergy:
      title: Inverter energy measurement element
      type: object
      properties:
        type:
          type: string
          nullable: true
          description: Energy counter type as reported by the device (e.g. produced/consumed).
        value:
          type: number
          x-unit: Wh
          nullable: true
    InverterMeasurementData:
      title: Inverter measurement data (MOI use case)
      type: object
      properties:
        power:
          type: array
          description: Power measurements, W, one entry per phase or a single unlabeled total entry.
          items:
            $ref: '#/components/schemas/MeasurementDataElementPower'
        energy:
          type: array
          description: Energy counters. Field order/count depends on what the device reports; may be empty.
          items:
            $ref: '#/components/schemas/InverterMeasurementDataElementEnergy'
        acCosPhi:
          type: number
          nullable: true
          description: AC power factor (cos phi), unitless.
        temperature:
          type: number
          x-unit: C
          nullable: true
        capabilities:
          $ref: '#/components/schemas/InverterCapabilities'
        energyProduced:
          type: number
        energyConsumed:
          type: number
        current:
          type: array
          items:
            type: number
        voltage:
          type: array
          items:
            type: number
        frequency:
          type: number
    ExternalGridMeasurement:
      title: Aggregated grid measurement (response of GET /hems/gridmeasurement)
      type: object
      properties:
        status:
          type: string
        measurement:
          type: object
          description: Instantaneous three-phase grid measurement. Serialized from
            internal.GridMeasurement, whose fields carry no JSON tags — hence the
            capitalized keys. Each sub-object below (except Power) has per-phase A/B/C
            values, and every key is always present.
          required:
          - Voltage
          - VoltageLine
          - Current
          - Power
          - Frequency
          - PowerFactor
          - Lag
          properties:
            Voltage:
              type: object
              description: Phase-to-neutral voltage, V
              properties:
                A:
                  type: number
                  x-unit: V
                  description: Phase-to-neutral voltage on this phase
                B:
                  type: number
                  x-unit: V
                  description: Phase-to-neutral voltage on this phase
                C:
                  type: number
                  x-unit: V
                  description: Phase-to-neutral voltage on this phase
            VoltageLine:
              type: object
              description: Phase-to-phase voltage (A=AB, B=BC, C=CA), V
              properties:
                A:
                  type: number
                  x-unit: V
                  description: Phase-to-phase voltage on this pair
                B:
                  type: number
                  x-unit: V
                  description: Phase-to-phase voltage on this pair
                C:
                  type: number
                  x-unit: V
                  description: Phase-to-phase voltage on this pair
            Current:
              type: object
              description: Current, A
              properties:
                A:
                  type: number
                  x-unit: A
                  description: Current on this phase
                B:
                  type: number
                  x-unit: A
                  description: Current on this phase
                C:
                  type: number
                  x-unit: A
                  description: Current on this phase
            Power:
              type: number
              x-unit: W
              description: Total (summed) active power
            Frequency:
              type: object
              description: Grid frequency per phase, Hz
              properties:
                A:
                  type: number
                  x-unit: Hz
                  description: Grid frequency on this phase
                B:
                  type: number
                  x-unit: Hz
                  description: Grid frequency on this phase
                C:
                  type: number
                  x-unit: Hz
                  description: Grid frequency on this phase
            PowerFactor:
              type: object
              description: Power factor per phase (unitless)
              properties:
                A:
                  type: number
                  description: Power factor on this phase — a dimensionless ratio
                B:
                  type: number
                  description: Power factor on this phase — a dimensionless ratio
                C:
                  type: number
                  description: Power factor on this phase — a dimensionless ratio
            Lag:
              type: object
              description: Phase lag per phase
              properties:
                A:
                  type: number
                B:
                  type: number
                C:
                  type: number
        totalConsumptionWh:
          type: number
          x-unit: Wh
          description: Lifetime cumulative energy drawn from the grid
        totalFeedInWh:
          type: number
          x-unit: Wh
          description: Lifetime cumulative energy fed back into the grid
    RemoteDevice:
      title: Remote device information (Heat Pump remoteDevices response)
      description: Response item of `GET /heatpump/{heatPumpId}/remoteDevices`. Serialized from an anonymous
        Go struct with no JSON tags at all, so every key is the capitalized Go field name — unlike most of
        this specification's response shapes, none of `Ski`/`DeviceAddress`/`Usecases`/`Features` is lowercase.
      type: object
      properties:
        Ski:
          type: string
          description: Device SKI
        DeviceAddress:
          type: string
          description: Device address
        Usecases:
          type: array
          description: Use cases the remote device announced
          items:
            type: object
        Features:
          type: array
          description: SPINE feature types exposed by the remote device's entities
          items:
            type: string
        ski:
          type: string
          description: Device SKI
        deviceAddress:
          type: string
          description: Device address
        usecases:
          type: array
          description: List of use cases supported by the device
          items:
            type: object
        features:
          type: array
          description: List of features supported by the device
          items:
            type: string
    OhpcfAnnouncementParams:
      title: OHPCF announcement parameters
      description: >-
        Request body of `POST /heatpump/{heatPumpId}/announceOptional` — see that
        operation for the full EEBUS validation ruleset (OHPCF-013, nominal-power
        bounds, etc.).
      type: object
      properties:
        power:
          type: number
          x-unit: W
          description: >-
            Good approximation of power consumption. At least one of power/powerMax
            is required; if set, must be > 0 and within [nominalPower.min, nominalPower.max].
        powerMax:
          type: number
          x-unit: W
          description: >-
            Maximum power consumption. At least one of power/powerMax is required;
            if set, must be > 0 and within [nominalPower.min, nominalPower.max].
        activeDurationMinSeconds:
          type: number
          x-unit: s
          description: Minimum active duration. Required, must be non-negative.
        pauseDurationMinSeconds:
          type: number
          x-unit: s
          description: Minimum pause duration. Required, must be non-negative.
        isPausable:
          type: boolean
          description: Whether the process can be paused. At least one of isPausable/isStoppable must be true.
        isStoppable:
          type: boolean
          description: Whether the process can be stopped. At least one of isPausable/isStoppable must be true.
    DeviceStateData:
      title: Device state information
      description: Go type `api.DeviceStateData`. The second field's actual JSON key is `lastErrorCode` (`json:"lastErrorCode,omitempty"`),
        not `errorCode`.
      type: object
      properties:
        operatingState:
          type: string
          description: Current operating state
        lastErrorCode:
          type: string
          description: Last reported error code, if any
    CSState:
      title: Controllable System State
      type: string
      description: >-
        The controllable-system (LPC/LPP) FSM state, shared by EVSE, HeatPump and
        Inverter:

        - `Init`: transient startup state, before the first heartbeat/write-limit
        handshake with the HEMS/CEM completes (or times out).

        - `Limited`: the CEM has an active power limit written and in force; the
        device must not exceed the reported wattage.

        - `Unlimited/Controlled`: the CEM's heartbeat is being received (device is
        under active supervision) but no limit is currently in force — the device
        may draw up to its nominal power.

        - `Failsafe`: the CEM's heartbeat has been lost (no heartbeat for over 120
        seconds while a limit was active, or while starting up); the device applies
        its own preconfigured failsafe power limit/duration until communication
        resumes or the failsafe duration expires.

        - `Unlimited/Autonomous`: no CEM is supervising the device — never received
        a heartbeat, or a heartbeat arrived but no limit was ever written, or the
        Failsafe duration expired without recovery. The device operates at full
        nominal power under its own control. This is the terminal/idle state.
      enum:
        - Init
        - Limited
        - Unlimited/Controlled
        - Failsafe
        - Unlimited/Autonomous
    ForceCSStateRequest:
      title: Force Controllable System State request
      type: object
      description: >-
        Testing aid: inject the controllable system into a chosen state once, so a
        tester can start a scenario with the device already in that state. The real
        state machine resumes on the next tick — incoming limit writes are processed
        and transitions out of the forced state follow the normal FSM.
      required:
        - state
      properties:
        state:
          $ref: "#/components/schemas/CSState"
        limitValueInWatts:
          type: number
          x-unit: W
          description: >-
            Used only when state is "Limited": the power limit the CS reports while
            limited (a positive magnitude; the production LPP CS reports it as
            negative). Required for "Limited" — without it the CS advertises the
            default 0 W limit.
          example: 5000
        durationInSeconds:
          type: number
          x-unit: s
          description: >-
            Used only when state is "Limited" and durationIndefinite is false: the
            finite duration after which the state machine leaves Limited.
          example: 600
        durationIndefinite:
          type: boolean
          description: >-
            Used only when state is "Limited": when true the limit has no duration and
            persists until another transition; when false a durationInSeconds is required.
          example: false
    ForceCSStateResponse:
      title: Force Controllable System State response
      type: object
      properties:
        state:
          $ref: "#/components/schemas/CSState"
    OhpcfForceStateRequest:
      title: Force HeatPump OHPCF power-sequence state request
      type: object
      description: >-
        Testing aid: inject the heatpump's OHPCF power-sequence (announced
        power-recommendation) state directly, bypassing transition validation.
      required:
        - state
      properties:
        state:
          type: string
          description: OHPCF power-sequence state to force onto the heat pump, bypassing normal transition validation.
          enum:
            - inactive
            - scheduled
            - running
            - paused
            - completed
            - invalid
        powerMaxInWatts:
          type: number
          x-unit: W
          description: >-
            Announced max power. Required for running and scheduled; optional for paused
            (falls back to a prior announcement). Ignored for inactive/completed/invalid.
          example: 5000
        startDelayInSeconds:
          type: number
          x-unit: s
          description: >-
            Delay from now until the scheduled run starts. Required for scheduled.
          example: 600
        activeDurationMinInSeconds:
          type: number
          x-unit: s
          description: >-
            Minimum active duration of the announced process. Optional — falls back to
            the heatpump config, then to a default (300 s).
          example: 300
        pauseDurationMinInSeconds:
          type: number
          x-unit: s
          description: >-
            Minimum pause duration of the announced process. Optional — falls back to
            the heatpump config, then to a default (60 s).
          example: 60
        isPausable:
          type: boolean
          description: >-
            Whether the announced process can be paused. Optional (default true). At
            least one of isPausable/isStoppable must be true.
          example: true
        isStoppable:
          type: boolean
          description: >-
            Whether the announced process can be stopped. Optional (default true). At
            least one of isPausable/isStoppable must be true.
          example: true
    MeasurementDataElement:
