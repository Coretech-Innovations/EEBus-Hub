        - ControlBox
      summary: Get the Active Power Production Limit reported by all paired LPP devices
      operationId: controlBoxGetAPPL
      description: >-
        Returns each connected LPP device's current APPL as an object keyed by device
        address (**not** an array — same map-vs-array fix as the LPC endpoints above).
        Devices whose APPL could not be read are omitted.
      responses:
        '200':
          description: APPL per connected device, keyed by device address
          content:
            application/json:
              schema:
                type: object
