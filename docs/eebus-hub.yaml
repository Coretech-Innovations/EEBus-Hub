                $ref: "#/components/schemas/DeviceErrorState"
        '400':
          description: Invalid ID number, or the EV is not connected to an EVSE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
        '500':
          description: OPEV is not available, no CEM entity paired, or the diagnostic data could not be read
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /ev/{evId}/MeasurementData:
    get:
      tags:
        - EV
      summary: Get the EV's live current draw
      operationId: getEVMeasurements
      description: >-
        Returns the EV's current instantaneous per-phase current draw in Amps, as
        reported by the simulation (or the pinned testing-mode values, if the EV
        is in testing mode). Does not require the EV to be connected to an EVSE:
        the simulation tick still runs while unconnected, so if the EV's
        `dischargingEnable` is true it keeps discharging (non-zero current) even
        without an EVSE; otherwise its charging state is NotCharging and current
        decays toward 0 A rather than dropping to it instantly.
      parameters:
        - $ref: "#/components/parameters/EvIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/currentMeasurementData"
        '400':
          $ref: "#/components/responses/InvalidIdNumberBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
  /ev/{evId}/StateOfCharge:
    get:
      tags:
        - EV
      summary: Get the EV's battery charge status
      operationId: getEVStateOfCharge
      description: >-
        Returns the EV's simulated battery state: charging state, state of charge
        as a percentage of effective (health-derated) capacity, current charge and
        nominal capacity in kWh, and battery health as a percentage.
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingStatus"
        '400':
          $ref: "#/components/responses/InvalidIdNumberBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
  /ev/systemState:
    get:
      tags:
        - EV
      summary: Get load-control limits, current draw and charge status for every EV
      operationId: getSystemState
      description: >-
        Convenience aggregate over every simulated EV: for each, the OPEV
        load-control limit data (null if the EV is not connected to an EVSE or
        OPEV is unavailable — the underlying error is discarded), the live
        per-phase current draw, and the battery charge status.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemState"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /evse/add:
    post:
      tags:
      - EVSE
      summary: Create a simulated EVSE
      operationId: addEVSE
      description: 'Creates a new simulated EVSE entity. The EVSE''s own EEBUS service is not started yet
        — it starts lazily on the first POST /evse/{evseId}/trust call. Requires: the simulation must not
        be running (400 otherwise).


        Validates deviceName/brandName/deviceCode/serialNumber/vendor.code/ vendor.name (all required, non-empty),
        failsafeValue/failsafeDuration/ failSafeDurationMax and nominalPower/nominalCurrent bounds (see
        EVSEConfig field descriptions), and device-name/device-address uniqueness against every existing
        EVSE. On success, `evseccEnabled`, `lpcEnabled` and `mpcEnabled` are overridden from the currently
        configured license/use-case toggles, `brandName` is fixed to "Coretech-Innovations", and `contractualPowerMax`
        is cleared — see EVSEConfig for details. An optional `trustConnections` array records mutual-trust
        peers to be established when the simulation starts.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EVSEConfig'
            example:
              deviceName: EVSE-1
              deviceCode: EVSE001
              serialNumber: SN-1000
              vendor:
                name: Coretech-Innovations
                code: CTI
              lpcEnabled: true
              failsafeValue: 2000
              failsafeDuration: 2
              failSafeDurationMax: 24
              nominalPower:
                min: 0
                max: 22000
              nominalCurrent:
                min: 6
                max: 32
              brandName: Coretech-Innovations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EVSEStatusOK'
              example:
                status: OK
                id: 1
        '400':
          description: Simulation is running, malformed body, a validation bound was violated (see EVSEConfig),
            a device-name/device-address duplicate, or an invalid trustConnections entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /evse/addExt:
    post:
      tags:
        - EVSE
      summary: Add an external (real) EVSE for pairing
      operationId: addExtEVSE
      description: >-
        Registers a real, non-simulated EVSE by SKI so it can be discovered/paired via
        mDNS, alongside simulated EVSEs. Requires: the simulation must not be running.
        remoteSki is normalized (colons/case) before being stored; a request without a
        usable SKI is rejected.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remoteSki:
                  type: string
                  example: "00-1D-A0-00-00-00-00-00-00-00-00-00-00-00-00-00-00-00"
                deviceName:
                  type: string
                imgBase64:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  id:
                    type: integer
                    description: Engine-assigned index for this external EVSE entry
        '400':
          description: Simulation is running, malformed body, or missing/invalid remoteSki
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                  error:
                    type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /evseExt:
    get:
      tags:
        - EVSE
      summary: Get all external (real) EVSEs
      operationId: getExtEVSEList
      description: >-
        Returns every real EVSE registered via POST /evse/addExt. Returns an empty array
        when none are registered.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtEVSEConfigResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /evseExt/{evseId}:
    patch:
      tags:
        - EVSE
      summary: Modify an external (real) EVSE
      operationId: updateExtEVSE
      description: >-
        Updates an existing external EVSE entry's remoteSki/deviceName/imgBase64.
        Requires: at least one external EVSE must already be registered, and evseId must
        match an existing entry. Changing remoteSki is rejected while the simulation is
        running.
      parameters:
        - name: evseId
          in: path
          required: true
          schema:
            type: integer
          example: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtEVSEConfigResponse"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid evseId, malformed body, or SKI change attempted while simulation is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No external EVSE exists, or evseId does not match a registered entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - EVSE
      summary: Remove an external (real) EVSE
      operationId: deleteExtEVSE
      description: >-
        Removes a registered external EVSE entry. Requires: the simulation must not be
        running, and no compliance test run may be active (unless a valid
        X-EEBUS-Internal-Test-Token is supplied).
      parameters:
        - name: evseId
          in: path
          required: true
          schema:
            type: integer
          example: 0
        - name: X-EEBUS-Internal-Test-Token
          in: header
          required: false
          description: Internal token used by test automation to bypass the active-test-run block.
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Simulation is running or evseId is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No external EVSE exists, or evseId does not match a registered entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '409':
          description: Blocked because a compliance test run is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /evse/{evseId}/manufacturerData:
    get:
      tags:
      - EVSE
      summary: Get the EVSE's manufacturer/device identification
      operationId: getEVSEManufacturerData
      description: 'Reads the EVSECC DeviceClassificationManufacturerData from the EVSE''s own local SPINE
        data. Requires: the EVSECC use case must be licensed (checked once globally against the license,
        not per EVSE) — 400 otherwise.'
      parameters:
      - $ref: '#/components/parameters/EvseIdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  manufacturerData:
                    $ref: '#/components/schemas/EVSEManufacturerData'
        '400':
          description: Invalid ID number, or EVSECC is not licensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/NoExistingEvseIdNotFound'
        '500':
          description: The EVSECC handler returned an error while reading manufacturer data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                title: response status error
  /evse/{evseId}:
    get:
      tags:
      - EVSE
      summary: Get EVSE details by ID
      operationId: getEVSE
      description: 'Reports the EVSE''s own SKI (`ski`) alongside the SKI it currently observes as its connected
        controller (`remoteSki`) and whether that connection is live (`connectedToHEMS`). This is the read
        side of SKI-trust corroboration: after registering a remote SKI via POST /evse/{evseId}/trust (and
        the matching trust on the controller''s own side), call this endpoint to confirm the pairing actually
        took by checking that `remoteSki` matches the expected controller SKI. `remoteSki`/`connectedToHEMS`
        are populated at the SHIP transport level, so they reflect any connected controller regardless of
        which use cases (e.g. EVSECC) are enabled. Requires: none beyond a valid license (default license-gated
        route).'
      parameters:
      - $ref: '#/components/parameters/EvseIdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EVSEControlBlock'
        '400':
          description: evseId is not an integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/EvseNotFound'
        '500':
          description: the simulation engine is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
    patch:
      tags:
      - EVSE
      summary: Update an EVSE's configuration
      operationId: modifyEVSE
      description: Applies a partial update to the EVSE's configuration. The request body is merged onto
        the existing config field-by-field — only JSON keys present in the body overwrite the corresponding
        field; omitted keys keep their current value. If the merged result is identical to the current configuration,
        the entity is left untouched (still returns 200 with changes/new/old). The same validation and uniqueness
        checks as POST /evse/add apply (see EVSEConfig field descriptions); brandName and contractualPowerMax
        cannot be changed through this endpoint, and trustConnections is not honored here (add-only).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EVSEConfig'
      parameters:
      - $ref: '#/components/parameters/EvseIdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    description: Echo of the raw request body as submitted
                    $ref: '#/components/schemas/EVSEConfig'
                  new:
                    description: The EVSE's full configuration after the update
                    $ref: '#/components/schemas/EVSEConfig'
                  old:
                    description: The EVSE's full configuration before the update
                    $ref: '#/components/schemas/EVSEConfig'
        '400':
          description: 'Rejected before anything changed: a malformed body, a field that failed validation,
            or a field this route refuses to change.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/statusError'
                - $ref: '#/components/schemas/FieldValidationError'
                - $ref: '#/components/schemas/FieldRejectionError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/NoExistingEvseIdNotFound'
        '409':
          description: The field can only be changed while the device is stopped (heartbeatTimeoutInSeconds
            is handed to the EEBUS service at setup).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRejectionError'
    delete:
      tags:
      - EVSE
      summary: Delete a simulated EVSE
      operationId: deleteEVSE
      description: 'Removes the EVSE entity. Any EV currently connected to it is disconnected first (equivalent
        to DELETE /ev/{evId}/evse/{evseId} for each); a disconnect failure is only logged, it does not block
        the deletion. Requires: the simulation must not be running, and no compliance test run may be active
        (unless a valid X-EEBUS-Internal-Test-Token is supplied).'
      parameters:
      - $ref: '#/components/parameters/EvseIdParam'
      - name: X-EEBUS-Internal-Test-Token
        in: header
        required: false
        description: Internal token used by test automation to bypass the active-test-run block.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusOk'
        '400':
          description: Invalid ID number, or the simulation is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/NoExistingEvseIdNotFound'
        '409':
          description: Blocked because a compliance test run is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /evse/{evseId}/errorState:
    post:
      tags:
        - EVSE
      summary: Force the EVSE into an error state
      operationId: setEVSEErrorCode
      description: >-
        Testing aid that drives the EVSE's EVSECC DeviceDiagnosisStateData into a
        failure condition. The device is always driven to operatingState
        "failure" regardless of what (if anything) is submitted for
        operatingState — only lastErrorCode is actually applied (see the
        ErrorState schema). While in this state, ApproveOrChangeLimits zeroes out
        the current limits offered to any connected EV, effectively stopping its
        charging — this does not change the LPC controllable-system's CSState.
        Requires: the EVSECC use case must be licensed (checked once globally, not
        per EVSE) — 400 otherwise.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorState"
            example:
              lastErrorCode: "1"
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid ID number, malformed body, or EVSECC is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
        '500':
          description: EVSECC handler unavailable, or the write to local SPINE data failed
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    get:
      tags:
        - EVSE
      summary: Get the EVSE's error state
      operationId: getEVSEErrorCode
      description: >-
        Reads the EVSECC DeviceDiagnosisStateData currently held by the EVSE.
        Requires: the EVSECC use case must be licensed (checked once globally, not
        per EVSE) — 400 otherwise. Note: unlike the sibling POST/DELETE on this
        path (which return 404 when evseId does not resolve to an EVSE entity),
        this GET returns 400 for that case.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorState"
        '400':
          description: >-
            Invalid ID number, EVSECC is not licensed, or evseId does not resolve
            to an EVSE entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: evseId does not resolve to any entity at all
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: EVSECC handler unavailable, or local data could not be read
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - EVSE
      summary: Clear the EVSE's error state
      operationId: clearEVSEErrorCode
      description: >-
        Restores the EVSECC DeviceDiagnosisStateData to operatingState
        "normalOperation" with lastErrorCode "0". Requires: the EVSECC use case
        must be licensed (checked once globally, not per EVSE) — 400 otherwise.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid ID number, or EVSECC is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
        '500':
          description: EVSECC handler unavailable, or the write to local SPINE data failed
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /evse/{evseId}/image:
    post:
      tags:
        - EVSE
      summary: Upload the EVSE's display image
      operationId: uploadEVSEImage
      description: Stores a base64-encoded image for the EVSE, replacing any previous one.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Image"
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          $ref: "#/components/responses/InvalidIdNumberBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
    get:
      tags:
        - EVSE
      summary: Get the EVSE's display image
      operationId: getEVSEImage
      description: >-
        Returns the EVSE's stored Base64-encoded image. Requires: none beyond a
        valid license (default license-gated route).
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseImage"
        '400':
          $ref: "#/components/responses/InvalidIdNumberBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: no existing EVSE with this ID number, no image to get
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - EVSE
      summary: Delete the EVSE's display image
      operationId: deleteEVSEImage
      description: >-
        Clears the stored image. When no image is currently stored the call is a
        400 and nothing is written; otherwise the image is cleared and the call is
        a 200.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid ID number, or (see description) no image was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: no existing EVSE with this ID number
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /evse/list:
    get:
      tags:
        - EVSE
      summary: List all simulated EVSEs
      operationId: listEVSEs
      description: >-
        Returns every simulated EVSE entity with its full configuration, pairing
        state and live LPC status.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVSEListConfig"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /evse/{evseId}/trust:
    post:
      tags:
        - EVSE
      summary: Trust the HEMS/CEM from the EVSE side
      operationId: evseTrustDevice
      description: >-
        Registers the given remote SKI as trusted for pairing on this EVSE. If the
        EVSE has not started its EEBUS service yet (no local SKI), it is started
        first as part of this call, and every EV already connected to it (whose
        own EEBUS service has not started) is started as well. Requires: the simulation
        must not be in the brief transitional "stopping" window after `POST /sim`
        `action: stop` (`Engine.isAllowedToPairDevices` — despite its name this is
        **not** "the simulation must be running": it also returns true while the
        simulation has never been started, or is fully stopped; only the few seconds
        while a Stop() teardown is in flight return false). 400 "Simulation not running"
        otherwise (the error message is misleading given the actual condition). This is
        one half of mutual trust; the HEMS
        side must also trust this EVSE's SKI via POST /hems/trust for pairing to
        complete.


        The request body field is named `remoteSki` (lowercase "ki") on the
        server's binding struct; Go's JSON decoder matches field names
        case-insensitively when there is no exact match, so `remoteSKI` (as
        documented below) is also accepted in practice. The value is normalized
        (colons/case) before use; an empty or all-whitespace SKI is rejected.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remoteSKI:
                  type: string
                  example: "00-1D-A0-00-00-00-00-00-00-00-00-00-00-00-00-00-00-00"
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseConnectEVSEToHEMS"
        '400':
          description: invalid ID number, invalid/empty remote SKI, or the simulation is mid-teardown
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
        '500':
          description: Failed to start the EVSE's EEBUS service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - EVSE
      summary: Untrust a remote device from the EVSE
      operationId: evseUntrustDevice
      description: >-
        Removes the given remote SKI from the EVSE's trusted-peer list. Unlike the
        POST on this path, this does not require the simulation to be running.
        Same field-name note as POST applies: the body is bound to a `remoteSki`
        field, matched case-insensitively.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remoteSKI:
                  type: string
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: invalid ID number, invalid remote ski
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
  /evse/{evseId}/remoteDevices:
    get:
      tags:
        - EVSE
      summary: Get remote devices connected to this EVSE
      operationId: getEVSERemoteDevices
      description: >-
        Returns the SPINE devices currently connected/paired to this EVSE, with each
        device's address, supported use cases and exposed feature types.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  remoteDevices:
                    type: array
                    items:
                      type: object
                      properties:
                        DeviceAddress:
                          type: string
                        Usecases:
                          type: array
                          description: Use cases the remote device announced
                          items:
                            type: object
                        Features:
                          type: array
                          description: SPINE feature types exposed by the remote device's entities
                          items:
                            type: string
        '400':
          description: Invalid evseId, or failed to get remote devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /evse/{evseId}/lpcCurrentState:
    get:
      tags:
        - EVSE
      summary: Get the EVSE's LPC controllable-system state
      operationId: getEVSEState
      description: >-
        Returns the EVSE's LPC controllable-system FSM state. currentState is the
        empty string if the EVSE has no controllable system (LPC disabled) — this
        is not an error. See CSState for the meaning of each value.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVSEState"
        '400':
          $ref: "#/components/responses/InvalidIdNumberBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
  /evse/{evseId}/lpcActivePowerLimit:
    get:
      tags:
        - EVSE
      summary: Get the active power consumption limit applied to the EVSE
      operationId: getLPCActivePowerConsumptionLimit
      description: >-
        Returns the LPC Active Power Consumption Limit (APCL) currently reported
        by the EVSE. Requires: the EVSE must have a controllable system (LPC
        enabled) — 400 if LPC is disabled.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  result:
                    $ref: "#/components/schemas/lpcAPCL"
        '400':
          description: invalid ID number, or LPC Use case not supported
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
  /evse/{evseId}/lpcFailsafeValues:
    get:
      tags:
        - EVSE
      summary: Get the EVSE's configured failsafe power limit and duration
      operationId: getFailsafeConsumptionLimit
      description: >-
        Returns the EVSE's configured failsafeValue (W) and failsafeDuration
        (converted here to seconds) — the limit the EVSE falls back to in the
        Failsafe controllable-system state. Unlike the other lpc* GET endpoints,
        this always succeeds (it reads static configuration, not live LPC state) —
        it does not require LPC to be enabled.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  result:
                    $ref: "#/components/schemas/FCAPL"
        '400':
          $ref: "#/components/responses/InvalidIdNumberBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
  /evse/{evseId}/latestSentHeartbeat:
    get:
      tags:
        - EVSE
      summary: Get the latest LPC heartbeat sent by the EVSE
      operationId: getLatestSentHeartbeat
      description: >-
        Returns the last DeviceDiagnosisHeartbeatData the EVSE sent to its CEM
        peer over LPC. Requires: the EVSE must have a controllable system (LPC
        enabled) — 400 if LPC is disabled.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatWrapperWithExample"
        '400':
          description: invalid ID number, or LPC Use case not supported
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
  /evse/{evseId}/latestReceivedHeartbeat:
    get:
      tags:
        - EVSE
      summary: Get the latest LPC heartbeat received from the CEM
      operationId: getLatestReceivedHeartbeat
      description: >-
        Returns the last DeviceDiagnosisHeartbeatData the EVSE received from its
        CEM peer over LPC. Requires: the EVSE must have a controllable system (LPC
        enabled) — 400 if LPC is disabled.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatWrapperWithExample"
        '400':
          description: invalid ID number, or LPC Use case not supported
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
  /evse/{evseId}/lpcPowerConstraints:
    get:
      tags:
        - EVSE
      summary: Get the EVSE's LPC power constraints
      operationId: getEVSELPCPowerConstraints
      description: >-
        Returns the LPC power-consumption constraints (nominal and contractual
        maxima) the EVSE reports. Requires: the EVSE must have a controllable
        system (LPC enabled) — 400 if LPC is disabled.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  result:
                    $ref: "#/components/schemas/EVSEPowerConstraints"
        '400':
          description: invalid ID number, or LPC Use case not supported
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
  /evse/{evseId}/electricalMeasurements:
    get:
      tags:
        - EVSE
      summary: Get the EVSE's MPC electrical measurements
      operationId: getMPCElectricalMeasurement
      description: >-
        Returns the EVSE's current total/per-phase power, energy, current,
        voltage and frequency, mapped into the MPC measurement shape (see
        MPCMeasurements). Does not require MPC to be enabled — it always returns
        whatever the EVSE's live simulated/testing-mode readings are (fields the
        EVSE has no data for are simply omitted).
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MPCMeasurements"
        '400':
          description: invalid ID number, or MPC Use case not supported
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
    patch:
      tags:
        - EVSE
      summary: Manually inject electrical measurements into the EVSE
      operationId: patchEVSEElectricalMeasurements
      description: >-
        Overwrites the EVSE's electrical measurements (power/current/voltage per phase,
        energy, frequency) for simulation/testing purposes, bypassing normal use-case
        computation. Requires: the simulation must be running, and no EV may currently be
        connected to this EVSE — if one is connected, the request is rejected so manual
        measurements cannot fight the EV's own charging behaviour. Only fields present in
        the request body are changed; omitted fields keep their current value.


        Known quirk: injected values are written into the SPINE MPC local data
        (visible to a paired HEMS via GET /hems/MpcMeasurementData) but are NOT
        reflected back on the sibling GET /evse/{evseId}/electricalMeasurements —
        the code path that would sync them back (`h.measurements = measurements`)
        is commented out. Use GET /hems/MpcMeasurementData to verify an injected
        value took effect, not this endpoint's own GET.
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MPCMeasurements"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            Invalid evseId, simulation not running, an EV is connected to this EVSE, or
            the request body could not be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/NoExistingEvseIdNotFound"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/add:
    post:
      tags:
        - HEMS
      summary: Create the HEMS (CEM) entity
      operationId: addHEMS
      description: >-
        Creates the single HEMS/CEM simulation entity, starts its EEBUS service and
        registers the use cases enabled by the current license (LPC, LPP, MPC, MGCP,
        OPEV, EVSECC, EVSOC, MOI, MOB, COB, OHPCF). There can only be one HEMS at a
        time — a second call fails with 400 ("cem is already added"). `deviceBrand`
        is always overwritten to `"Coretech-Innovations"` server-side regardless of
        what is sent.


        The body is validated before creation; any of the following makes the whole
        request fail with 400 (all field names below are reported together in
        `err` when more than one is invalid):

        - `fuseSafetyMargin` must be >= 10 (percent of the fuse limit reserved as
          headroom).

        - `quantaTime` must be >= 1 (seconds).

        - `stepUpdateDuration` must be >= 1 (seconds).

        - `currentIncrementalStep` must be > 0 (Amperes).

        - `powerTransferDelay` must be >= 1 (seconds).

        - `vendorCode`, `deviceModel`, `deviceBrand`, `serialNumber`, `deviceName`
          must all be non-empty.

        - `lpcInfo.contractualPowerMax` must be set.

        - `lpcInfo.failsafeValue` must be non-zero.

        - `lppInfo.contractualPowerMax` must be set.

        - `lppInfo.failsafeValue` must be non-zero.

        - `failsafeDuration` must be non-zero (hours).

        - `failSafeDurationMax` must be non-zero (hours).


        If `lpcInfo`/`lppInfo` are omitted entirely, defaults are used
        (`failsafeValue: 25000` W, `failsafeDuration: 2` h, `failSafeDurationMax: 24`
        h, `contractualPowerMax: 25000` W, `approveWriteLimit: true`) — in that case
        the top-level `failsafeDuration`/`failSafeDurationMax` non-zero checks above
        are skipped for that CS. No upper bound (e.g. 24h) is enforced on
        `failsafeDuration`/`failSafeDurationMax` when they are supplied explicitly;
        only "non-zero" is checked.


        `controllableSystemEnabled` defaults to `true` when omitted.


        Requires: simulation STOPPED (`engine.IsSimulationRunning()` must be false)
        and a valid license.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HEMSConfig"
            example:
              DeviceName: HEMS-Sim
              vendorCode: "1017"
              deviceBrand: Coretech-Innovations
              deviceModel: EEBUS-Hub
              serialNumber: SIM-HEMS-0001
              fuseLimit: 63
              quantaTime: 30
              currentIncrementalStep: 1
              stepUpdateDuration: 5
              fuseSafetyMargin: 10
              powerTransferDelay: 5
              algorithm: FirstComeFirstServe
              controllableSystemEnabled: true
              lpcInfo:
                failsafeValue: 25000
                failsafeDuration: 2
                failSafeDurationMax: 24
                contractualPowerMax: 25000
                approveWriteLimit: true
              lppInfo:
                failsafeValue: 25000
                failsafeDuration: 2
                failSafeDurationMax: 24
                contractualPowerMax: 25000
                approveWriteLimit: true
              failsafeDuration: 2
              failSafeDurationMax: 24
      responses:
        '200':
          description: HEMS created and started. Returns the engine entity id and the local SKI to use for QR/manual pairing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAddHEMS"
              example:
                status: OK
                id: 1
                SKI: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
        '400':
          description: >-
            Invalid/incomplete configuration (see field-by-field validation above),
            simulation is running, or a HEMS already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: The internal simulation engine could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems:
    get:
      tags:
      - HEMS
      summary: Get the current HEMS configuration and state
      operationId: getHEMS
      description: Returns the HEMS configuration together with its live SKI and the energy meter's current
        fuse limit. `config.lpcState`/`config.lppState` are refreshed from the LPC/LPP controllable-system
        state machines just before the response is built, and `config.oscevHeartbeatActive` reflects the
        live OSCEV heartbeat status — these three fields are always current, unlike the rest of `config`
        which is the stored configuration. Returns an empty array `[]` (not a 404) when no HEMS has been
        added yet.
      responses:
        '200':
          description: HEMS configuration and live state. Returns `[]` when no HEMS exists yet.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ResponseGetHEMS'
                - type: array
                  items: {}
                  maxItems: 0
              example:
                config:
                  DeviceName: HEMS-Sim
                  fuseLimit: 63
                  algorithm: FirstComeFirstServe
                  lpcState: Unlimited/Controlled
                  lppState: Unlimited/Controlled
                ski: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
                fuseLimit: 63
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
    delete:
      tags:
      - HEMS
      summary: Delete the HEMS entity
      operationId: deleteHEMS
      description: 'Tears down the HEMS EEBUS service, unregisters all its remote-device trust relationships
        and removes it from the simulation engine. If no HEMS exists this is a no-op that still returns
        200 (the loop over entities simply finds nothing to delete).


        Requires: simulation STOPPED. Blocked with 409 while a test run is active (see `POST /testrun`),
        unless the request carries a valid test-run token.'
      responses:
        '200':
          description: HEMS deleted (or none existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusOk'
        '400':
          description: Simulation is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '409':
          description: Blocked because an automated test run is currently active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '500':
          description: The internal simulation engine could not be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
    patch:
      tags:
      - HEMS
      summary: Update the HEMS configuration
      operationId: UpdateHEMS
      description: "Partially updates the stored HEMS configuration. The request body is decoded on top\
        \ of the current configuration, so omitted fields keep their existing value.\n\nWhile the simulation\
        \ is RUNNING, only `imgBase64` may be changed (any other field difference is ignored for that request);\
        \ this is the one case where a PATCH is accepted while running. If `imgBase64` is unchanged and\
        \ the simulation is running, the request fails with 400.\n\nWhile the simulation is STOPPED, the\
        \ following fields are validated and applied individually (a field is only applied if its new value\
        \ differs from the current one AND passes its check below); at least one field must actually change\
        \ or the response is 400 (\"Invalid request body\"):\n- `fuseLimit` (Amperes) — applied via the\
        \ same path as `PATCH\n  /hems/config/FuseCurrentLimit` when >= 0.\n\n- `quantaTime` (seconds) —\
        \ applied when >= 1.\n- `stepUpdateDuration` (seconds) — applied when >= 1.\n- `currentIncrementalStep`\
        \ (Amperes) — applied when > 0.\n- `fuseSafetyMargin` (percent) — applied when >= 10.\n- `powerTransferDelay`\
        \ (seconds) — applied when >= 1.\n- `algorithm` — applied when it is `FirstComeFirstServe` or `RoundRobin`;\n\
        \  any other value is silently ignored (not an error).\n\n- `lpcInfo`, `lppInfo`, `failsafeDuration`,\
        \ `failSafeDurationMax` and all\n  other fields — applied unconditionally with no bound checking\
        \ (unlike\n  `POST /hems/add`, no non-zero or range validation is performed here).\n\nThe\
        \ use-case availability fields and `controllableSystemEnabled` are refused by this route:\
        \ submitting one with a value that differs from the current one is a 400 and applies\
        \ nothing. Repeating the current value is accepted and ignored, so a body read back from\
        \ `GET /hems` can be submitted unchanged. Use `PATCH /sim/usecases` to change use-case\
        \ availability."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HEMSConfigPatch'
            example:
              fuseSafetyMargin: 15
              powerTransferDelay: 3
      responses:
        '200':
          description: At least one field was updated (or, while running, the image was updated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusOk'
        '400':
          description: 'Rejected before anything changed: a malformed body, a field that failed validation,
            or a field this route refuses to change.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/statusError'
                - $ref: '#/components/schemas/HEMSProtectedFieldsError'
                - $ref: '#/components/schemas/FieldRejectionError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          description: No HEMS entity exists to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '409':
          description: The field can only be changed while the device is stopped (heartbeatTimeoutInSeconds
            is handed to the EEBUS service at setup).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRejectionError'
  /hems/extDevices:
    get:
      tags:
        - HEMS
      summary: List the HEMS's connected real (external) devices
      operationId: getExtDevices
      description: >-
        Returns the entities connected to the HEMS and, if a ControlBox is present,
        the ControlBox's connected entities too — filtered down to entities flagged
        `isExternal` (i.e. real paired devices, not simulated ones). Returns an
        empty array `[]` (200, not 404) when there are none.
      responses:
        '200':
          description: List of external (real, non-simulated) connected device entities. Empty array if none.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: SPINE entity type (e.g. EVSE, EV, HeatPump)
                    isExternal:
                      type: boolean
                      description: Always true for entries in this list
                    remoteSki:
                      type: string
                      description: SKI of the remote device this entity belongs to
                    address:
                      type: object
                      description: SPINE entity address
                      properties:
                        device:
                          type: string
                        entity:
                          type: array
                          items:
                            type: integer
              example:
                - type: EVSE
                  isExternal: true
                  remoteSki: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
                  address:
                    device: "d:_i:19667_HEMS"
                    entity: [1]
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No HEMS entity exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/extDevices/data:
    post:
      tags:
        - HEMS
      summary: Fetch cached data of a specific type from a connected real device
      operationId: getExtDevicesData
      description: >-
        Looks up cached remote data previously received (over SHIP/SPINE) from the
        real device identified by `ski`, for the requested data category. This
        reads from an in-memory cache populated as data arrives — it does not
        actively query the device. `ski` is matched as given (not
        normalized/lowercased like the trust endpoints).


        `reqData` selects which cached dataset to return:

        - `evseManufacturerData` → EVSE manufacturer/device identification.

        - `currentLimits` → EV current limits.

        - `currentMeasurements` → EV current measurements.

        - `meterMeasurements` → external grid/submeter measurement.

        - `evseFailsafeValues` → EVSE failsafe configuration.


        Returns 500 if no cached data of that type exists yet for that SKI (not a
        client error — the device simply has not reported it, or the SKI is
        unknown).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtDeviceData"
            example:
              ski: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
              reqData: meterMeasurements
      responses:
        '200':
          description: The cached data for the requested category, shaped according to `reqData`
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  Data:
                    anyOf:
                      - $ref: "#/components/schemas/currentMeasurementData"
                      - $ref: "#/components/schemas/EVSEManufacturerData"
        '400':
          description: Malformed request body
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No HEMS entity exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: No cached data of the requested type is available yet for that SKI
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /hems/heatpumpdata:
    get:
      tags:
        - HEMS
      summary: Get OHPCF data for all connected heat pumps (real and simulated)
      operationId: getHeatPumpData
      description: >-
        Returns, for every remote device supporting OHPCF, its current OHPCF
        monitoring data plus the HEMS's view of whether an optional announcement is
        accepted and, if the heat pump has an active OHPCF process, the announced
        power values.


        Requires: the OHPCF use case must be licensed/enabled (returns 400
        otherwise).
      responses:
        '200':
          description: One entry per connected heat pump device. Empty array if none are connected.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                      description: SPINE device address of the heat pump
                    heatPumpData:
                      $ref: "#/components/schemas/OhpcfMonitorData"
                    optionalAccepted:
                      type: boolean
                      description: Whether the HEMS currently accepts an optional OHPCF announcement from this heat pump
                    power:
                      type: number
                      x-unit: W
                      description: Power consumption announced by the heat pump's active OHPCF process, if any
                      nullable: true
                    powerMax:
                      type: number
                      x-unit: W
                      description: Maximum power consumption announced by the heat pump's active OHPCF process, if any
                      nullable: true
        '400':
          description: OHPCF use case is not supported/licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No HEMS entity exists, or OHPCF data could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/oscev/state:
    get:
      tags:
        - HEMS
      summary: Get HEMS OSCEV state
      operationId: getHEMSOSCEVState
      description: >-
        Reports the HEMS's own OSCEV (Optimization of Self-Consumption During EV Charging)
        operating state — the SPINE DeviceDiagnosis operating state the HEMS itself
        publishes, which paired EVs can observe — and whether its OSCEV heartbeat is
        currently running. Requires: OSCEV licensed AND enabled on this HEMS instance (the
        `oscevEnabled` flag passed to `POST /hems/add` / `PATCH /hems`) — both are checked on
        every call, unlike the dead use-case-availability flags described elsewhere in this
        group; either failing returns 403.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevHEMSState"
              example:
                operatingState: normalOperation
                heartbeatActive: true
        '403':
          $ref: "#/components/responses/OscevNotLicensedForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundUpper"
    patch:
      tags:
        - HEMS
      summary: Update HEMS OSCEV operating state
      operationId: updateHEMSOSCEVState
      description: >-
        Sets the HEMS's own OSCEV operating state and republishes it on the bus; connected
        EVs observing the HEMS's DeviceDiagnosis operating state pick up the change. Setting
        "failure" is how a tester simulates the HEMS losing its ability to optimize
        self-consumption. Requires: OSCEV licensed AND enabled on this HEMS instance, checked
        on every call (403 if either is false).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OscevHEMSStateRequest"
            example:
              operatingState: normalOperation
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevHEMSStateRequest"
        '400':
          description: operatingState missing or not one of "normalOperation"/"failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/OscevNotLicensedForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundUpper"
  /hems/oscev/ev/{address}:
    get:
      tags:
        - HEMS
      summary: Get discovered OSCEV state for an EV
      operationId: getHEMSOSCEVEVState
      description: >-
        Returns the HEMS's tracked OSCEV state for one EV: the last recommendation this HEMS
        sent it (current or power) and the scenario 5/6 configuration last discovered from
        it. `address` is a SPINE entity address — discover connected EVs' addresses via
        `GET /hems/oscev/ev/configurationData` or `GET /hems/opev/ev/connectedData`.
        Requires: OSCEV licensed AND enabled on this HEMS instance.
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevHEMSPerEVState"
        '403':
          $ref: "#/components/responses/OscevNotLicensedForbidden"
        '404':
          description: >-
            no HEMS found, or this HEMS has not yet tracked any state for this EV — the
            tracked entry is created lazily, either by the automatic self-consumption
            distribution tick (suspended while testing mode is on — see PATCH
            /hems/testingMode) or by the first manual send/config write to this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/testingMode:
    get:
      tags:
        - HEMS
      summary: Get testing mode
      description: >
        Reports whether testing mode is active. While active, the automatic OPEV
        round-robin/first-come-first-served allocation and the automatic OSCEV
        self-consumption distribution tick are both suspended (see the HEMS `Simulate`
        loop), so limit/recommendation writes sent manually — `PATCH
        /hems/opev/ev/{address}/current`, `PATCH /hems/oscev/ev/{address}/current`,
        `PATCH /hems/oscev/ev/{address}/power` — persist for observation instead of being
        overwritten on the next tick. Requires: none — no license or simulation-state gate;
        available whenever a HEMS entity exists.
      operationId: getHEMSTestingMode
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  testingMode:
                    type: boolean
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundUpper"
    patch:
      tags:
        - HEMS
      summary: Enable or disable testing mode
      description: >-
        Toggles testing mode. Requires: none — no license or simulation-state gate; available
        whenever a HEMS entity exists. See `GET /hems/testingMode` for what testing mode
        suspends.
      operationId: setHEMSTestingMode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
            example:
              enabled: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  testingMode:
                    type: boolean
        '400':
          description: body must contain boolean 'enabled'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundUpper"
  /hems/opev/ev/{address}/current:
    patch:
      tags:
        - HEMS
      summary: Manually send per-phase OPEV current limits to an EV
      description: >
        Writes per-phase OPEV overload-protection current limits to the EV as a partial
        write. Only phases present in the body are written. The HEMS is a testing device:
        values are NOT range-checked and the EV's IsLimitChangeable flag is not enforced,
        so a tester can send arbitrary/invalid limits and observe the EV's reaction. The
        response reports which phases were written and which were skipped because their
        limit ID could not be discovered from the EV's descriptors. Requires: OPEV licensed;
        no simulation-state or testing-mode gate on the write itself, but the value only
        persists for observation instead of being immediately overwritten by the automatic
        round-robin/FCFS allocation if testing mode is also enabled — see
        `PATCH /hems/testingMode`. Discover connected EVs' addresses via
        `GET /hems/opev/ev/connectedData`.
      operationId: sendHEMSOPEVCurrentLimit
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpevCurrentLimitRequest"
            example:
              a: { valueInAmps: 6, isLimitActive: true }
              b: { valueInAmps: 6, isLimitActive: true }
              c: { valueInAmps: 6, isLimitActive: true }
      responses:
        '200':
          description: Limit sent and accepted by the EV
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: array
                    items:
                      type: string
        '400':
          description: send failed or was rejected by the EV (see err), with written/skipped phases
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                  written:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: array
                    items:
                      type: string
        '403':
          description: OPEV use case is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/NoHemsFoundUpper"
  /hems/oscev/ev/{address}/current:
    patch:
      tags:
        - HEMS
      summary: Send a per-phase OSCEV current recommendation to an EV
      description: >
        Sends a per-phase OSCEV current recommendation. Only phases present in the body are
        written (partial write), and each phase's IsLimitActive is honored independently
        (send isLimitActive=false to deactivate a phase). The HEMS is a testing device:
        values are NOT range-checked, so negative / out-of-range values are allowed.
        Requires: OSCEV licensed AND enabled on this HEMS instance. Discover connected EVs'
        addresses via `GET /hems/oscev/ev/configurationData`.
      operationId: sendHEMSOSCEVCurrentLimit
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OscevCurrentLimitRequest"
            example:
              a: { valueInAmps: 10, isLimitActive: true }
              b: { valueInAmps: 10, isLimitActive: true }
              c: { valueInAmps: 10, isLimitActive: true }
      responses:
        '200':
          description: Recommendation sent and accepted by the EV
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: array
                    items:
                      type: string
        '400':
          description: send failed or was rejected by the EV (see err)
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                  written:
                    type: array
                    items:
                      type: string
        '403':
          $ref: "#/components/responses/OscevNotLicensedForbidden"
        '404':
          description: no HEMS found or no EV found at this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/oscev/ev/{address}/power:
    patch:
      tags:
        - HEMS
      summary: Send OSCEV power recommendation to an EV
      description: >
        Sends an OSCEV power recommendation, or deactivates the previously sent one
        (active=false — the deviceAddress must still resolve, but no value is required
        and none is sent). The HEMS is a testing device: the value is NOT range-checked and
        the EV's scenario-4 support is NOT required, so a tester can send a power
        recommendation to an EV that does not advertise scenario 4 (or an out-of-range
        value) and observe how it responds. Sending a power recommendation clears any
        previously tracked current recommendation for the EV, and vice versa (OSCEV-044 —
        only one of the two is active at a time). Requires: OSCEV licensed AND enabled on
        this HEMS instance.
      operationId: sendHEMSOSCEVPowerRecommendation
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OscevPowerRecommendationRequest"
            example:
              active: true
              powerRecommendation: 2500
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevPowerRecommendationResponse"
        '400':
          description: invalid power recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/OscevNotLicensedForbidden"
        '404':
          description: no HEMS found or no EV found at this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/oscev/ev/{address}/configuration:
    get:
      tags:
        - HEMS
      summary: Get OSCEV scenarios 5 & 6 configuration for an EV
      operationId: getHEMSOSCEVEVConfiguration
      description: >-
        Returns the OSCEV scenario 5 (PV charge mode / surplus threshold) and scenario 6
        (start/stop delay) configuration this HEMS most recently discovered from the EV at
        address. Requires: OSCEV licensed AND enabled on this HEMS instance.
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevHEMSEVConfigData"
        '403':
          $ref: "#/components/responses/OscevNotLicensedForbidden"
        '404':
          description: no HEMS found or no OSCEV-capable EV found at this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    post:
      tags:
        - HEMS
      summary: Write OSCEV scenarios 5 & 6 configuration to an EV
      operationId: writeHEMSOSCEVEVConfiguration
      description: >-
        Writes any subset of OSCEV scenario 5/6 configuration fields to the EV at address —
        only the fields present (non-null) in the body are written. Requires: OSCEV licensed
        AND enabled on this HEMS instance. `surplusThresholdInWatts`, `startDelayInSeconds`
        and `stopDelayInSeconds` are each rejected with 400 if negative; there is no upper
        bound check.
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OscevHEMSConfigWriteRequest"
            example:
              pvChargeMode: surplusWithThreshold
              surplusThresholdInWatts: 500
              startDelayInSeconds: 60
              stopDelayInSeconds: 30
      responses:
        '200':
          description: Configuration written successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    $ref: "#/components/schemas/OscevHEMSConfigWriteRequest"
        '400':
          description: invalid field value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/OscevNotLicensedForbidden"
        '404':
          description: no HEMS found or no EV found at this address, or description list unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/oscev/ev/configurationData:
    get:
      tags:
        - HEMS
      summary: Get OSCEV scenarios 5 & 6 configuration for all connected EVs
      operationId: getHEMSOSCEVAllEVConfigurations
      description: >-
        Returns the OSCEV scenario 5/6 configuration this HEMS has discovered for every
        remote EV it is connected to over OSCEV — the address-discovery source for
        `GET /hems/oscev/ev/{address}/configuration`, `.../current`, `.../power`, and
        `GET /hems/oscev/ev/{address}`. Requires: OSCEV licensed AND enabled on this HEMS
        instance.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  evs:
                    type: array
                    items:
                      $ref: "#/components/schemas/OscevHEMSEVConfigEntry"
        '403':
          $ref: "#/components/responses/OscevNotLicensedForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundUpper"
  /hems/opev/ev/connectedData:
    get:
      tags:
        - HEMS
      summary: Get the EVs the HEMS is connected to over OPEV
      description: >-
        Returns the EVs the HEMS is currently connected to over the OPEV use case,
        sourced from the HEMS OPEV handler's remote entities (the same set the manual
        send validates against). An EV whose EVSE is paired to a ControlBox rather than
        the HEMS is not returned.
      operationId: getHEMSOPEVConnectedEVs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  evs:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpevHEMSEVConnectedEntry"
        '403':
          description: OPEV use case is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/NoHemsFoundUpper"
  /hems/config/FuseCurrentLimit:
    patch:
      tags:
        - HEMS
      summary: Update the household fuse current limit
      operationId: updateFuseLimit
      description: >-
        Sets the energy meter's fuse current limit, which bounds how much current
        the LPC round-robin/FCFS distribution algorithms are allowed to allocate
        (the algorithms work against `fuseLimit * (100 - fuseSafetyMargin) / 100`
        per phase — see `fuseSafetyMargin` on `POST /hems/add` / `PATCH /hems`). A
        no-op request (value equal to the current limit) still returns 200 without
        emitting a config-change event.


        Requires: simulation STOPPED.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fuseLimit:
                  type: number
                  x-unit: A
                  description: New fuse current limit. Must be >= 0.
            example:
              fuseLimit: 63
      responses:
        '200':
          description: Fuse limit updated (or unchanged, if it already matched)
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: Simulation is running, the request body is malformed, or `fuseLimit` is negative
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
        '500':
          description: The internal simulation engine could not be retrieved
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /hems/trust:
    post:
      tags:
        - HEMS
      summary: Trust a remote device's SKI on the HEMS
      operationId: trustNewDevice
      description: >-
        Registers `remoteSki` as a trusted SHIP peer on the HEMS's service, so the
        real or simulated device holding that SKI can pair with it. `remoteSki` is
        normalized before use — surrounding/embedded whitespace is stripped and the
        value is lowercased; no length or hex-charset check is performed, so a
        malformed SKI is only rejected if it becomes empty after normalization.


        This is one half of a mutual-trust pairing: the device side must trust the
        HEMS's own SKI too (see the corresponding trust endpoint for the target
        entity type, e.g. `POST /evse/{id}/trust`, or `POST /trust` for the
        two-sided form). Use `GET /mdns` to discover a real device's SKI before
        trusting it, or `GET /hems/qr-code` to get the HEMS's SKI/pairing data.


        Requires: the simulation must not be in the brief transitional "stopping" window
        after `POST /sim` `action: stop` (`Engine.isAllowedToPairDevices`) — a simulation
        that has never been started, or is fully stopped, is accepted. 400 "Simulation
        not running" otherwise (the error message is misleading given the actual
        condition).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustDeviceRequest"
            example:
              remoteSki: 6e a5 7f 6e 6e 6b 41 ff 38 9a 0a a6 4f 8e 64 8f d3 9f d9 36
      responses:
        '200':
          description: The SKI was registered as trusted
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
        '400':
          description: The request body is malformed, `remoteSki` is empty after normalization, or the simulation is mid-teardown
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - HEMS
      summary: Untrust (disconnect) a remote device's SKI on the HEMS
      operationId: untrustDevice
      description: >-
        Disconnects any active SHIP connection to `remoteSki` and removes it from
        the HEMS's trusted-peer list. `remoteSki` is normalized the same way as
        `POST /hems/trust` (whitespace stripped, lowercased).


        Unlike `POST /hems/trust`, this endpoint does not require the simulation to
        be running — it can be called at any time as long as the HEMS entity
        exists.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustDeviceRequest"
            example:
              remoteSki: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
      responses:
        '200':
          description: The SKI was disconnected and untrusted
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
        '400':
          description: The request body is malformed or `remoteSki` is empty after normalization
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /trust:
    get:
      tags:
        - Trust
      summary: List the current trust topology (all mutual-trust connections)
      operationId: listTrustConnections
      description: >-
        Returns the backend's declarative trust store — the single source of truth
        for which devices are configured to trust each other — annotated with each
        edge's live SHIP connection state. This is the imperative-vs-declarative
        counterpart to the per-entity trust endpoints (e.g.
        `POST /heatpump/{heatPumpId}/trust`, `POST /hems/trust`): those register a
        one-shot SKI pairing on a single already-running entity's SHIP service and
        require the simulation to be running; `POST/DELETE /trust` instead edit the
        desired topology up front (simulation may be stopped) and the engine
        (re)applies every stored edge automatically on each `POST /sim` (start) —
        see `TrustManager.ApplyAll`, called once all entity services are up.
        Entities discovered pairing out-of-band (e.g. a real ControlBox that
        auto-trusts a simulated device via the SHIP Pairing Service) are also folded
        into this same store (`TrustManager.RecordDiscoveredEdge`) so they persist
        across a Stop → Start the same way.


        Requires: none beyond a valid license (default license-gated route).
      responses:
        '200':
          description: >-
            The list of trust connections, each annotated with its live
            connection state (`established`). `established` is only ever true while
            the simulation is running; a configured-but-not-started topology reports
            `established: false` for every edge.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustEdgeStatus"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    post:
      tags:
        - Trust
      summary: Create a mutual-trust connection between two devices
      description: >-
        Establishes a bidirectional trust relationship between two peers (`a`/`b`
        in the body), each identified by exactly one of a simulated entity's engine
        `id` or a real device's `ski` (`TrustPeerRef` — set both or neither and the
        request is rejected with 400). At least one endpoint must be a simulated
        entity the Hub controls (two bare SKIs are rejected). The backend enforces
        device-role rules before recording anything:

          - a controllable device (EVSE/Inverter/HeatPump) can only be paired with a
            controller (HEMS or ControlBox), never with another controllable device;
          - two controllers may only be paired as the CEM ↔ ControlBox pair — any
            other controller/controller pair is rejected;
          - a controllable device may hold at most one controller edge at a time —
            adding a second controller edge for the same controllable silently
            displaces (removes) its previous controller edge ("newest controller
            wins"), tearing down the live SHIP registration first if the simulation
            is running.

        Adding an edge that already exists is a no-op (idempotent, still 200). If
        the simulation is currently running the trust is applied immediately
        (`RegisterRemoteSKI` on every simulated endpoint); otherwise it is recorded
        and applied automatically on the next `POST /sim` (start). The stored
        topology survives simulation Stop → Start; it is only cleared by
        `POST /sim` with `action: reset` (`TrustManager.Clear`, called from
        `Engine.ResetSimulation`).
      operationId: addTrustConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustEdge"
            example:
              a: { id: 1 }
              b: { ski: "00-1D-A0-00-00-00-00-00-00-00-00-00-00-00-00-00-00-00" }
      responses:
        '200':
          description: The connection now exists (newly created or already present).
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            Malformed body, a peer reference sets both/neither of id or ski, both
            endpoints are real (bare SKI) devices, the referenced entity/SKI is
            unknown, the two peers are the same device, or the device-role rules
            reject the pairing.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: The trust manager has not been initialised (no active engine).
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - Trust
      summary: Remove a mutual-trust connection between two devices
      description: >-
        Removes the stored edge matching the given `a`/`b` peer references
        (order-independent) from the trust store. If the simulation is currently
        running, the live SHIP registration is torn down on every simulated
        endpoint of the edge (`UnregisterRemoteSKI`) as part of the same call.
        Removing an edge that is not present is a no-op (still 200) — the response
        does not distinguish "removed" from "was not present".
      operationId: removeTrustConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustEdge"
      responses:
        '200':
          description: The connection is now absent (removed, or was already absent).
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            Malformed body, or a peer reference sets both/neither of id or ski.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: The trust manager has not been initialised (no active engine).
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /hems/algorithm:
    post:
      tags:
        - HEMS
      summary: Switch the OPEV/OSCEV distribution algorithm to Round Robin
      operationId: setHEMSAlgorithm
      description: >-
        Switches the EV-current distribution algorithm used by the OPEV allocation
        loop (see `algorithm` on `POST /hems/add` / `PATCH /hems`). `algorithm` is
        matched case-insensitively, but the **only** value this endpoint currently
        accepts is `RoundRobin` — any other value (including
        `"FirstComeFirstServe"`) is rejected with 400 ("invalid Algorithm type").
        There is no dedicated endpoint to switch back to FirstComeFirstServe; use
        `PATCH /hems` with `algorithm: FirstComeFirstServe` instead.


        `quantaTime` (the round-robin shuffle interval) is required and must be
        >= 1 second.


        Requires: simulation STOPPED.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm:
                  type: string
                  description: Must be "RoundRobin" (case-insensitive); any other value is rejected
                  enum: [RoundRobin]
                quantaTime:
                  type: number
                  x-unit: s
                  description: Round-robin shuffle interval. Required, must be >= 1.
              example:
                algorithm: RoundRobin
                quantaTime: 30
      responses:
        '200':
          description: Algorithm switched to Round Robin
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: Simulation is running, the request body is malformed, `algorithm` is not "RoundRobin", or `quantaTime` is < 1
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
        '500':
          description: The internal simulation engine could not be retrieved
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    get:
      tags:
        - HEMS
      summary: Get the current OPEV/OSCEV distribution algorithm
      operationId: getHEMSAlgorithm
      description: >-
        Returns the currently configured distribution algorithm and, for Round
        Robin, its shuffle interval. **Response body is only written when the
        current algorithm is `RoundRobin`** — for any other value (e.g. the default
        `FirstComeFirstServe`, or an empty value if none was ever set) the handler
        writes nothing at all, so the client receives an empty 200 response with no
        JSON body.
      responses:
        '200':
          description: >-
            Current algorithm and shuffle time. Only returned when the algorithm is
            RoundRobin — otherwise the response body is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HEMSAlgorithm"
              example:
                status: OK
                Algorithm: RoundRobin
                ShuffleTime: 30
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
  /hems/image:
    post:
      tags:
        - HEMS
      summary: Set the HEMS's display image
      operationId: uploadHEMSImage
      description: >-
        Stores a Base64-encoded image for the HEMS (used by UIs for device
        branding). Overwrites any previously stored image; no format/size
        validation is performed.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Image"
            example:
              image: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB...
      responses:
        '200':
          description: Image stored
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
    get:
      tags:
        - HEMS
      summary: Get the HEMS's stored display image
      operationId: getHEMSImage
      description: >-
        Returns the HEMS's stored Base64-encoded image. Requires: none beyond a
        valid license (default license-gated route).
      responses:
        '200':
          description: The stored Base64-encoded image
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/ResponseImage"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No HEMS entity exists, or no image has been saved yet
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - HEMS
      summary: Clear the HEMS's stored display image
      operationId: deleteHEMSImage
      description: >-
        Clears the stored image. When there was no image to begin with the call is
        a 400 ("no saved image") and nothing is written; when an image was present a
        single clean 200 is returned.
      responses:
        '200':
          description: Image cleared (an image was present before the call)
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            No HEMS entity exists, or no image was stored to begin with (in the
            latter case the response body is malformed — see description)
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/heartbeat:
    post:
      tags:
        - HEMS
      summary: Start or stop the HEMS's device-diagnosis heartbeat
      operationId: updateHeartbeat
      description: >-
        Starts or stops the CEM entity's SPINE DeviceDiagnosis heartbeat, which is
        what remote controllable systems use to detect the HEMS is alive. Stopping
        it (or the heartbeat being lost/timed out on the remote side) is what
        drives a controllable system into `Failsafe` state — see `lpcState`/
        `lppState` on `GET /hems`. Starting the heartbeat also clears any cached
        OSCEV recommendations so they are re-sent on the next distribution tick
        (an EV forgets its previous limits while the heartbeat is stopped).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatAction"
            example:
              action: start
      responses:
        '200':
          description: Heartbeat started or stopped
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: '`action` is neither "start" nor "stop"'
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
    get:
      tags:
        - HEMS
      summary: Get whether the HEMS's own heartbeat is running
      operationId: getHeartbeat
      description: >-
        Reports whether the HEMS's own SPINE DeviceDiagnosis heartbeat (see `POST
        /hems/heartbeat`) is currently running. This is the heartbeat the HEMS
        *sends*; see `GET /hems/latestSentHeartbeat` for its last transmitted
        counter/timeout, and `GET /hems/latestReceivedHeartbeat{,/{deviceAddress}}`
        for heartbeats *received* from remote controllable systems.
      responses:
        '200':
          description: Current heartbeat state
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/HeartbeatState"
              example:
                status: OK
                state: Running
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
  /hems/errorState:
    post:
      tags:
        - HEMS
      summary: Put the HEMS into a device-diagnosis error/failure state
      operationId: setHEMSErrorState
      description: >-
        Sets the CEM entity's SPINE DeviceDiagnosis operating state to "failure"
        with the given `lastErrorCode`, via the OPEV feature handler (this endpoint
        is only usable when the OPEV use case is enabled — it is not conceptually
        tied to LPC/LPP but shares the OPEV DeviceDiagnosis feature instance).


        Side effect on the simulation tick: while the HEMS is in this error state
        (or while its heartbeat is stopped, see `POST /hems/heartbeat`), the OSCEV
        self-consumption distribution and the OPEV round-robin/FCFS current
        allocation are both skipped each tick. This does **not** stop or force a
        transition in the LPC/LPP controllable-system state machines themselves
        (`myLpcCS`/`myLppCS` keep ticking and reacting to their own
        heartbeat/write-limit state independently of this error flag) — use `GET
        /hems` (`lpcState`/`lppState`) to observe those.


        Requires: the OPEV use case must be licensed/enabled.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorState"
            example:
              lastErrorCode: "1"
      responses:
        '200':
          description: Error state set
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: OPEV use case is not supported/licensed
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
        '500':
          description: Failed to write the error state to the local DeviceDiagnosis feature
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - HEMS
      summary: Clear the HEMS's device-diagnosis error state
      operationId: clearHEMSErrorState
      description: >-
        Resets the CEM entity's SPINE DeviceDiagnosis operating state back to
        "normalOperation" and clears the last error code (set to `"0"`). Requires
        the OPEV use case to be licensed/enabled.


        Note: unlike the POST and GET operations on this path (which return 404
        when no HEMS entity exists), this DELETE returns 400 for that same
        condition.
      responses:
        '200':
          description: Error state cleared
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: OPEV use case is not supported/licensed, or no HEMS entity exists
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Failed to clear the error state on the local DeviceDiagnosis feature
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    get:
      tags:
        - HEMS
      summary: Get the HEMS's device-diagnosis error state
      operationId: getHEMSErrorState
      description: >-
        Reads back the CEM entity's local SPINE DeviceDiagnosis state (the same
        state written by `POST`/`DELETE` on this path). Requires the OPEV use case
        to be licensed/enabled.
      responses:
        '200':
          description: Current operating state and last error code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorState"
              example:
                status: OK
                OperatingState: normalOperation
                LastErrorCode: "0"
        '400':
          description: OPEV use case is not supported/licensed
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
        '500':
          description: Failed to read the error state from the local DeviceDiagnosis feature
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /hems/ActivePowerConsumptionLimit:
    post:
      tags:
        - HEMS
      summary: Send the Active Power Consumption Limit (APCL) to all connected LPC devices
      operationId: sendAPCLToAllDevices
      description: >-
        Sends an LPC load-control limit write to every remote controllable-system
        device (splitting `value` evenly across all connected devices when
        active=true and value > 0). `active` is required; `value` is additionally
        required when `active` is true (400 "Data missing" otherwise). See
        `lpcAPCL` for the durationSeconds/durationIndefinite precedence rule.


        `success` reflects whether *all* targeted devices accepted the write — see
        `APCLDataSuccessResponse` for the exact semantics, including the
        vacuous-success case when no LPC devices are connected. See `GET
        /hems/LpcDevicesData` to discover connected devices' addresses and current
        APCL state.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lpcAPCL"
            example:
              active: true
              value: 4000
              durationSeconds: 3600
      responses:
        '200':
          description: Write attempted; see `success`/`reason` for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APCLDataSuccessResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
        '400':
          $ref: "#/components/responses/DataMissingInBodyBadRequest"
    patch:
      tags:
        - HEMS
      summary: Send the Active Power Consumption Limit (APCL) to all connected LPC devices (partial)
      operationId: modifyAPCL
      description: >-
        Behaves like `POST /hems/ActivePowerConsumptionLimit`, except `active` is
        not required — the raw body is forwarded as-is (any subset of fields).
        Still returns 400 for a malformed JSON body.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lpcAPCL"
            example:
              value: 3500
      responses:
        '200':
          description: Write attempted; see `success`/`reason` for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APCLDataSuccessResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
    get:
      tags:
        - HEMS
      summary: Get the Active Power Consumption Limit (APCL) reported by all connected LPC devices
      operationId: getAPCLData
      description: >-
        Returns each connected LPC device's current APCL as an object keyed by
        device address (**not** an array). Devices whose APCL could not be read
        are omitted. See `GET /hems/LpcDevicesData` for the same data alongside
        failsafe values and constraints.
      responses:
        '200':
          description: APCL per connected device, keyed by device address
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/lpcAPCL"
              example:
                "d:_n:SIM60745_Wallbox-9166afa5":
                  active: true
                  value: 4000
                  durationSeconds: 3600
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundLower"
  /hems/ActivePowerConsumptionLimit/{deviceAddress}:
    post:
      tags:
        - HEMS
      summary: Send the Active Power Consumption Limit (APCL) to one LPC device
      operationId: sendAPCLToDevice
      description: >-
        Same validation and semantics as `POST /hems/ActivePowerConsumptionLimit`,
        targeted at a single device. `deviceAddress` is looked up among the LPC
        controllable-system remote entities (`GET /hems/LpcDevicesData` lists valid
        addresses); an unknown address returns 404.


        Requires: the device must be paired and exposing the LPC controllable-system
        role.
      requestBody:
        content:
          application/json:
            schema:
