      summary: Send a COB power-mode limit setpoint to a device
      operationId: postHemsCobPowerModeLimit
      description: >-
        Writes a Coordinated Battery Optimization (COB) power-mode limit setpoint to the
        paired controllable-system device identified by deviceAddress. Requires: a remote
        device already paired at deviceAddress. When active is true, value (Watts) is
        mandatory. The EEBUS write outcome (success or failure) is always reported in the
        200 body via success/reason; it does not change the HTTP status. The handler also
        checks a COB use-case-availability flag, but that flag is initialized once at
        startup (and only re-initialized by `POST /sim` with `action: "reset"`) and is never left unset, so
        the 400 below cannot actually fire in a running server — overall license validity
        is still enforced globally (403 on an expired license).
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIM60745_Inverter-9166afa5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobLimitDetails"
            example:
              active: true
              value: 3000
              duration: 0
      responses:
        '200':
          description: Successful response. success reflects whether the device accepted the write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CobLimitDetails"
                  reason:
                    type: string
              example:
                success: true
                data: { active: true, value: 3000, duration: 0 }
                reason: ""
        '400':
          description: COB use case not supported by this build (see description — not reachable once the server is running), or active=true without a value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsEntityOrCobDeviceNotFound"
  /hems/cob/ActiveControlMode/{deviceAddress}:
    post:
      tags:
        - HEMS
      summary: Switch a COB device's active control mode
      operationId: postHemsCobActiveControlMode
      description: >-
        Selects which COB setpoint category (power or pcc) governs the paired device, by
        writing its "batteryActiveControlMode" device-configuration key. Requires: a device
        paired at deviceAddress that exposes a batteryActiveControlMode configuration key.
        mode must be "power" or "pcc" (case-insensitive). Unlike most COB limit routes, a
        failed EEBUS write is reported as HTTP 500, not 200. The handler also checks a COB
        use-case-availability flag, but that flag is initialized once at startup and never
        left unset, so the 400 below cannot actually fire for that reason in a running
        server — overall license validity is still enforced globally (403 on an expired
        license).
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIM60745_Inverter-9166afa5
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum: [power, pcc]
                  description: COB setpoint category to activate on the device
      responses:
        '200':
          description: Device accepted the mode switch
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                  reason:
                    type: string
        '400':
          description: Invalid mode, or malformed body (COB-not-supported is checked but not reachable in a running server — see description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsEntityOrCobDeviceNotFound"
        '500':
          description: The EEBUS write to the device failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    type: object
                  reason:
                    type: string
