      summary: Toggle the EVSE simulation/testing mode
      description: >-
        Switches the EVSE between simulation and testing mode. The pinned
        override values are set separately via PATCH /evse/{evseId}/values.
        Entering testing mode seeds the pinned total power from the EVSE's
        current simulated load, so the first GET after enabling it reflects
        continuity rather than a jump to zero. This is a prerequisite for POST
