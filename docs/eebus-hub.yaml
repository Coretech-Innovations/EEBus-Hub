    StubRequestEcho:
      title: Echoed request (unimplemented/stub endpoint)
      type: object
      description: >-
        Response body of a not-yet-implemented endpoint that only logs and echoes back
        the request it received (internal.PrintRequestData). No state is read or changed.
      properties:
        route:
          type: string
          description: The request URI as received (path + raw query string)
          example: /api/v1/hems/config/connectedDevices
        method:
          type: string
          example: GET
        params:
          type: array
          nullable: true
          description: Gin path parameters as [{key, value}, ...]. A route with no path
            parameters serialises this as null, not [] — gin's Context.Params is a nil
            slice there.
          items:
            type: object
            properties:
              Key:
                type: string
              Value:
                type: string
        query:
          type: object
          description: Parsed query-string parameters, one array of values per key
          additionalProperties:
            type: array
            items:
              type: string
        body:
          type: object
          nullable: true
          description: The parsed JSON request body, echoed back verbatim
