          schema:
            $ref: '#/components/schemas/statusError'
    LicenseExpiredForbidden:
      description: >-
        License expired, or the entity kind / use case is not covered by it.
        Written by LicenseMiddleware (internal/restHandler.go) and
        FeatureLicenseMiddleware (internal/featureLimiter.go), both as
        `{"err": "..."}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/statusError"
    OscevNotLicensedForbidden:
      description: OSCEV use case is not licensed or is disabled on the HEMS
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/statusError"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/statusError'
    ControlBoxNotFound:
      description: Control box not found
      content:
        application/json:
