          type: number
          format: double
          x-unit: "%"
          description: >-
            charge / (batteryHealth/100 * nominalCapacity) * 100 — state of charge
            relative to the health-derated effective capacity
        charge:
          type: number
          format: double
          x-unit: kWh
          description: Current battery charge
        nominalCapacity:
          type: number
          format: double
          x-unit: kWh
          description: Nominal (rated) battery capacity
        health:
          type: number
          format: double
          x-unit: "%"
          description: Battery health/state-of-health
