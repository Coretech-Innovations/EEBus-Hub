          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PVStringStatus"
        '400':
          description: The inverter has no PV string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
    patch:
      tags:
        - Inverter
      summary: Update the PV string configuration
      description: >-
        Applies a partial update to the PV string. Omitted fields keep their current value.
        Setting productionEnabled to false stops production regardless of the LPP limit.
      operationId: updateInverterPvString
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PVStringPatchRequest"
      responses:
        '200':
          description: The PV string configuration and live values after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PVStringStatus"
        '400':
          description: The inverter has no PV string, or a value is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/pvstring/mode:
    patch:
      tags:
        - Inverter
      summary: Toggle the PV string simulation/testing mode
      description: >-
        Switches the PV string between simulation and testing mode. Pinned values are
        set via PATCH /inverter/{inverterId}/pvstring/values.
        While the inverter is in testing mode the PV string must stay in it: testingMode
        false is rejected with 409 (see lockedByParent in the response).
        A PV string put into testing mode by this endpoint stays in it when the inverter
        leaves testing mode. This includes a PV string that was already in testing mode
        because of the inverter: testingMode true makes that testing mode the PV
        string's own.
      operationId: updateInverterPvStringMode
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationModeRequest"
      responses:
        '200':
          description: The PV string status after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PVStringStatus"
        '400':
          description: The inverter has no PV string, or an invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '409':
          description: >-
            testingMode false while the inverter is in testing mode: the PV string must
            stay in testing mode until the inverter leaves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/pvstring/values:
    patch:
      tags:
        - Inverter
      summary: Set the PV string forced values (testing mode only)
      description: >-
        Pins the PV string's DC/extra overrides verbatim. Requires testing mode (400
        otherwise). Every field optional.
      operationId: updateInverterPvStringValues
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PVStringForcedValuesRequest"
      responses:
        '200':
          description: The PV string status after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PVStringStatus"
        '400':
          description: No PV string, not in testing mode, or an invalid value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/qr-code:
    get:
      tags:
        - Inverter
      summary: Get the inverter's SHIP pairing QR code text
      operationId: getInverterQRPair
      description: >-
        Returns the SHIP pairing QR code text (shipID/fingerprint/secret encoded) for
        this inverter's own EEBUS service. Requires the service to have already
        started — call `POST /inverter/{inverterId}/trust` at least once first (its
        first call boots the service); otherwise 400 "service not initialized".
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRPairDataResponse"
        '400':
          description: Invalid ID, wrong entity type, or the inverter's EEBUS service has not started yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /controlbox/add:
    post:
      tags:
        - ControlBox
      summary: Create the ControlBox entity
      operationId: addControlBox
      description: >-
        Creates the singleton ControlBox — a simulated EEBUS GridConnectionHub that acts
        as the limit **sender** to paired downstream controllable-system devices (mirroring
        HEMS's LPC/LPP role: see `POST /controlbox/ActivePowerConsumptionLimit` etc.) and,
        via MGCP, as the grid-connection-point (GCP) meter **server** a paired HEMS reads
        from — see `GET /hems/MgcpMeasurementData`, which stays empty until this ControlBox
        is added and trust-paired to that HEMS.


        Requires: the simulation must not be running (400), and at most one ControlBox may
        exist at a time — a second POST fails with 400 "cb is already added" (the entity is
        a process-wide singleton; delete the existing one first via `DELETE /controlbox`).


        `vendorCode`, `deviceModel`, `serialNumber` and `DeviceName` must each be non-empty
        (400 with a per-field `{"<field>":"Invalid"}` map otherwise); `deviceBrand` must
        also be non-empty to pass validation, but the value sent is discarded — the server
        always overwrites it with `"Coretech-Innovations"`. The LPC/MPC/LPP/MGCP
        use-case-enabled flags are likewise set from the server's license/feature
        configuration, not from the request body. `trustConnections` peers (if any) are
        mutually trusted once the simulation starts — see `TrustPeerRef`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlBoxInfo"
            example:
              DeviceName: SimulatedControlBox
              vendorCode: SIMCB
              deviceBrand: Coretech-Innovations
              deviceModel: CB-1000
              serialNumber: "10001"
      responses:
        '200':
          description: ControlBox created and its EEBUS service started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  id:
                    type: integer
                    description: Engine entity ID of the new ControlBox
                  SKI:
                    type: string
                    description: The ControlBox's own local SKI (for pairing from the remote side)
        '400':
          description: >-
            A required field is empty (per-field map), a trust-connection reference is
            invalid, or a ControlBox already exists ("cb is already added"), or the
            simulation is running ("can not add CB while simulation is running")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /controlbox:
    patch:
      tags:
      - ControlBox
      summary: Update the ControlBox's image
      operationId: updateControlBox
      description: "Despite accepting the full `ControlBoxInfo` shape as its request body, this endpoint\
        \ only ever applies a change to `ImgBase64` — every other field in the body is silently ignored\
        \ (bound onto a copy of the config, then discarded except for the image comparison). Behavior branches\
        \ on both whether the image actually changed and whether the simulation is running:\n- Image changed,\
        \ simulation running → 200 `{\"status\":\"Successfully updated the\n  Image\"}`.\n\n- Image changed,\
        \ simulation stopped → 200 `{\"status\":\"OK\"}`.\n- Image unchanged (byte-identical to the current\
        \ value, including both empty),\n  simulation running → 400 `{\"err\":\"Simulation is running, Can\
        \ not update the\n  CB\"}`.\n\n- Image unchanged, simulation stopped → 400 `{\"err\":\"Invalid request\
        \ body\"}`.\nIn other words a request whose `ImgBase64` does not differ from the ControlBox's current\
        \ value always fails with 400, regardless of simulation state."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ImgBase64:
                  type: string
                  description: Base64-encoded image. Only field this endpoint actually applies.
            example:
              ImgBase64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB...
      responses:
        '200':
          description: The image was different from the current value and has been applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: '"OK" if the simulation was stopped, "Successfully updated the Image" if
                      it was running'
        '400':
          description: 'Rejected before anything changed: a malformed body, a field that failed validation,
            or a field this route refuses to change.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/statusError'
                - $ref: '#/components/schemas/FieldRejectionError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/ControlBoxNotFound'
        '409':
          description: The field can only be changed while the device is stopped (heartbeatTimeoutInSeconds
            is handed to the EEBUS service at setup).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRejectionError'
    get:
      tags:
      - ControlBox
      summary: Get the ControlBox
      operationId: getControlBox
      description: Returns the ControlBox's engine ID, configuration and local SKI, or an empty array `[]`
        (200, not 404) if none has been added yet — mirrors the vacuous-list convention used elsewhere in
        this API rather than a 404.
      responses:
        '200':
          description: The ControlBox if one exists, otherwise an empty array
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    controlBoxId:
                      type: integer
                    config:
                      $ref: '#/components/schemas/ControlBoxInfo'
                    ski:
                      type: string
                - type: array
                  items: {}
                  maxItems: 0
              examples:
                exists:
                  value:
                    controlBoxId: 1
                    config:
                      DeviceName: SimulatedControlBox
                      vendorCode: SIMCB
                    ski: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
                none:
                  value: []
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
    delete:
      tags:
      - ControlBox
      summary: Delete the ControlBox
      operationId: deleteControlBox
      description: 'Tears down the ControlBox''s EEBUS service, unregisters it from the engine, and (if
        one existed) always responds 200 — there is no 404 for "no ControlBox exists" on this route; deleting
        when none exists is a silent no-op that still returns `{"status":"OK"}`.


        Requires: the simulation must not be running (400), and no compliance test run may be active unless
        the request carries a valid X-EEBUS-Internal-Test-Token header (409 otherwise).'
      parameters:
      - name: X-EEBUS-Internal-Test-Token
        in: header
        required: false
        description: Internal token used by test automation to bypass the active-test-run block.
        schema:
          type: string
      responses:
        '200':
          description: Deleted (or there was nothing to delete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusOk'
        '400':
          description: The simulation is running ("can not delete CB while simulation is running")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '409':
          description: Blocked because a compliance test run is active and the request did not carry a valid
            X-EEBUS-Internal-Test-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /controlbox/extDevices:
    get:
      tags:
        - ControlBox
      summary: List the ControlBox's connected real (external) devices
      operationId: getControlBoxExtDevices
      description: >-
        Returns the ControlBox's connected entities filtered down to those flagged
        `isExternal` (real paired devices, not simulated ones) — the ControlBox-only
        analog of `GET /hems/extDevices` (which additionally folds in the ControlBox's
        entities when one is present; this endpoint returns just the ControlBox's own).
        Returns an empty array `[]` (200) when there are none, not 404 — 404 is reserved
        for "no ControlBox exists at all".
      responses:
        '200':
          description: External (real, non-simulated) connected device entities. Empty array if none.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: SPINE entity type (e.g. EVSE, HeatPump, Inverter)
                    isExternal:
                      type: boolean
                      description: Always true for entries in this list
                    remoteSki:
                      type: string
                      description: SKI of the remote device this entity belongs to
                    address:
                      type: object
                      description: SPINE entity address
                      properties:
                        device:
                          type: string
                        entity:
                          type: array
                          items:
                            type: integer
              example:
                - type: EVSE
                  isExternal: true
                  remoteSki: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
                  address:
                    device: "d:_i:19667_ControlBox"
                    entity: [1]
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /controlbox/trust:
    post:
      tags:
        - ControlBox
      summary: Trust a remote device (announcer pairing)
      operationId: controlBoxTrustDevice
      description: >-
        Registers `remoteSki` as trusted so the SHIP announcer/discovery pairing flow
        can complete with that device. `remoteSki` is normalized (case/format) before
        use; empty after normalization → 400.


        Requires: the simulation must not be in the brief transitional "stopping" window
        after `POST /sim` `action: stop` (`Engine.isAllowedToPairDevices` — despite its
        name this is **not** "the simulation must be running": it also returns true while
        the simulation has never been started, or is fully stopped; only the few seconds
        while a Stop() teardown is in flight return false). 400 "Simulation not running"
        otherwise (the error message is misleading given the actual condition) — unlike
        `DELETE /controlbox/trust`, which has no such requirement.
        Distinct from `POST /controlbox/pairRequest`: this trusts a SKI the ControlBox
        expects to be *discovered* (mDNS/announcer); pairRequest actively dials out to a
        specific device via SHIP's Pairing Service (QR code or explicit shipId/fingerprint/
        secret).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustDeviceRequest"
            example:
              remoteSki: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid (empty after normalization) SKI, or the simulation is mid-teardown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
    delete:
      tags:
        - ControlBox
      summary: Untrust a remote device
      operationId: controlBoxUntrustDevice
      description: >-
        Disconnects (if connected) and unregisters `remoteSki` from the ControlBox's
        trusted-peer list. Unlike `POST /controlbox/trust`, this does **not** require
        the simulation to be running.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustDeviceRequest"
            example:
              remoteSki: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid (empty after normalization) SKI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /controlbox/heartbeat:
    post:
      tags:
        - ControlBox
      summary: Start or stop the ControlBox's heartbeat sender
      operationId: controlBoxHeartbeat
      description: >-
        `action` must be `"start"` or `"stop"` (any other value, including empty, is
        400 "wrong action entered"). Controls the DeviceDiagnosis heartbeat the
        ControlBox sends to its paired LPC/LPP controllable-system devices — see
        `GET /controlbox/latestSentHeartbeat` for the current counter/timeout/timestamp,
        and `GET /controlbox/latestReceivedHeartbeat{,/{deviceAddress}}` for the
        heartbeats received back.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatAction"
            example:
              action: start
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: 'action is neither "start" nor "stop"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
    get:
      tags:
        - ControlBox
      summary: Get the ControlBox's heartbeat sender state
      operationId: getControlBoxHeartbeat
      description: Reports whether the heartbeat sender toggled by POST /controlbox/heartbeat is currently running.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatState"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /controlbox/image:
    post:
      tags:
        - ControlBox
      summary: Upload the ControlBox's image
      operationId: uploadControlBoxImage
      description: >-
        Unconditionally overwrites the stored image (unlike PATCH /controlbox, which
        only applies a change and rejects a no-op). An empty string clears the image
        the same way as DELETE /controlbox/image.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  type: string
                  description: Base64 encoded image
            example:
              image: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB...
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
    get:
      tags:
        - ControlBox
      summary: Get the ControlBox's image
      operationId: getControlBoxImage
      description: Returns the image most recently set via POST/PATCH /controlbox/image.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseImage"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: Control box not found, or found but no image is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - ControlBox
      summary: Delete the ControlBox's image
      operationId: deleteControlBoxImage
      description: >-
        Clears the stored image. Unlike every other /controlbox/image route, a missing
        ControlBox here is a **400** (not 404) — "Failed to get CB entity". A ControlBox
        that exists but has no stored image is also a 400 ("no saved image"), and nothing
        is written in that case.
      responses:
        '200':
          description: Image cleared (an image was present before the call)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: No ControlBox exists ("Failed to get CB entity"), or it has no stored image ("no saved image")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /controlbox/ActivePowerConsumptionLimit:
    post:
      tags:
        - ControlBox
      summary: Send the Active Power Consumption Limit (APCL) to all paired LPC devices
      operationId: controlBoxSendAPCL
      description: >-
        ControlBox equivalent of `POST /hems/ActivePowerConsumptionLimit` — the
        ControlBox is the limit **sender**, commanding every downstream device paired
        to it and exposing the LPC controllable-system role (mirrors HEMS/EnergyGuard's
        own LPC sender behavior). Sends an LPC load-control limit write to every
        connected device (splitting `value` evenly across all of them when active=true
        and value > 0). `active` is required; `value` is additionally required when
        `active` is true (400 "Data missing" otherwise). See `lpcAPCL` for the
        durationSeconds/durationIndefinite precedence rule.


        `success` reflects whether *all* targeted devices accepted the write — see
        `ControlBoxAPCLSuccessResponse` for the exact semantics. **Differs from HEMS**:
        when zero LPC devices are connected, this endpoint reports success=**false**
        (HEMS reports true for the same vacuous case) — verified against
        `ControlBox.SendLpcApclToAllDevices`. See `GET /controlbox/LpcDevicesData` to
        discover connected devices' addresses and current APCL state.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lpcAPCL"
            example:
              active: true
              value: 4000
              durationSeconds: 3600
      responses:
        '200':
          description: Write attempted; see success/reason for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlBoxAPCLSuccessResponse"
        '400':
          $ref: "#/components/responses/DataMissingInBodyBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
    patch:
      tags:
        - ControlBox
      summary: Send the Active Power Consumption Limit (APCL) to all paired LPC devices (partial)
      operationId: controlBoxModifyAPCL
      description: >-
        Behaves like `POST /controlbox/ActivePowerConsumptionLimit`, except `active`
        is not required — the raw body is forwarded as-is (any subset of fields).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lpcAPCL"
            example:
              value: 3500
      responses:
        '200':
          description: Write attempted; see success/reason for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlBoxAPCLSuccessResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
    get:
      tags:
        - ControlBox
      summary: Get the Active Power Consumption Limit reported by all paired LPC devices
      operationId: controlBoxGetAPCL
      description: >-
        Returns each connected LPC device's current APCL as an object keyed by device
        address (**not** an array — the same map-vs-array distinction as
        `GET /hems/ActivePowerConsumptionLimit`). Devices whose APCL could not be read
        are omitted. See `GET /controlbox/LpcDevicesData` for the same data alongside
        failsafe values and constraints.
      responses:
        '200':
          description: APCL per connected device, keyed by device address
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/lpcAPCL"
              example:
                "d:_n:SIM60745_Wallbox-9166afa5":
                  active: true
                  value: 4000
                  durationSeconds: 3600
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /controlbox/ActivePowerConsumptionLimit/{deviceAddress}:
    post:
      tags:
        - ControlBox
      summary: Send the Active Power Consumption Limit (APCL) to one LPC device
      operationId: controlBoxSendAPCLToDevice
      description: >-
        Same validation and semantics as `POST /controlbox/ActivePowerConsumptionLimit`,
        targeted at a single device. `deviceAddress` is looked up among the ControlBox's
        LPC controllable-system remote entities (`GET /controlbox/LpcDevicesData` lists
        valid addresses); an unknown address returns 404.
      parameters:
        - $ref: "#/components/parameters/DeviceAddressParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lpcAPCL"
            example:
              active: true
              value: 4000
              durationSeconds: 3600
      responses:
        '200':
          description: Write attempted; see success/reason for the outcome
          content:
