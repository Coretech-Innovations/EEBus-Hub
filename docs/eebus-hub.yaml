        powerTransferDelay:
          type: number
          description: Power transfer delay
        algorithm:
          type: string
          enum:
          - FirstComeFirstServe
          - RoundRobin
          description: Load control algorithm
        lpcUseCaseEnabled:
          type: boolean
          description: LPC use case enabled
        mpcUseCaseEnabled:
          type: boolean
          description: MPC use case enabled
        mobUseCaseEnabled:
          type: boolean
          description: MOB use case enabled
        lppUseCaseEnabled:
          type: boolean
          description: LPP use case enabled
        mgcpUseCaseEnabled:
          type: boolean
          description: MGCP use case enabled
        opevUseCaseEnabled:
          type: boolean
          description: OPEV use case enabled
        evseccUseCaseEnabled:
          type: boolean
          description: EVSECC use case enabled
        evsocUseCaseEnabled:
          type: boolean
          description: EVSOC use case enabled
        moiUseCaseEnabled:
          type: boolean
          description: MOI use case enabled
        ohpcfUseCaseEnabled:
          type: boolean
          description: OHPCF use case enabled
        controllableSystemEnabled:
          type: boolean
          description: Controllable system enabled
        lpcInfo:
          $ref: '#/components/schemas/ControllableSystemInfo'
          description: LPC system information
        lppInfo:
          $ref: '#/components/schemas/ControllableSystemInfo'
          description: LPP system information
        failsafeDuration:
          type: number
          description: Failsafe duration in hours
        failSafeDurationMax:
          type: number
          description: Maximum failsafe duration in hours
        errorState:
          type: string
          enum:
          - Normal Operation
          - Failure
          description: Current error state
        lastErrorCode:
          type: string
          description: Last error code
        heartbeatState:
          type: string
          enum:
          - Running
          - Stopped
          description: Heartbeat state
        lpcState:
          $ref: '#/components/schemas/CSState'
          description: LPC state (read-only)
        lppState:
          $ref: '#/components/schemas/CSState'
          description: LPP state (read-only)
        oscevUseCaseEnabled:
          type: boolean
        oscevEnabled:
          type: boolean
        oscevOperatingState:
          type: string
          description: SPINE DeviceDiagnosis operating state for the OSCEV use case — normalOperation, or
            failure when the device reports an error condition.
          enum:
          - normalOperation
          - failure
        oscevHeartbeatActive:
          type: boolean
        heartbeatTimeoutInSeconds:
          type: integer
          format: int64
          minimum: 2
          maximum: 86400
          description: 'SPINE heartbeat timeout advertised to peers, in seconds. Optional: when the field
            is omitted the device type''s default applies - 4 for EVSE, heat pump and HEMS, 60 for inverter
            and control box. An explicit 0, or a value outside 2..86400, is rejected with 400; the lower bound
            exists because SPINE only applies its 2 s transmit margin above 2 s, the upper bound because the
            value is converted to a duration. The timeout is handed to the eebus service at setup, so it can
            only be changed while that service does not exist yet; a change after the device is started is
            rejected with 409.'
        cobUseCaseEnabled:
          type: boolean
          description: COB use case enabled
        mpsUseCaseEnabled:
          type: boolean
          description: MPS use case enabled
    HEMSConfigPatch:
      title: HEMS configuration fields accepted by PATCH /hems
      description: 'A HEMSConfig body without the use-case availability fields. PATCH /hems answers

        400 when one of them carries a value that differs from the current one, and

        applies nothing: use-case toggles belong to PATCH /sim/usecases, and

        controllableSystemEnabled is create-time only. Repeating the current value is

        accepted and ignored, so a body read back from GET /hems can be submitted

        unchanged. Use-case state is still reported by GET /hems and still accepted by

        POST /hems.'
      allOf:
      - $ref: '#/components/schemas/HEMSConfig'
      - not:
          anyOf:
          - required:
            - lpcUseCaseEnabled
          - required:
            - mpcUseCaseEnabled
          - required:
            - mobUseCaseEnabled
          - required:
            - cobUseCaseEnabled
          - required:
            - mpsUseCaseEnabled
          - required:
