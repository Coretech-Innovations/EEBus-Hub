          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No ControlBox exists, or no LPP device with that address is connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /controlbox/ActivePowerProductionLimitConstraints:
    get:
      tags:
        - ControlBox
      summary: Get Active Power Production Limit constraints from all paired LPP devices
      operationId: controlBoxGetLPPConstraints
      description: >-
        Returns each connected LPP device's nominal/contractual power-production
        constraints as an object keyed by device address (not a bare array — the
        previous `type: array` schema did not match
        `ControlBox.GetLppConstaraintsFromAllDevices`, which returns
        `map[string]hubapi.LppConstraints`). Same not-reachable LPP-enabled gate as
        the other LPP endpoints.
      responses:
        '200':
          description: Constraints per connected device, keyed by device address
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    powerProductionNominalMax:
                      type: number
                      x-unit: W
                      description: Device's nominal maximum power production
                    contractualProductionNominalMax:
                      type: number
                      x-unit: W
                      description: Contractually agreed maximum power production
        '400':
          description: LPP use case not enabled (not reachable once the server is running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /controlbox/LppDevicesData:
    get:
      tags:
        - ControlBox
      summary: Get LPP data (APPL, failsafe, constraints) for all paired devices
      operationId: controlBoxGetLppDevicesData
      description: >-
        Returns, per connected LPP controllable-system device, its address, SKI,
        current APPL, current failsafe production limit and power-production
        constraints in one call — a convenience combining what
        `GET /controlbox/ActivePowerProductionLimit`,
        `GET /controlbox/FailsafeActivePowerProductionLimit` and
        `GET /controlbox/ActivePowerProductionLimitConstraints` return separately.
        Unlike those three (objects keyed by device address), this returns a bare
        array. Same not-reachable LPP-enabled gate as the other LPP endpoints.
      responses:
        '200':
          description: One entry per connected LPP device. Empty array if none are connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LppDeviceDataArrayResponse"
        '400':
          description: LPP use case not enabled (not reachable once the server is running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /controlbox/latestSentHeartbeat:
    get:
      tags:
        - ControlBox
      summary: Get the ControlBox's latest sent heartbeat
      operationId: controlBoxGetLatestSentHeartbeat
      description: >-
        Reports the counter/timeout/timestamp of the DeviceDiagnosis heartbeat frame
        the ControlBox last sent to its paired LPC/LPP devices (started/stopped via
        POST /controlbox/heartbeat).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatWrapper"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
        '500':
          description: LPC use case disabled, or no heartbeat has been sent yet ("data not initialized yet")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /controlbox/latestReceivedHeartbeat:
    get:
      tags:
        - ControlBox
      summary: Get the latest received heartbeat from every connected remote device
      operationId: controlBoxGetAllLatestReceivedHeartbeats
      description: >-
        `result` is an object keyed by device address (**not** an array of
        `{deviceAddress, heartbeat}` entries — verified against
        `ControlBox.GetLatestReceivedHeartbeatForAllEntities`, which returns
        `map[model.AddressDeviceType]hubapi.HeartbeatData`). Devices with no received
        heartbeat yet are omitted. The 500 response documented by the handler's nil
        check is not actually reachable — the underlying map is always initialized
        non-nil, even when empty.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  result:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/HeartbeatData"
              example:
                status: OK
                result:
                  "d:_n:SIM60745_Wallbox-9166afa5":
                    timestamp: "2026-01-15-10-30-00"
                    counter: 42
                    timeout: 4
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /controlbox/latestReceivedHeartbeat/{deviceAddress}:
    get:
      tags:
        - ControlBox
      summary: Get the latest received heartbeat from one connected device
      operationId: controlBoxGetLatestReceivedHeartbeat
      description: Per-device counterpart of GET /controlbox/latestReceivedHeartbeat, scoped to a single deviceAddress.
      parameters:
        - $ref: "#/components/parameters/DeviceAddressParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatWrapper"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
        '500':
          description: >-
            LPC use case disabled, the device address is not a connected LPC entity, or
            no heartbeat has been received yet from it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /controlbox/connectedDevices:
    get:
      tags:
        - ControlBox
      summary: List every device connected to the ControlBox
      operationId: controlBoxGetConnectedDevices
      description: >-
        Returns every paired remote device (real or simulated, LPC/LPP/MPC/MGCP alike),
        not just LPC devices — broader than `GET /controlbox/LpcDevicesData`. Each entry
        is keyed by SKI, not deviceAddress: verified against `ControlBox.GetConnectedNodes`,
        which returns `[]internal.Node` — there is no `deviceAddress` field on this type
        (the previous schema's `{deviceAddress, ski}` shape did not match). Returns an
        empty array (200) when nothing is connected.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: SPINE device type of the remote device (empty until its SHIP pairing completes)
                    isExternal:
                      type: boolean
                      description: True for a real device, false for one simulated by this same hub instance
                    ski:
                      type: string
                      description: SKI of the remote device
                    entities:
                      type: array
                      description: The remote device's SPINE entities (DeviceInformation excluded)
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: SPINE entity type, e.g. EVSE, HeatPump, Inverter
                          address:
                            type: array
                            description: SPINE entity address (device + entity path)
                            items:
                              type: integer
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /controlbox/MpcMeasurementData:
    get:
      tags:
        - ControlBox
      summary: Get MPC measurement data from all connected monitored devices
      operationId: controlBoxGetMpcMeasurementData
      description: >-
        Returns power/energy/current/voltage/frequency measurements for every
        connected device exposing the MPC monitored-unit role (EVSE, HeatPump,
        Inverter, SubMeter, compressor/immersion-heater entities) — the ControlBox's
        own analog of `GET /hems/MpcMeasurementData`. Requires: the MPC use case to be
        enabled. In practice the corresponding `useCasesEnable.MpcEnabled == nil`
        check in the handler never fires once the server is running — that flag is
        set once at startup and never left unset — so the 400 branch below is not
        reachable in a running server; MPC availability is actually enforced by
        license validity.
      responses:
        '200':
          description: Successful response. Empty array if no MPC devices are connected.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                    measurements:
                      $ref: "#/components/schemas/measurementData"
        '400':
          description: MPC use case not enabled (see description — not reachable once the server is running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No ControlBox exists, or the MPC handler itself returned an error ("MPC returned error ...")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /controlbox/pairRequest:
    post:
      tags:
        - ControlBox
      summary: Actively dial out to a device via SHIP's Pairing Service
      operationId: controlBoxPairRequest
      description: >-
        Distinct from `POST /controlbox/trust` (which registers a SKI to accept a
        connection *from*): this endpoint starts an outbound SHIP pairing
        announcement to a specific target device, either decoded from a QR code
        (`qrcodeText`) or given explicitly (`forId`/`forPar`/`secret`) — see
        `ControlBoxPairRequest` for the exact precedence. On success, the pairing
        target's SKI is remembered so that once the SHIP handshake completes and the
        connection is trusted, it persists across the next `simulation start`.


        Requires: the server's SHIP Pairing Service must be supported by the current
        license (400 "SHIP Pairing Service not supported" otherwise).


        Note: on success the handler returns without writing any response body — the
        client receives a bare HTTP 200 with an empty body, not a `{"status":"OK"}`
        payload.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlBoxPairRequest"
            example:
              forId: SHIP-1234-5678-9012
              forPar: 3af9c1...
              secret: "5a1e..."
      responses:
        '200':
          description: >-
            Pairing announcement started. Empty body — the handler does not write a
            JSON payload on this path.
        '400':
          description: >-
            Malformed request body; SHIP Pairing Service not supported by the license;
            the QR code text is missing/malformed a shipID, fingerprint or secret
            ("invalid body: ... invalid or not found"); qrcodeText absent and one of
            forId/forPar/secret is also missing ("invalid QRCode"); or the underlying
            SHIP announcement failed to start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
  /license:
    get:
      tags:
        - License
      summary: Get the current license's terms, expiry and capability catalogue
      operationId: getLicense
      description: >-
        Returns the raw license payload (customer, issue/expiry time) enriched with
        the full catalogue of simulated device kinds, use cases and non-use-case
        features (`devices`/`usecases`/`features`), each flagged `supported: true|false`
        so the UI can render locked items instead of hiding them. The `supported` flags
        come from `LicenseFeatureLimiter`, not the raw `allowedEntities`/`allowedUsecases`
        lists — a license that omits either falls back to the built-in defaults (see
        `internal.defaultAllowedEntities`/`defaultAllowedUsecases`), so the limiter, not
        the raw list, is authoritative. `valid` reflects `HubLicense.IsValid()` (signed,
        issued, and not expired as of the last periodic re-check).


        Requires: none. Unlike every other endpoint in this specification (except
        `GET /version`), this route is registered outside the license middleware
        chain (`LicenseMiddleware`/`FeatureLicenseMiddleware`) — it is reachable even
        when `license.lic` is missing, invalid or expired, since a client needs it to
        find out *why* every other route is returning 403.
      responses:
        '200':
          description: >-
            The license payload plus the full device/use-case/feature catalogue,
            each entry annotated with whether the current license grants it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseData"
  /version:
    get:
      tags:
        - Version
      summary: Get the running build's version, build time and analyzer availability
      operationId: getVersion
      description: >-
        Returns the version tag and build timestamp injected via linker flags
        (`-ldflags`) at release build time. A development build (`go run`/`make run`
        without the release build step) reports `"N/A"` for both fields, since the
        linker variables are never set. `analyzerEnabled` mirrors
        `internal/analyzer.Enabled()` — whether the EEBUS Analyzer subsystem was
        compiled in and is licensed (see `eebusAnalyzerSupported` on `GET /license`);
        it does not depend on the version numbers.


        Requires: none. Like `GET /license`, this route bypasses the license
        middleware entirely (`UNLICENSED_TAGS`), so it is reachable even without a
        valid `license.lic` — a client needs it to identify the build before it can
        diagnose a licensing problem.
      responses:
        '200':
          description: Version tag, build time, and whether the EEBUS Analyzer is enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: >-
                      Release version tag injected at build time (e.g. "v1.4.2"), or
                      "N/A" in a development build.
                    example: "v1.4.2"
                  buildTime:
                    type: string
                    description: >-
                      Build timestamp injected at build time (format is whatever the
                      release tooling passes via -ldflags), or "N/A" in a development build.
                    example: "2025-01-15T10:30:00Z"
                  analyzerEnabled:
                    type: boolean
                    description: Whether the EEBUS Analyzer subsystem is compiled in and licensed.
  /newVersion/{email}/{name}:
    post:
      tags:
        - Updates
      summary: Register this contact for a download-link email on the OTA update service
      operationId: registerUpdateNotification
      description: >-
        Forwards `email` and `name` to Coretech's external OTA/download-link service
        (`internal.SendRequest`, POST, no request timeout configured — subject only to
        the underlying TCP/OS defaults) along with fixed placeholder fields
        (`postion: "Developer"`, `company: "OTA Company"`, `contact: false`,
        `receive: false`). No local state is created or persisted by the Hub itself;
        this is purely a relay. The upstream URL and its `x-api-key` are compiled-in,
        base64-obfuscated constants (`RequestDownloadLinkURLEncoded`/`apiKeyEncoded`),
        not configurable at runtime. Both path segments are required non-empty strings
        — no further format validation (e.g. email syntax) is performed before the
        upstream call.


        Requires: none beyond a valid license (default license-gated route).
      parameters:
        - name: email
          in: path
          schema:
            type: string
          required: true
          description: Contact email forwarded to the upstream OTA service verbatim.
          example: user@example.com
        - name: name
          in: path
          schema:
            type: string
          required: true
          description: >-
            Contact name forwarded to the upstream OTA service verbatim. A literal
            space (as in the example) must be percent-encoded by the client.
          example: John%20Doe
      responses:
        '200':
          description: The upstream service accepted the request (returned HTTP 200).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            Empty email or name path segment, or the upstream request failed (network
            error, non-200 status, or an undecodable response body) — the handler
            does not distinguish these cases in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /remoteVersion:
    get:
      tags:
        - Updates
      summary: Get the latest version published by the OTA update service
      operationId: getRemoteVersion
      description: >-
        Calls the same external Coretech OTA service as `POST /newVersion/{email}/{name}`
        (GET, with a fixed `x-api-key` header; both the URL and key are compiled-in,
        base64-obfuscated constants) and returns the `version` string it reports. No
        request timeout is configured beyond the Go HTTP client / OS defaults, so a
        stalled upstream blocks the handler for as long as the underlying connection
        stays open. This is also what the Hub's internal periodic update check
        (`checkForNewUpdates`) polls to decide whether to emit a `newVersion Found`
        event over `/events_ws` — this endpoint exposes the same lookup on demand.


        Requires: none beyond a valid license (default license-gated route).
      responses:
        '200':
          description: The latest version reported by the OTA service.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "v1.5.0"
        '400':
          description: >-
            The upstream request failed: network/connection error, a non-200 status,
            an empty `version` field, or an undecodable response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"

  /testing/state:
    get:
      tags:
        - Testing
      summary: Get the testing dashboard overview
      operationId: getTestingState
      description: >-
        Returns the DUT identity/config, the current suite/test-case
        selection, and the run lifecycle state in one call — the snapshot
        used to render the Testing page on load. `dut` is the same data as
        GET /testing/dut/environment plus GET /testing/dut/test-config
        combined; `selection` is the same as GET /testing/selection; `run` is
        the lightweight status also returned by GET /testing/run/status
        (which additionally includes per-test-case results). No side
        effects.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingDashboardStateSnapshot"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /testing/run/status:
    get:
      tags:
        - Testing
      summary: Poll the active test run's progress and per-test-case results
      operationId: getTestingRunStatus
      description: >-
        Poll this while a run is in progress (started by POST
        /testing/execute) to drive a progress bar and a per-test-case
        results table. `status` transitions idle → running →
        (completed|failed), or running → cancelling → failed when POST
        /testing/execute/cancel is called. `progress` is the percentage of
        selected test cases that have finished (passed, failed, or
        skipped) — recomputed after every test-case completion event, not a
        wall-clock estimate. `testCases` mirrors the compliance pipeline's
        per-case status list, seeded from the current selection when the run
        starts. Cross-ref: GET /testing/logs/stream for live log lines
        during the run, GET /testing/report for the HTML report once the run
        finishes.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingRunStatus"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /testing/report:
    get:
      tags:
        - Testing
      summary: Download the HTML report for the last finished run
      operationId: getTestingReport
      description: >-
        Serves the Ginkgo-generated `report.html` for the most recently
        finished run (inline, `Content-Disposition: inline`). Requires: no
        test run currently active — 409 while `status` is `running` or
        `cancelling` (see GET /testing/run/status); 404 if no run has ever
        completed, or if the report file for the last run is missing on
        disk.
      responses:
        '200':
          description: Generated HTML report for the latest finished test run
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No report is available or the report was not generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '409':
          description: Test run is still active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to read the generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /testing/dut/environment:
    get:
      tags:
        - Testing
      summary: Get the configured DUT connection settings
      operationId: getTestingDUTEnvironment
      description: >-
        Step 1 of the compliance run lifecycle: DUT identity (`ski`,
        `shipId`) and connection (`rpcUrl`) must be set — via POST to this
        same path — before test-case selection (POST /testing/selection) or
        execution (POST /testing/execute) can succeed. Returns zero-value
        fields until configured.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingDUTEnvironment"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    post:
      tags:
        - Testing
      summary: Configure the DUT connection settings
      operationId: configureTestingDUTEnvironment
      description: >-
        Sets the DUT SKI, SHIP pairing ID, and JSON-RPC address the
        compliance pipeline will drive during a run. `ski` is normalized
        (whitespace stripped, lowercased) and must resolve to 40 hex
        characters or the request is rejected. `rpcUrl` must be
        `host:port`; live reachability is not checked here — poll GET
        /testing/rpc-server/status separately, or rely on the pre-run probe
        performed by POST /testing/execute. Requires: the compliance-tests
        license feature, and no test run currently active (400 if one is
        running or cancelling; see GET /testing/run/status). Side effect:
        persists to
        `testingConfiguration.json` and emits an SSE `testingUpdate` event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/testingDUTEnvironment"
            example:
              ski: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
              shipId: eebus-hub-dut-01
              rpcUrl: 127.0.0.1:8081
              stopOnFirstFailure: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            Malformed request body, invalid DUT SKI, or a test run is
            currently active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          description: Compliance tests are not enabled by the current license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to persist testing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /testing/rpc-server/status:
    get:
      tags:
        - Testing
      summary: Probe the DUT RPC server for reachability
      operationId: getTestingRpcServerStatus
      description: >-
        Performs a live TCP dial (`net.DialTimeout`, 2 s timeout) to the
        `rpcUrl` configured via POST /testing/dut/environment on every call
        and reports whether a listener accepted the connection. Safe to
        poll — the same probe backs a 2 s background monitor that fires the
        `rpcServerStatusUpdate` SSE event (see GET /events) whenever
        reachability flips, so the UI does not have to poll this endpoint
        continuously. Returns `reachable: false` with `host`/`port` omitted
        (no dial attempted) when no `rpcUrl` is configured for the DUT. This
        same reachability check runs once, synchronously, at the start of
        POST /testing/execute — a run fails immediately if it does not
        pass.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reachable:
                    type: boolean
                  host:
                    type: string
                  port:
                    type: integer
              example:
                reachable: true
                host: 127.0.0.1
                port: 8081
        '400':
          description: Configured DUT RPC address is not a valid host:port
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /testing/dut/test-config:
    get:
      tags:
      - Testing
      summary: Get the configured DUT test parameters
      operationId: getTestingDUTTestConfig
      description: Returns the DUT's electrical/timing parameters (nominal power, failsafe limits, MPC capabilities,
        …) used to parameterize compliance test cases. Returns `null` until configured via POST to this
        same path. Only the subset of fields required by the current selection (GET /testing/required-config)
        needs to be set before a run; unrelated fields may be omitted.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/testingSuiteConfig'
                nullable: true
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
    post:
      tags:
      - Testing
      summary: Configure the DUT test parameters
      operationId: configureTestingDUTTestConfig
      description: 'Step 2 of the compliance run lifecycle (after POST /testing/dut/environment): sets the
        DUT power/timing/MPC-capability values the selected test cases need. Only fields required by the
        current suite/test-case selection are validated — see GET /testing/required-config for the field
        list, which changes as the selection (POST /testing/selection) changes. Validated ranges include
        `dutFailsafeDurationMaxSeconds` (7200–86400 s), non-negative limit/duration fields, and min ≤ max
        pairing between the nominal-power and active-power-limit fields. Requires: the compliance-tests
        license feature, and no test run currently active (400 if one is running or cancelling). Side effect:
        persists to `testingConfiguration.json` and emits an SSE `testingUpdate` event.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/testingSuiteConfig'
            example:
              dutNominalPowerConsumptionMaxWatt: 11000
              dutActivePowerConsumptionLimitMinWatt: 0
              dutFailsafeDurationMaxSeconds: 7200
              dutFailsafeInitialDurationSeconds: 7200
              dutFailsafeInitialValueWatt: 0
              dutIsHEMS: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusOk'
        '400':
          description: Malformed request body, a required field for the current selection is missing or
            out of range, or a test run is currently active
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/statusError'
                - $ref: '#/components/schemas/testingValidationError'
        '403':
          description: Compliance tests are not enabled by the current license
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '500':
          description: Failed to persist testing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /testing/discoveredDUTs:
    get:
      tags:
        - Testing
      summary: List EEBUS services discovered on the network via mDNS
      operationId: getTestingDiscoveredDUTs
      description: >-
        Returns the hub's live mDNS scan results, used to help a user pick a
        DUT's SKI/host without typing it by hand before POST
        /testing/dut/environment. Simulated hub entities are suppressed from
        the list by default (see the `--mdnsnosuppres` flag); this is a
        read-only convenience lookup, not a requirement of the run
        lifecycle.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdnsEntry"

        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /testing/testcases:
    get:
      tags:
        - Testing
      summary: List every known compliance test case
      operationId: getTestingTestCases
      description: >-
        Returns the full compliance-suite catalogue, unfiltered by license —
        the Testing page must remain browsable for every user; license
        restrictions are enforced only at selection time (POST
        /testing/selection, 403 if a suite/test case is not permitted) and
        again at execution time. `suite` groups test cases (e.g. `lpc-cs`,
        `lpp-cs`) and is the value POST /testing/selection accepts under
        `suites`. `requiredConfigFields` lists, per test case, which POST
        /testing/dut/test-config fields it needs — the same identifiers
        returned in aggregate by GET /testing/required-config for the
        current selection.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/testingTestCase"

        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /testing/logs:
    get:
      tags:
      - Testing
      summary: Get buffered test execution logs, or upgrade to a log WebSocket
      description: 'Dual-mode endpoint. A plain GET returns the last `limit` buffered log entries (ring
        buffer of 500) as a JSON array — a one-shot snapshot, no data is added. If the request carries WebSocket
        upgrade headers (`Connection: Upgrade`, `Upgrade: websocket`), the handler instead upgrades the
        connection: it first replays the full current buffer, then pushes each new entry as JSON as the
        active run produces it, and sends periodic pings to keep the socket alive across proxies. Logs are
        cleared at the start of every new run (POST /testing/execute), and any WebSocket subscriptions open
        from a previous run are closed at that point so they cannot bleed into the new run''s log stream.
        For a plain-HTTP alternative to the WebSocket, see GET /testing/logs/stream (Server-Sent Events).'
      operationId: getTestingLogs
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
        required: false
        description: Number of latest entries to return. Returns all if omitted or invalid.
      responses:
        '200':
          description: Successful response (plain GET only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/testingExecutionLog'
        '101':
          description: Switching Protocols — returned instead of 200 when the request is a WebSocket upgrade.
            The socket then carries a JSON `testingExecutionLog` object per message.
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
    delete:
      tags:
      - Testing
      summary: Clear buffered test execution logs
      description: 'Empties the in-memory test execution log buffer so a later WebSocket (or REST) read
        only returns entries produced after this call.


        Requires: nothing beyond a valid license; the buffer exists whether or not a test run is active,
        and clearing it while one is running simply drops the entries produced so far.

        '
      operationId: clearTestingLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusOk'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
  /testing/logs/download:
    get:
      tags:
        - Testing
      summary: Download the full execution log of the current or last test run
      operationId: downloadTestingLogs
      description: >-
        Serves the complete execution log file of the current or most recent
        test run as a `text/plain` attachment. Unlike GET /testing/logs, whose
        in-memory buffer only keeps the latest 500 entries, this file holds
        every entry of the run, one per line as
        `[YYYY-MM-DD HH:MM:SS] [LEVEL] message`, with the timestamp in the
        hub's local time. Available while a run is still active (the file then
        contains the entries produced so far). DELETE /testing/logs does not
        affect it. Requires: at least one run started since the hub was
        launched (POST /testing/execute) — 404 otherwise, or if the log file
        is missing on disk.
      responses:
        '200':
          description: Full execution log of the current or last test run
          content:
            text/plain:
              schema:
                type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No test run has started yet or its log file is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: The log file exists but could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /testing/logs/stream:
    get:
      tags:
        - Testing
      summary: Stream test execution logs over Server-Sent Events
      operationId: streamTestingLogs
      description: >-
        SSE alternative to the WebSocket upgrade offered by GET
        /testing/logs — plain `text/event-stream`, no upgrade handshake
        required, so it works through infrastructure that blocks
        WebSockets. Does not replay buffered history: only log entries
        produced after the connection opens are sent, each as an
        `event: testingLog` frame whose `data` is a JSON
        `testingExecutionLog` object. Closed automatically when a new run
        starts (see GET /testing/logs for the shared close-on-new-run
        behavior).
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                type: object
                format: event-stream
                properties:
                  event:
                    type: string
                    example: testingLog
                  data:
                    $ref: "#/components/schemas/testingExecutionLog"

        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /testing/selection:
    get:
      tags:
        - Testing
      summary: Get the selected suites and test cases
      operationId: getTestingSelection
      description: >-
        Returns the current selection set by POST to this same path.
        `testCaseIds` never duplicates a test case already covered by an
        entry in `suites` — selecting a suite absorbs any individually
        selected test case that belongs to it (see POST, below).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingSelection"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    post:
      tags:
        - Testing
      summary: Select suites and/or individual test cases to run
      operationId: configureTestingSelection
      description: >-
        Step 3 of the compliance run lifecycle: chooses which suites
        (`suites`, e.g. `lpc-cs`) and/or individual test cases
        (`testCaseIds`, e.g. `LPC_T001`) POST /testing/execute will run.
        Replaces the whole selection (not additive) and normalizes it —
        entries are de-duplicated and sorted, and any `testCaseIds` entry
        already covered by a selected suite is dropped since the suite
        selection already implies it. Selecting new suites/test cases
        changes the union of `requiredConfigFields` returned by GET
        /testing/required-config, which in turn determines which fields
        POST /testing/dut/test-config must supply. Requires: the
        compliance-tests license feature, every requested suite/test case
        allowed by it, and no test run currently active. Side effect: emits
        an SSE `testingUpdate` event.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/testingSelection"
            example:
              suites: [lpc-cs]
              testCaseIds: [LPP_T001]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          $ref: "#/components/responses/BadRequestGeneric"
        '403':
          description: Selected suite or test case is not allowed by the current license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to persist testing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - Testing
      summary: Clear the entire selection
      operationId: clearTestingSelection
      description: >-
        Empties both `suites` and `testCaseIds`. Requires: no test run
        currently active. Side effect: emits an SSE `testingUpdate` event
        only when the selection actually changed.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          $ref: "#/components/responses/BadRequestGeneric"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Failed to persist testing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"

  /testing/selection/suites/{suite}:
    delete:
      tags:
        - Testing
      summary: Deselect one suite
      operationId: deselectTestingSuite
      description: >-
        Removes a single suite from the current selection (see POST
        /testing/selection) without touching individually selected test
        cases from other suites. Requires: no test run currently active.
        404 if `suite` is not currently selected. Side effect: emits an SSE
        `testingUpdate` event.
      parameters:
        - name: suite
          in: path
          schema:
            type: string
          required: true
          example: lpc-cs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          $ref: "#/components/responses/BadRequestGeneric"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: Suite is not selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to persist testing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"

  /testing/selection/testcases/{testCaseId}:
    delete:
      tags:
        - Testing
      summary: Deselect one individual test case
      operationId: deselectTestingTestCase
      description: >-
        Removes a single test case from the current selection (see POST
        /testing/selection). If `testCaseId` is currently selected only
        indirectly — via a suite selection that covers it — that suite is
        replaced with the rest of its test cases so the target case alone
        drops out. Requires: no test run currently active. 404 if
        `testCaseId` is not currently selected (directly or via a suite).
        Side effect: emits an SSE `testingUpdate` event.
      parameters:
        - name: testCaseId
          in: path
          schema:
            type: string
          required: true
          example: LPC_T001
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          $ref: "#/components/responses/BadRequestGeneric"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: Test case is not selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to persist testing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"

  /testing/execute:
    post:
      tags:
        - Testing
      summary: Start the compliance run for the current selection
      operationId: executeTestingRun
      description: >-
        Step 4 (final) of the compliance run lifecycle. Validates that every
        `requiredConfigFields` entry for the current selection (GET
        /testing/required-config) has been explicitly set via POST
        /testing/dut/test-config — no silent defaults are applied — then
        clears the log buffer and starts the run asynchronously: the hub
        first re-probes the DUT RPC server (see GET
        /testing/rpc-server/status) and fails the run immediately if it is
        unreachable, then drives the compliance pipeline in the background.
        Poll GET /testing/run/status for progress and per-test-case
        results, GET /testing/logs or /testing/logs/stream for live output,
        and GET /testing/report once the run finishes. Side effect: while a
        run is active, every simulation-mutating endpoint under `/sim` and
        every device-add/configure endpoint returns 409 unless the caller
        presents a matching `X-EEBUS-Internal-Test-Token` header (checked
        against the `EEBUS_HUB_INTERNAL_TEST_TOKEN` environment variable) —
        this lets the compliance pipeline itself keep driving the
        simulation while ordinary API clients are locked out for the
        duration of the run. Requires: the compliance-tests license
        feature, a configured DUT (POST /testing/dut/environment), a
        non-empty selection (POST /testing/selection), the HEMS entity to
        exist, and no run already in progress.
      responses:
        '202':
          description: Test run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingExecuteAcceptedResponse"
        '400':
          description: >-
            Malformed selection/config state, HEMS unavailable, a required
            test-configuration field is missing (body additionally includes
            `missingFields`, an array of the field names still needed), or
            a run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
              example:
                err: Required test configuration is not set. Please provide the missing values before running.
                missingFields: [dutIsHEMS]
        '403':
          description: Compliance tests are not enabled by the current license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /testing/execute/cancel:
    post:
      tags:
        - Testing
      summary: Request cancellation of the active run
      operationId: cancelTestingRun
      description: >-
        Signals the running compliance pipeline to stop scheduling further
        test cases. The run does not stop instantly: the in-progress test
        case is allowed to finish, `status` moves to `cancelling`
        immediately (visible via GET /testing/run/status) and settles to
        `failed` once the pipeline actually unwinds. Requires: a run
        currently in the `running` state — 409 if idle, already
        `cancelling`, `completed`, or `failed`.
      responses:
        '202':
          description: Test run cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingExecuteCancelAcceptedResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '409':
          description: No test run is currently active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /testing/required-config:
    get:
      tags:
        - Testing
      summary: Get the DUT test-config fields the current selection needs
      operationId: getTestingRequiredConfig
      description: >-
        Returns the union, over every suite and individual test case in the
        current selection (POST /testing/selection), of the DUT
        test-configuration field names each one declares as required (see
        `requiredConfigFields` on each entry from GET /testing/testcases).
        Field names use the hub's external naming — notably `dutIsHEMS`
        rather than the compliance pipeline's internal `dutIsCEM`. POST
        /testing/dut/test-config and POST /testing/execute both re-derive
        this same set server-side to decide what must be present, so this
        endpoint is a read-only convenience for building the DUT
        test-config form.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingRequiredConfigResponse"

        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /analyzer/health:
    get:
      tags:
        - Analyzer
      summary: Get analyzer capture status and live counters
      operationId: getAnalyzerHealth
      description: >-
        Reports whether the built-in EEBUS protocol analyzer is running and
        capturing, plus the live session id and how many events its ring
        buffer currently holds. `enabled` reflects the `--analyzer` runtime
        flag (default on); `capturing` reflects the momentary
        start/stop state driven by POST /analyzer/capture/start and
        /analyzer/capture/stop; `manualCapture` reflects the mode set by
        POST /analyzer/capture/mode. `droppedTotal` counts events discarded
        because capture was off or a buffer was full — a non-zero, growing
        value indicates lost data for the live session. All fields except
        `enabled` are zero-valued if no pipeline has been initialised yet.
        Requires: this route only exists when the analyzer is mounted (see
        the note on the tag) and the `eebus-analyzer` license feature.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerHealth"
              example:
                enabled: true
                capturing: true
                manualCapture: false
                droppedTotal: 0
                sessionId: live-20260717-101500
                ringEntries: 4213
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
  /analyzer/capture/start:
    post:
      tags:
        - Analyzer
      summary: Start capturing events
      operationId: startCapture
      description: >-
        Enables event capture on the live session. Events are dropped —
        not saved to the ring buffer, SQLite, or the SSE feed at GET
        /analyzer/stream — for as long as capture is off, which includes
        the window before this endpoint is first called after startup
        (unless auto-capture is active; see POST /analyzer/capture/mode).
        No-op if already capturing. Side effect: fires the
        `capture-state` SSE event (on /analyzer/stream) so open UIs update
        without a page refresh. Requires: the analyzer subsystem to be
        running (503 if not — in practice unreachable once this route is
        mounted, since mounting itself requires it) and the
        `eebus-analyzer` license feature.
      responses:
        '200':
          description: Capture started
          content:
            application/json:
              schema:
                type: object
                properties:
                  capturing:
                    type: boolean
              example: { capturing: true }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '503':
          $ref: "#/components/responses/AnalyzerRuntimeDisabledUnavailable"
  /analyzer/capture/stop:
    post:
      tags:
        - Analyzer
      summary: Stop capturing events
      operationId: stopCapture
      description: >-
        Disables event capture on the live session. Subsequent events are
        dropped until POST /analyzer/capture/start is called again; the
        session already recorded (ring buffer and SQLite rows) is preserved
        for analysis. Side effect: fires the `capture-state` SSE event (on
        /analyzer/stream). Requires: the `eebus-analyzer` license feature.
      responses:
        '200':
          description: Capture stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  capturing:
                    type: boolean
              example: { capturing: false }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
  /analyzer/capture/mode:
    post:
      tags:
        - Analyzer
      summary: Switch between manual and automatic capture mode
      operationId: setCaptureMode
      description: >-
        Switches the analyzer's manual-capture mode and applies it
        immediately, as a side effect calling the equivalent of POST
        /analyzer/capture/start or /analyzer/capture/stop. Enabling manual
        mode (`manual: true`) stops capture so nothing is recorded — events
        are dropped — until the user starts it explicitly via POST
        /analyzer/capture/start. Disabling it (`manual: false`, the
        default) starts capture immediately so the live session records
        traffic automatically. This stored mode is independent of the
        momentary start/stop actions: switching to automatic mode always
        starts capture regardless of its previous state, and vice versa.
        Side effect: fires the `capture-state` SSE event (on
        /analyzer/stream). Requires: the analyzer subsystem to be running
        (503 if not) and the `eebus-analyzer` license feature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manual:
                  type: boolean
                  description: true to enable manual capture (idle until started), false for automatic capture.
            example: { manual: true }
      responses:
        '200':
          description: Mode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  manualCapture:
                    type: boolean
                  capturing:
                    type: boolean
              example: { manualCapture: true, capturing: false }
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyzerError"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '503':
          $ref: "#/components/responses/AnalyzerRuntimeDisabledUnavailable"
  /analyzer/sessions:
    get:
      tags:
        - Analyzer
      summary: List analyzer sessions
      operationId: listAnalyzerSessions
      description: >-
        Returns the live session first (if a pipeline is running), followed
        by every persisted session — imported files (see POST
        /analyzer/import) and past live sessions — newest first, from the
        SQLite store. The live session is never duplicated in the persisted
        list. Every `id` here can be used as the `{id}` path parameter on
        every other /analyzer/sessions/{id}/* operation. Requires: the
        `eebus-analyzer` license feature.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyzerSession"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
  /analyzer/sessions/{id}/events:
    get:
      tags:
        - Analyzer
      summary: List decoded SHIP/SPINE events for a session, with optional filters
      operationId: listAnalyzerEvents
      description: >-
        The primary event feed behind the analyzer's Live Events view. Three
        read paths, chosen automatically: (1) `q` set — full-text search via
        SQLite FTS5, works for live or persisted sessions; (2) the target
        session is not the live one, or a `after`/`before` time-range filter
        is given — read from SQLite so events aged out of the in-memory ring
        are still reachable; (3) otherwise — walk the live ring buffer for
        lowest latency, returning the most recent `limit` matches (not the
        oldest). `sinceId` supports incremental polling (only events with
        `id` greater than it); `tail=true` (SQLite path only) returns the
        newest `limit` rows instead of the oldest. `msgCounter` (combined
        with `ski`) resolves one exact SPINE request/reply by its counter —
        used to jump from a `msgCounterRef` back to the message it refers
        to. `all=true` with no other filters bypasses the row cap entirely
        via a paged SQLite scan, for a complete session export. Requires:
        the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sinceId, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 500 } }
        - { name: kind, in: query, schema: { type: string }, description: comma-separated event kinds }
        - { name: classifier, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [Send, Recv], description: "Message direction relative to this hub: Send (outgoing) or Recv (incoming)." } }
        - { name: ski, in: query, schema: { type: string } }
        - { name: sourceDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE source device address (e.g. the shortened device name portion)." }
        - { name: destDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE destination device address." }
        - { name: tail, in: query, schema: { type: boolean }, description: "When true, return the newest `limit` events (ORDER BY seq DESC then re-sorted ASC). Ignored for the live ring-buffer path." }
        - { name: msgCounter, in: query, schema: { type: integer, format: int64 }, description: "Return only the event(s) with this exact SPINE msgCounter value. Combined with ski to avoid cross-device collisions. Used by the UI to resolve a msgCounterRef back to its originating request." }
        - { name: after, in: query, schema: { type: string, format: date-time }, description: "Inclusive lower-bound timestamp filter (RFC3339). When set the full SQLite store is queried so events aged out of the ring are reachable." }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: "Inclusive upper-bound timestamp filter (RFC3339). When set the full SQLite store is queried so events aged out of the ring are reachable." }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AnalyzerEvent" }
                  count: { type: integer }
                  source: { type: string, enum: [fts, db], description: "Which read path served this response (q search vs. SQLite time-range/non-live query). Omitted entirely on the live in-memory-ring path." }
              example:
                items:
                  - id: 4821
                    sessionId: live-20260717-101500
                    ts: "2026-07-17T10:16:02.118Z"
                    kind: spine.message
                    direction: Send
                    ski: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
                    spine: { cmdClassifier: write, functionSet: loadControlLimitDescriptionListData, msgCounter: 118, sourceDevice: d:_n:HEMS_1, destDevice: d:_n:EVSE_1 }
                count: 1
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/events/count:
    get:
      tags:
        - Analyzer
      summary: Count events matching optional time-range and filters (no payloads returned)
      operationId: countAnalyzerEvents
      description: >-
        Same filter set as GET /analyzer/sessions/{id}/events (minus
        pagination/search) but returns only a row count, for building UI
        badges/summaries without paying for payload transfer. Always reads
        SQLite, so results include events aged out of the live ring.
        Requires: the `eebus-analyzer` license feature and the analyzer
        storage backend to be enabled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string, format: date-time }, description: "Inclusive lower-bound timestamp (RFC3339)." }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: "Inclusive upper-bound timestamp (RFC3339)." }
        - { name: classifier, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [Send, Recv], description: "Message direction relative to this hub: Send (outgoing) or Recv (incoming)." } }
        - { name: ski, in: query, schema: { type: string } }
        - { name: sourceDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE source device address." }
        - { name: destDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE destination device address." }
        - { name: kind, in: query, schema: { type: string }, description: comma-separated event kinds }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, format: int64 }
              example: { count: 512 }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/sessions/{id}/event/{eventId}:
    get:
      tags: [Analyzer]
      summary: Fetch a single decoded event by id
      description: >-
        Reads from the live ring first, then falls back to the persisted
        analyzer store, so linked events remain available for historical
        sessions and for live events that have aged out of the ring buffer.
        Used to resolve cross-references such as a correlation pair's
        request/reply ids (GET /analyzer/sessions/{id}/correlation) or a
        bookmark's `messageId`. Requires: the `eebus-analyzer` license
        feature.
      operationId: getAnalyzerEvent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzerEvent" }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          description: Unknown session or event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyzerError"
  /analyzer/sessions/{id}/timeline:
    get:
      tags: [Analyzer]
      summary: Get a hierarchical device/feature timeline projection
      operationId: getAnalyzerTimeline
      description: >-
        Projects the session's events onto per-device/per-feature tracks for
        the Timeline view. Results are cached per session and invalidated
        automatically as new events arrive (watermark-based). Requires: the
        `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          required: false
          description: Maximum number of timeline items kept per track. Tracks over the limit are compacted into time buckets across the full session so older windows still show activity. Default 5000. Use 0 for no cap.
          schema: { type: integer, minimum: 0, default: 5000 }
      responses:
        '200':
          description: Successful response
          content: { application/json: { schema: { type: object } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/usecases:
    get:
      tags: [Analyzer]
      summary: Get detected SPINE use cases per device
      operationId: getAnalyzerUseCases
      description: >-
        Derives, per device, which SPINE use cases were observed and how far
        each progressed through its lifecycle steps (see
        `AnalyzerLifecycleStep`). Requires: the `eebus-analyzer` license
        feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyzerUseCaseLifecycle"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/subscriptions:
    get:
      tags: [Analyzer]
      summary: Get SPINE subscription lifecycle entries
      operationId: getAnalyzerSubscriptions
      description: >-
        Reconstructs SPINE subscription request/response/deletion events
        into one entry per subscription, for auditing which
        feature-to-feature subscriptions were established during the
        session. Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/bindings:
    get:
      tags: [Analyzer]
      summary: Get SPINE binding lifecycle entries
      operationId: getAnalyzerBindings
      description: >-
        Reconstructs SPINE binding request/response/deletion events into one
        entry per binding, mirroring GET
        /analyzer/sessions/{id}/subscriptions for bindings instead of
        subscriptions. Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/metrics:
    get:
      tags: [Analyzer]
      summary: Get heartbeat jitter metrics per device pair
      operationId: getAnalyzerMetrics
      description: >-
        Computes SPINE heartbeat interval jitter for every observed
        device-pair heartbeat stream in the session — a diagnostic for
        detecting an unstable or overloaded EEBUS peer. For a downloadable
        form of the same computation, see GET
        /analyzer/sessions/{id}/metrics/export. Requires: the
        `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  heartbeatJitter:
                    type: array
                    items: { type: object }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/metrics/export:
    get:
      tags: [Analyzer]
      summary: Download heartbeat jitter metrics as CSV
      operationId: exportAnalyzerMetrics
      description: >-
        CSV rendering of the same heartbeat-jitter computation as GET
        /analyzer/sessions/{id}/metrics, for spreadsheet analysis. Serves
        the cached computation when available rather than recomputing.
        Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content: { text/csv: { schema: { type: string } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/correlation:
    get:
      tags: [Analyzer]
      summary: Get request/response correlation pairs with latency
      operationId: getAnalyzerCorrelation
      description: >-
        Pairs each SPINE request (read/write/call) with its matching
        reply/result by `msgCounter`/`msgCounterRef` and reports the latency
        between them. Requests with no matching reply are excluded here —
        see GET /analyzer/sessions/{id}/orphaned-requests for those.
        Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/orphaned-requests:
    get:
      tags: [Analyzer]
      summary: Get requests that never received a matching reply
      operationId: getAnalyzerOrphans
      description: >-
        The complement of GET /analyzer/sessions/{id}/correlation: SPINE
        requests whose `msgCounter` was never referenced by a later reply
        within the session — useful for spotting a DUT that silently drops
        commands. Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/connections:
    get:
      tags: [Analyzer]
      summary: Get the SHIP connection pairs observed in this session
      description: |
        Returns one entry per unique SHIP connection (identified by the canonical
        sorted pair of SKIs). Two local entities that are connected to each other
        (e.g. an EVSE and a HEMS running in the same hub) are deduplicated into a
        single row. Imported log sessions without lifecycle callbacks are also
        deduplicated by their SPINE device-address pair, so mirrored A→B and B→A
        frames appear as one connection. `isActive` is set when SPINE data frames
        have been observed on the connection; `state` reflects lifecycle
        transitions when present, and historical/imported sessions with no
        lifecycle state are reported as disconnected.

        Requires: the `eebus-analyzer` license feature.
      operationId: getAnalyzerConnections
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ski:                { type: string, description: "Remote peer SHIP SKI" }
                    deviceAddress:      { type: string, description: "Remote SPINE device address (e.g. d:_n:HEMS_1)" }
                    localSki:           { type: string, description: "Local entity SHIP SKI" }
                    localDeviceAddress: { type: string, description: "Local SPINE device address (e.g. d:_n:EVSE_1)" }
                    state:              { type: string, enum: [connected, disconnected], description: "Last lifecycle transition" }
                    isActive:           { type: boolean, description: "True when SPINE data frames have been observed" }
                    startedAt:          { type: string, format: date-time }
                    updatedAt:          { type: string, format: date-time }
                    eventCount:         { type: integer }
                    lastMsgType:        { type: string, description: "SHIP frame msgType of the last frame seen" }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/violations:
    get:
      tags: [Analyzer]
      summary: Get rule-engine violations observed in this session
      operationId: getAnalyzerViolations
      description: >-
        Runs the analyzer's built-in rule engine's findings for the session:
        each violation cites the rule that flagged it (`ruleId`/`ruleTitle`)
        and the offending event. For a live session, findings are served
        from the in-memory violation ring; for a persisted/imported session,
        from SQLite — and if an older import predates the rules engine being
        wired into the import path, violations are computed on this first
        request and persisted so subsequent calls are fast. Requires: the
        `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:          { type: integer }
                    ruleId:      { type: string }
                    ruleTitle:   { type: string, description: "Human-readable rule name" }
                    severity:    { type: string, enum: [info, warn, error], description: "Rule severity, from lowest to highest impact." }
                    sessionId:   { type: string }
                    eventId:     { type: integer }
                    ski:         { type: string }
                    message:     { type: string }
                    occurredAt:  { type: string, format: date-time }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/sessions/{id}/lifecycle:
    get:
      tags: [Analyzer]
      summary: Get the per-device, per-use-case lifecycle checklist
      operationId: getAnalyzerLifecycle
      description: >-
        Checklist view of use-case-lifecycle progress across all devices in
        the session — a coarser, table-oriented counterpart to GET
        /analyzer/sessions/{id}/usecases (`AnalyzerLifecycleStep` per row).
        Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/writetracking:
    get:
      tags: [Analyzer]
      summary: Get LoadControl/Setpoint write history and effective state
      operationId: getAnalyzerWriteTracking
      description: >-
        Tracks every LoadControl-limit and Setpoint write observed on the
        control plane and folds them into each target's current effective
        state — useful for confirming a HEMS write actually took effect on
        the DUT. Built from an accumulator cache so writes that have aged
        out of the live ring are still reflected. Requires: the
        `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: object } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/descriptions:
    get:
      tags: [Analyzer]
      summary: Get Measurement / Limit / KeyValue description maps (SKI-scoped)
      operationId: getAnalyzerDescriptions
      description: |
        Scans all descriptor list-data messages in the session and returns
        label maps for measurements, load-control limits, and DeviceConfiguration
        keys. All entries carry a `ski` field so ids from different remote devices
        are kept distinct. Phase information (`acMeasuredPhases`) is derived from
        ElectricalConnectionParameterDescriptionListData and merged onto the
        corresponding measurement description. LimitDesc includes `measurementId`
        to allow the client to chain limitId → measurement → phase/unit.
        This endpoint is polled by the Live Events UI every 3 s. Always
        returns 200 (an empty map set for an unknown or empty session) — the
        incremental cache is keyed by session id and only processes events
        newer than its last call. Requires: the `eebus-analyzer` license
        feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  measurements:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:             { type: string }
                        measurementId:   { type: integer }
                        scopeType:       { type: string }
                        unit:            { type: string }
                        measurementType: { type: string }
                        phase:           { type: string, description: "acMeasuredPhases from ElectricalConnectionParameterDescriptionListData (e.g. a, b, c, abc)" }
                  limits:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:           { type: string }
                        itemId:        { type: integer }
                        functionSet:   { type: string }
                        measurementId: { type: integer, description: "References MeasurementDescription.measurementId for phase/type enrichment" }
                        scopeType:     { type: string }
                        unit:          { type: string }
                        direction:     { type: string }
                        category:      { type: string }
                  keyValues:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:       { type: string }
                        keyId:     { type: integer }
                        keyName:   { type: string }
                        valueType: { type: string }
                        unit:      { type: string }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
  /analyzer/sessions/{id}/depgraph:
    get:
      tags: [Analyzer]
      summary: Get the device → entity → feature dependency tree
      operationId: getAnalyzerDepgraph
      description: >-
        Reconstructs the SPINE device/entity/feature hierarchy observed in
        the session as a tree, for visualizing what a remote device actually
        exposed. Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: object } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/export:
    get:
      tags: [Analyzer]
      summary: Download the session as an eebus.log SHIP trace file
      operationId: exportAnalyzerSession
      description: >-
        Re-serializes the session's `ship.frame` events (skipping
        lifecycle, SPINE-derived, and other synthetic event kinds that have
        no raw-wire representation) into the tab-delimited `eebus.log`
        format also produced by the hub's own SHIP logger — the same
        format GET /analyzer/import and POST /analyzer/import/append accept
        for `.log` uploads, so an exported file round-trips back in.
        Always reads from SQLite (not the live ring) so the export is
        complete even for a long-running live session. Requires: the
        `eebus-analyzer` license feature and the analyzer storage backend
        to be enabled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: >-
            eebus.log-format trace, one line per SHIP frame:
            `<local-timestamp>\t[Send|Recv] <ski><decoded-json>`.
            `Content-Disposition: attachment` with the session's original
            import filename (or its id) and a `.log` extension.
          content: { text/plain: { schema: { type: string } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/sessions/{id}/bookmarks:
    get:
      tags: [Analyzer]
      summary: List bookmarks on a session
      operationId: listAnalyzerBookmarks
      description: >-
        Returns every bookmark saved against `id` via POST to this same
        path. Returns an empty array (200), not an error, when the analyzer
        storage backend is disabled. Requires: the `eebus-analyzer` license
        feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
    post:
      tags: [Analyzer]
      summary: Create a bookmark on a session event
      operationId: createAnalyzerBookmark
      description: >-
        Pins a labeled marker to a specific event (`messageId`, the
        event's `id` from GET /analyzer/sessions/{id}/events) so it can be
        found again later, e.g. from a shared filter preset or a review
        note. Requires: the `eebus-analyzer` license feature and the
        analyzer storage backend to be enabled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId: { type: integer, format: int64 }
                label:     { type: string }
                color:     { type: string }
            example:
              messageId: 4821
              label: "unexpected write rejection"
              color: "#e0554f"
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyzerError"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/bookmarks/{bookmarkId}:
    delete:
      tags: [Analyzer]
      summary: Delete a bookmark
      operationId: deleteAnalyzerBookmark
      description: >-
        Requires: the `eebus-analyzer` license feature and the analyzer
        storage backend to be enabled.
      parameters:
        - { name: bookmarkId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '400':
          description: bookmarkId is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyzerError"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404': { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/analyzerError" } } } }
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/presets:
    get:
      tags: [Analyzer]
      summary: List saved filter presets
      operationId: listAnalyzerPresets
      description: >-
        Returns every saved filter preset (see POST, below), global across
        sessions. Returns an empty array (200), not an error, when the
        analyzer storage backend is disabled. Requires: the
        `eebus-analyzer` license feature.
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
    post:
      tags: [Analyzer]
      summary: Save or overwrite a filter preset by name
      operationId: saveAnalyzerPreset
      description: >-
        Persists an arbitrary client-defined filter (`filterJson`, e.g. the
        query/kind/classifier/direction combination used on GET
        /analyzer/sessions/{id}/events) under a name, so the UI can offer a
        one-click "load this filter" list. Upserts: saving an existing
        `name` again replaces its `filterJson`. Requires: the
        `eebus-analyzer` license feature and the analyzer storage backend
        to be enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string }
                filterJson: { type: object }
            example:
              name: "write rejections"
              filterJson: { kind: "spine.message", classifier: "result" }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
        '400':
          description: Missing request body, or `name` not provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyzerError"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/presets/{presetId}:
    delete:
      tags: [Analyzer]
      summary: Delete a filter preset
      operationId: deleteAnalyzerPreset
      description: >-
        Requires: the `eebus-analyzer` license feature and the analyzer
        storage backend to be enabled.
      parameters:
        - { name: presetId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '400':
          description: presetId is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyzerError"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404': { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/analyzerError" } } } }
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/mdns:
    get:
      tags: [Analyzer]
      summary: List mDNS-discovered EEBUS services
      operationId: listAnalyzerMdns
      description: >-
        Analyzer-scoped mirror of GET /testing/discoveredDUTs — same
        underlying mDNS scanner, same simulated-entity suppression default.
        `includeSimulated=true` includes the hub's own simulated actors in
        the results. Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: includeSimulated, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
  /analyzer/sessions/{id}/timeseries:
    get:
      tags: [Analyzer]
      summary: Extract a chartable timeseries for one built-in type
      operationId: getAnalyzerTimeseries
      description: >-
        Turns raw measurement/load-control/setpoint events into one or more
        labeled `series`, each a list of `dataPoints` ready to plot — the
        data source behind the analyzer's Charts view. `id` on each series
        identifies the underlying measurement/limit; `unit` and `label` are
        enriched from GET /analyzer/sessions/{id}/descriptions where
        available. Built from the persisted-plus-live accumulator, so
        charts cover the whole session, not just the current live ring
        window. Requires: the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: type
          in: query
          description: Which built-in extraction to run. Defaults to `measurement` when omitted.
          schema: { type: string, enum: [measurement, loadcontrol, setpoint], default: measurement, description: "Event category to extract: raw measurement readings, load-control-limit writes, or setpoint writes." }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: string }
                        label: { type: string }
                        unit:  { type: string }
                        dataPoints:
                          type: array
                          items:
                            type: object
                            properties:
                              ts:       { type: string, format: date-time }
                              value:    { type: number }
                              eventId:  { type: integer, format: int64 }
                              isActive: { type: boolean }
              example:
                type: measurement
                series:
                  - id: "6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936:1"
                    label: "Power (a)"
                    unit: W
                    dataPoints:
                      - { ts: "2026-07-17T10:16:02.118Z", value: 3450, eventId: 4821, isActive: true }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/sessions/{id}/timeseries/discover:
    get:
      tags: [Analyzer]
      summary: List which timeseries types have data in this session
      operationId: discoverAnalyzerTimeseries
      description: >-
        Scans the session and reports which of the `type` values accepted
        by GET /analyzer/sessions/{id}/timeseries (`measurement`,
        `loadcontrol`, `setpoint`) actually have data, so the Charts view
        can hide empty tabs instead of rendering a blank chart. Requires:
        the `eebus-analyzer` license feature.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '404':
          $ref: "#/components/responses/AnalyzerSessionNotFound"
  /analyzer/import:
    post:
      tags: [Analyzer]
      summary: Import a full .eet/.jsonl/.log file as a new session
      operationId: importAnalyzerSession
      description: >-
        Single blocking upload: reads the whole file into a new imported
        session before responding, so it is only suitable for files small
        enough to fit comfortably in one HTTP request. For large or
        streamed files, use POST /analyzer/import/init followed by one or
        more POST /analyzer/import/append calls instead. `.eet`/`.jsonl`
        files are parsed as line-delimited JSON analyzer events (with the
        rules engine run over them and violations persisted); `.log` files
        are parsed as `eebus.log` SHIP traces (the format GET
        /analyzer/sessions/{id}/export produces) and do **not** run the
        rules engine on import. `schemaVersion` is only present in the
        response for `.eet`/`.jsonl` imports. Requires: the
        `eebus-analyzer` license feature and the analyzer storage backend
        to be enabled.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .eet, .jsonl, or .log file to import
      responses:
        '201':
          description: Import complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:     { type: string }
                  eventCount:    { type: integer }
                  schemaVersion: { type: string, description: "Present only for .eet/.jsonl imports." }
              example:
                sessionId: imported-20260717-101500-01
                eventCount: 8213
                schemaVersion: analyzer/v1
        '400':
          description: Parse error, or no `file` field in the multipart body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyzerError"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/import/init:
    post:
      tags: [Analyzer]
      summary: Start a chunked import and get its session ID
      operationId: initAnalyzerImport
      description: >-
        Creates an empty imported session and returns its `sessionId`
        immediately, before any content is uploaded, so the UI can open a
        session tab right away and stream content into it via one or more
        POST /analyzer/import/append calls. Requires: the `eebus-analyzer`
        license feature and the analyzer storage backend to be enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename:
                  type: string
                  description: Source filename shown in the sessions dropdown
            example: { filename: field-capture-2026-07-17.log }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
              example: { sessionId: imported-20260717-101500-02 }
        '400':
          description: Missing or invalid body (`filename` is required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyzerError"
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"
        '503':
          $ref: "#/components/responses/AnalyzerStorageUnavailable"
  /analyzer/import/append:
    post:
      tags:
      - Analyzer
      summary: Append one chunk to an in-progress chunked import
      operationId: appendAnalyzerImportChunk
      description: 'Parses `chunk` as a sequence of log lines (`format: log`, the default) or JSONL events
        (`format: jsonl`) and appends the results to the session created by POST /analyzer/import/init.
        Chunks MUST be sent serially — each call awaited before the next is sent — so sequence numbering
        and the session''s time-origin anchor (`sessionStart`, derived from the first chunk''s first timestamp)
        remain consistent. The rules engine runs over each appended batch and any violations are persisted
        immediately, for both formats (unlike the single-shot POST /analyzer/import, whose `.log` path skips
        this). Returns the parsed events from just this chunk so the caller can update its view incrementally
        without a follow-up GET /analyzer/sessions/{id}/events call. Requires: the `eebus-analyzer` license
        feature and the analyzer storage backend to be enabled.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sessionId
              - chunk
              properties:
                sessionId:
                  type: string
                  description: Session ID returned by /analyzer/import/init
                chunk:
                  type: string
                  description: Raw text chunk (up to ~1000 lines)
                format:
                  type: string
                  enum:
                  - log
                  - jsonl
                  default: log
                  description: 'Chunk encoding: log (eebus.log SHIP trace lines) or jsonl (line-delimited
                    analyzer events).'
            example:
              sessionId: imported-20260717-101500-02
              chunk: "2026-07-17 10:16:02.118\t[Send] 6ea57f6e...{...}\n"
              format: log
      responses:
        '200':
          description: Chunk processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  appended:
                    type: integer
                    description: Events parsed from this chunk
                  total:
                    type: integer
                    description: Total events in the session so far
                  items:
                    type: array
                    description: Parsed events from this chunk. A nil Go slice marshals to null, so a chunk
                      that parsed no events sends null rather than []
                    items:
                      $ref: '#/components/schemas/AnalyzerEvent'
                    nullable: true
              example:
                appended: 42
                total: 8255
                items: []
        '400':
          description: Parse error, or missing `sessionId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analyzerError'
        '403':
          $ref: '#/components/responses/AnalyzerFeatureForbidden'
        '404':
          description: sessionId does not match a session created by /analyzer/import/init
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analyzerError'
        '503':
          $ref: '#/components/responses/AnalyzerStorageUnavailable'
  /analyzer/stream:
    get:
      tags: [Analyzer]
      summary: Server-Sent Events feed of new analyzer events
      operationId: getAnalyzerStream
      description: >-
        Live feed of everything the analyzer captures, pushed as SSE
        (`text/event-stream`), for consumers that want to react to traffic
        as it happens rather than polling GET
        /analyzer/sessions/{id}/events. On its own hub-side broadcaster
        (separate from the hub-wide GET /events stream), it emits three
        named events: `event` (a JSON-encoded `AnalyzerEvent`, the payload
        that would also show up in GET /analyzer/sessions/{id}/events),
        `capture-state` (fired by POST /analyzer/capture/start,
        /analyzer/capture/stop, and /analyzer/capture/mode, JSON
        `{capturing, manualCapture}`), and `session-rolled` (fired when the
        live session is rolled to a new one, JSON `{sessionId}`). No
        events are delivered while capture is stopped (see POST
        /analyzer/capture/start). Requires: the `eebus-analyzer` license
        feature.
      responses:
        '200':
          description: Successful response
          content: { text/event-stream: { schema: { type: string } } }
        '403':
          $ref: "#/components/responses/AnalyzerFeatureForbidden"

  /powerLimitation/view:
    get:
      tags:
      - Power Limitation
      summary: Get the combined LPC/LPP view of every known device
      description: 'Returns one entry per device that participates in LPC (Limitation of Power Consumption)
        and/or LPP (Limitation of Power Production), covering both the devices the hub simulates and the
        external (real) devices it observes as Energy Guard. A device that runs both use cases appears once
        with both sections filled.


        The controllable-system state (Init, Limited, Failsafe, ...) is only present for simulated devices:
        it is a hub-internal state machine that is not propagated over the EEBUS protocol and therefore
        cannot be known for an external device.


        Changes to any of this data are announced on the event stream as the `LpcLppViewUpdate` event.'
      operationId: getPowerLimitationView
      responses:
        '200':
          description: Combined LPC/LPP view of simulated and external devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LpcLppViewSnapshot'
        '500':
          description: the simulation engine is not available
        '403':
          description: The license has expired or does not cover this feature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /hems/mps/PvStringData:
    get:
      tags:
      - HEMS
      summary: get the MPS (Monitoring of PV String) data from all connected PV String entities
      description: 'Returns the latest MPS data aggregated per connected PV String entity, keyed by the
        remote entity''s device address.

        '
      operationId: getMpsPvStringData
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                      description: The PV String entity device address
                    pvStringData:
                      $ref: '#/components/schemas/PVStringData'
        '404':
          description: no HEMS found or MPS returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          description: The license has expired or does not cover this feature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /eebus_ws:
    get:
      tags:
      - Streaming
      summary: Stream SHIP/EEBUS frame logs over WebSocket
      operationId: streamEEBUSLogsWebSocket
      description: 'Root-level WebSocket endpoint carrying the SHIP/EEBUS frame log as text frames. Registered
        on the bare engine by RestHandler.InitWebsockets, so it is NOT under the /api/v1 prefix and NOT
        behind the license middleware — hence the servers override below and the absence of a 403. Disabled
        by the --nowebsockets CLI flag. Requires: nothing; the stream is open as soon as the hub is running.'
      servers:
      - url: /
      responses:
        '101':
          description: Switching Protocols; the connection upgrades to a WebSocket carrying text frames.
  /events_ws:
    get:
      tags:
      - Streaming
      summary: Stream event-log messages over WebSocket
      operationId: streamEventLogsWebSocket
      description: 'Root-level WebSocket endpoint carrying the event log as text frames. Registered on the
        bare engine by RestHandler.InitWebsockets, so it is NOT under the /api/v1 prefix and NOT behind
        the license middleware — hence the servers override below and the absence of a 403. Disabled by
        the --nowebsockets CLI flag. Requires: nothing; the stream is open as soon as the hub is running.'
      servers:
      - url: /
      responses:
        '101':
          description: Switching Protocols; the connection upgrades to a WebSocket carrying text frames.
components:
