    HemsEntityOrCobDeviceNotFound:
      description: HEMS entity not found, or no COB device paired at deviceAddress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/statusError'
    EvseNotFound:
      description: EVSE not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/statusError'
    AnalyzerFeatureForbidden:
      description: >-
        The `eebus-analyzer` feature is not included in the current license.
        The `withAnalyzerLicense` wrapper checks this before every mounted
        /analyzer/* handler runs, so every operation in this tag can return it.
        Distinct from the hub-wide 403 shape: the body key is `error`, not `err`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/analyzerError'
    AnalyzerSessionNotFound:
      description: >-
        Unknown session id — it does not match the live session and was not
        found in the persisted analyzer store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/analyzerError'
    AnalyzerStorageUnavailable:
      description: >-
        The analyzer's SQLite-backed store is unavailable (no repository was
        initialised). Bookmarks, presets, import, and export all require it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/analyzerError'
    AnalyzerRuntimeDisabledUnavailable:
      description: >-
        The analyzer subsystem itself is not running (started with
        `--analyzer=false` / `EEBUS_ANALYZER=false`). In practice unreachable
        once /analyzer/* routes are mounted, since mounting requires the
        analyzer to already be enabled — the check is defensive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/analyzerError'
  parameters:
    EvseIdParam:
      name: evseId
      in: path
