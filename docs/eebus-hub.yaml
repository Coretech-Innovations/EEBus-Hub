          $ref: "#/components/responses/LicenseExpiredForbidden"
  /heatpump/{heatPumpId}/ohpcfData:
    get:
      tags:
        - Heat Pump
      summary: Get one heat pump's OHPCF monitor data
      operationId: getHeatPumpOhpcfData
      description: >-
        Requires: none beyond a valid license (default license-gated route). Unlike
        `GET /heatpump/OhpcfMonitorData`, this always returns data — even a heat
        pump that has never announced a process reports `state: "inactive"` rather
        than being omitted or erroring, because `GetOhpcfMonitorData` never returns
        nil. The 404 "OHPCF not enabled" case documented informally elsewhere for
        this handler is unreachable in the current implementation for that reason —
        the only 404 this endpoint actually produces is an unknown `heatPumpId`.
      parameters:
        - $ref: "#/components/parameters/HeatPumpIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  data:
                    $ref: "#/components/schemas/OhpcfMonitorData"
        '400':
          $ref: "#/components/responses/InvalidHeatPumpIdBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No entity exists with this heatPumpId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /heatpump/{heatPumpId}/announceOptional:
    post:
      tags:
        - Heat Pump
      summary: Announce an optional OHPCF power-consumption process (OHPCF Scenario 1, Phase A)
      operationId: announceHeatPumpOptional
      description: >-
        Publishes a `SmartEnergyManagementPsData` announcement over SPINE
        (`AnnounceOptionalProcess` → `applyAnnouncementLocked`) — this is what makes
        the heat pump visible in `GET /hems/OhpcfMonitorData` and
        `GET /heatpump/OhpcfMonitorData` (both filter to heat pumps that have
        announced) and populates the `Alternatives` array a connected HEMS reads.
        The new process always starts in state `inactive`, and any previous
        schedule/start time is cleared as a side effect.


        Validation (`validateAnnouncementParams`, EEBUS rule references in
        brackets): rejected with 400 if another process is already
        scheduled/running/paused [OHPCF-013] — complete or force-abort it first
        (see `POST /heatpump/{heatPumpId}/setState` /
        `POST /heatpump/{heatPumpId}/forceOhpcfState`); at least one of
        `isPausable`/`isStoppable` must be true; `activeDurationMinSeconds` and
        `pauseDurationMinSeconds` are both required (non-negative numbers); at
        least one of `power`/`powerMax` is required; the heat pump must have
        `nominalPower` configured (see `HeatPumpInfo`); any supplied `power`/`powerMax`
        must be > 0 and within `[nominalPower.min, nominalPower.max]`, and `power`
        (if both are set) must not exceed `powerMax`.
      parameters:
        - $ref: "#/components/parameters/HeatPumpIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OhpcfAnnouncementParams"
            example:
              powerMax: 2500
              activeDurationMinSeconds: 300
              pauseDurationMinSeconds: 60
              isPausable: true
              isStoppable: true
      responses:
        '200':
          description: Optional process announced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Optional process announced successfully
                  hpId:
                    type: integer
                    example: 1
                  ohpcfData:
                    $ref: "#/components/schemas/OhpcfMonitorData"
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: >-
            Invalid heatPumpId resolving to a non-heat-pump entity, the OHPCF
            handler is not initialized (OHPCF not enabled for this heat pump),
            malformed request body, or a validation rule above failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    example: Failed to announce optional process
                  message:
                    type: string
                    example: "[OHPCF-013] cannot announce new process while another is in progress (current state: running). Must complete or abort current process first"
                  hpId:
                    type: integer
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No entity exists with this heatPumpId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /heatpump/{heatPumpId}/setState:
    post:
      tags:
        - Heat Pump
      summary: Transition the heat pump's OHPCF power-sequence state
      operationId: setHeatPumpOhpcfState
      description: >-
        Applies a validated OHPCF state transition via the same local path a
        connected HEMS's SPINE write would use (`myOhpcfHandler.SetPowerSequenceState`),
        without going through SPINE — this is a REST-side equivalent of the write,
        not a proxy for a remote write. The allowed transitions
        (`ohpcfAllowedTransitions`) are:

          - `scheduled` → `invalid` (only)
          - `running` → `completed` or `invalid`
          - `paused` → `invalid` (only)
          - `inactive` and `completed`/`invalid` have **no** outgoing transitions at
            all — there is deliberately no entry for `inactive` as a start state, so
            a freshly-announced (or never-announced) process cannot be moved to
            `scheduled`/`running` through this endpoint. Use
            `POST /heatpump/{heatPumpId}/forceOhpcfState` (testing mode only) to
            force a state directly instead.

        Any transition not in this table — including everything out of `inactive`
        — is rejected with 400. This table is deliberately narrower than what a
        remote CEM's SPINE write is allowed to request (the write-approval callback
        additionally permits `running`→`paused` and `paused`→`running`, gated on
        `isPausable`/`isStoppable` and minimum active/pause durations); those
        richer transitions are not reachable through this REST endpoint.
      parameters:
        - $ref: "#/components/parameters/HeatPumpIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetState:
                  type: string
                  description: Target OHPCF state.
                  enum: [inactive, scheduled, running, paused, completed, invalid]
                  example: invalid
              required:
                - targetState
      responses:
        '200':
          description: State transition successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: State transition successful
                  hpId:
                    type: integer
                    example: 1
                  targetState:
                    type: string
                    example: invalid
                  currentState:
                    type: string
                    description: Echoes the OHPCF monitor data's `state` field after the transition (equal to targetState on success).
                    example: invalid
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: >-
            Invalid heatPumpId resolving to a non-heat-pump entity, the OHPCF
            handler is not initialized (OHPCF not enabled for this heat pump),
            malformed request body, or the transition is not in the allowed table
            above.
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    example: State transition not allowed
                  message:
                    type: string
                    example: transition from inactive to running is not allowed per EEBUS OHPCF spec
                  hpId:
                    type: integer
                  targetState:
                    type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No entity exists with this heatPumpId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /internalmeter:
    get:
      tags:
        - Internal Meter
      summary: Get InternalMeter status (config + running state + mode)
      operationId: getInternalMeter
      description: >-
        Returns the singleton Modbus-meter's pure configuration (`info`) plus derived
        state: `running` (is the Modbus TCP server currently accepting connections)
        and `mode` (`live` — readings are derived from the simulation's EnergyMeter
        each tick, or `forced` — readings are pinned via `PUT /internalmeter/readings`).
        This is a distinct device from the `Energy Meter` tag's `GET /energymeter`:
        this one is a Modbus TCP server (SDM630/SMA Home Manager register layout) an
        external HEMS can poll as if it were a real meter; `GET /energymeter` is the
        simulation's own internal grid measurement, consumed only over this REST API.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalMeterStatus"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InternalMeterNotInitialised"
    patch:
      tags:
        - Internal Meter
      summary: Update InternalMeter configuration
      description: |
        Updates meter configuration. Transport-level fields (modbusHost, modbusPort, unitId)
        are rejected while a simulation is running. If transport fields change and the server
        is running it is restarted automatically on the new address. Omitted fields in the
        request body are pre-filled from the current configuration before validation, so a
        partial body (e.g. just `serialNumber`) does not fail validation on the fields it
        left out — this is a PATCH in effect even though the request re-sends the full
        `InternalMeterInfo` shape.
      operationId: patchInternalMeter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalMeterInfo"
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalMeterStatus"
        '400':
          description: Validation error (see InternalMeterInfo field bounds) or transport change while simulation running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InternalMeterNotInitialised"
  /internalmeter/start:
    post:
      tags:
        - Internal Meter
      summary: Start the InternalMeter Modbus TCP server
      operationId: startInternalMeter
      description: >-
        Starts listening on `modbusHost:modbusPort` (unit `unitId`). No-op (still
        200) if already running. Requires the `modbusMeter` license feature — 403
        even before the generic license check would otherwise apply, because this
        route also has an explicit feature-license guard in the handler
        (`HubLicense.IsModbusMeterSupported()`), independent of the entity/use-case
        gating every other route in this specification relies on.
      responses:
        '200':
          description: Server started (or was already running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '403':
          description: >-
            License expired, or the `modbusMeter` feature is not granted by the
            current license (see `GET /license` → `features` → `modbusMeter`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/InternalMeterNotInitialised"
        '500':
          description: The Modbus TCP listener failed to bind/start (e.g. port already in use).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /internalmeter/stop:
    post:
      tags:
        - Internal Meter
      summary: Stop the InternalMeter Modbus TCP server
      operationId: stopInternalMeter
      description: Stops the Modbus TCP listener. No-op (still 200) if already stopped.
      responses:
        '200':
          description: Server stopped (or was already stopped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InternalMeterNotInitialised"
        '500':
          description: Failed to stop Modbus server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /internalmeter/readings:
    get:
      tags:
        - Internal Meter
      summary: Get current meter readings snapshot (what a Modbus client would read)
      operationId: getInternalMeterReadings
      description: >-
        Returns the same snapshot the Modbus TCP server would serve to a connected
        client over the wire, decoded to JSON — useful for inspecting/asserting on
        readings without a Modbus client. Reflects whichever mode is currently
        active (`live` or `forced`, see `GET /internalmeter`).
      responses:
        '200':
          description: Current readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalMeterReadings"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InternalMeterNotInitialised"
    put:
      tags:
        - Internal Meter
      summary: Force meter readings (switches meter to forced mode)
      description: |
        Pins all meter values to the supplied body. The meter enters "forced" mode;
        energy counters continue advancing each engine tick using the supplied power value.
        Pass only the fields you want to pin — omitted numeric fields default to 0.
        Every energy accumulator (total and per-phase import/export) is re-seeded from
        the supplied snapshot on this call, so switching modes never produces a
        discontinuity in the energy counters.
      operationId: putInternalMeterReadings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalMeterReadings"
      responses:
        '200':
          description: Forced readings applied — the readings snapshot now being served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalMeterReadings"
        '400':
          $ref: "#/components/responses/InvalidRequestBodyBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InternalMeterNotInitialised"
    delete:
      tags:
        - Internal Meter
      summary: Clear forced readings and return to live mode
      description: |
        Clears any forced override. Voltage/frequency/PF immediately return to
        nominal-idle values; power and current return to 0 until the next engine
        tick. Accumulated energy is preserved — counters never go backwards.
      operationId: deleteInternalMeterReadings
      responses:
        '200':
          description: Forced mode cleared; meter is now in live mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: cleared
                  mode:
                    type: string
                    description: Always "live" — this is the only mode this response can report (the meter just left forced mode).
                    enum: [live]
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InternalMeterNotInitialised"
  /energymeter:
    get:
      tags:
        - Energy Meter
      summary: Get the simulated grid-connection meter's live per-phase readings
      operationId: getEnergyMeterReadings
      description: >-
        Returns the singleton `EnergyMeter`'s current grid measurement — the point
        the simulation treats as the physical grid connection (household fuse), fed
        by summing every simulated/connected device's power draw/feed-in each engine
        tick (`internal.GridBUS`). This is a different meter from the `Internal
        Meter` tag's Modbus meter (`GET /internalmeter/readings`): this one reflects
        the simulation's own bookkeeping, the Modbus meter is a protocol-level replica
        of it exposed to an external HEMS. `fuseLimit` (used to abort the simulation
        via `POST /sim` when any phase's uncontrollable-device current exceeds it —
        see `internal.Engine.validateTotalCurrents`) is internal engine state and is
        not part of this response.


        Requires: none beyond a valid license (default license-gated route).
      responses:
        '200':
          description: >-
            Current per-phase grid measurement and cumulative consumption. Before the
            simulation has ticked at least once, values reflect the meter's zero-value
            defaults (0 for everything except unity power factor).
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/EnergyMeterReadings"
              example:
                totalConsumption: 12.4
                measurement:
                  voltage: { a: 230.1, b: 229.8, c: 230.4 }
                  current: { a: 4.2, b: 3.9, c: 4.5 }
                  power: 2760.5
                  frequency: { a: 50.0, b: 50.0, c: 50.0 }
                  powerFactor: { a: 0.98, b: 0.97, c: 0.99 }
        '404':
          description: The EnergyMeter singleton has not been initialised yet.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /events:
    get:
      summary: Subscribe to the hub-wide Server-Sent Events feed
      tags:
        - Streaming
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                type: object
                format: event-stream
                properties:
                  event:
                    type: string
                  data:
                    type: object
      operationId: events
      description: |-
        Server-sent events (SSE) are published at this stream to all clients — the response is `text/event-stream`, an open connection the server writes to, not a single JSON body. Streams cannot be described correctly in the OpenAPI specification format. Therefore this description should be read like this:
        - 'array' represents a stream and not a real array.
        - The message format of Server-sent events is standardized, see https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#fields
        - Every event type is identified by the property "event" which is mapped to the SSE field "event".
        - The message content is described here as property "data" and mapped to the SSE field "data".
        - The associated GET API is described here as property "relatedGetApi". The described GET API must be called to get the current values.
        - Almost every event on this stream carries an empty `data` field ("event:name\ndata:\n\n") and exists purely to tell the client "something changed, go re-fetch" — the client is expected to call `relatedGetApi` (or the endpoint it already knows corresponds to that event name) to get the actual new state.

        This is the same hub-wide stream used by the Testing and Analyzer pages for their own event names (e.g. `testingUpdate`, `testingRunStatus`, `testingLog`, `rpcServerStatusUpdate` — see the Testing tag) in addition to simulation events; the Analyzer additionally has its own dedicated stream at GET /analyzer/stream for high-volume protocol events, kept separate so it does not compete with this stream's fan-out.

        Possible schemas for 'data' for the corresponding event type:
        - event: CEMConfig
          data: ''
          relatedGetApi: '/hems'
        - event: saveUpdate
          data: ''
          relatedGetApi: '/sim/save'
  /evse/{evseId}/qr-code:
    get:
      tags:
        - EVSE
      summary: Get SHIP QR-pairing data for the EVSE
      operationId: getEVSEQRPair
      description: >-
        Returns the SHIP QR-code pairing text for the EVSE's own EEBUS service.
        Requires: the EVSE's service must already be running (started via POST
        /evse/{evseId}/trust or otherwise) — 400 if it has not started yet. Note:
        a malformed evseId, and evseId resolving to a non-EVSE entity, both
        return 400 here; 404 is reserved for an evseId that resolves to no
        entity at all (same split as GET /evse/{evseId}/errorState).
      parameters:
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRPairDataResponse"
        '400':
          description: >-
            Malformed evseId, evseId does not resolve to an EVSE entity, or the
            EVSE's EEBUS service has not started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/EvseNotFound"
  /hems/addExt:
    post:
      tags:
        - HEMS
      summary: Register a real (non-simulated) HEMS/CEM by SKI
      operationId: addExtHEMS
      description: >-
        Records the SKI of a real HEMS/CEM so simulated actors can be paired with
        it (there is no simulated CEM entity created — this is metadata only, used
        by `GET /hemsExt` and the pairing UI). `remoteSKI` is normalized the same
        way as `POST /hems/trust` (whitespace stripped, lowercased) via
        `FormatSki`. There is only one external HEMS slot; calling this again
        overwrites the previous one.


        Requires: simulation STOPPED.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remoteSKI:
                  type: string
                  description: SKI of the real HEMS/CEM
                imgBase64:
                  type: string
                  description: Base64-encoded image for the real HEMS (optional)
            example:
              remoteSKI: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
      responses:
        '200':
          description: External HEMS SKI recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Simulation is running, or the request body is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: The internal simulation engine could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hemsExt:
    get:
      tags:
        - HEMS
      summary: Get the registered real HEMS SKI
      operationId: getExtHEMS
      description: >-
        Always returns 200. Returns `{remoteSKI, imgBase64}` if an external HEMS
        was registered via `POST /hems/addExt`, or an empty array `[]` (not a 404)
        if none has been registered yet.
      responses:
        '200':
          description: The registered external HEMS, or `[]` if none is registered
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ExtDeviceConfig"
                  - type: array
                    items: {}
                    maxItems: 0
              example:
                remoteSKI: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
                imgBase64: ""
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    delete:
      tags:
        - HEMS
      summary: Remove the registered real HEMS SKI
      operationId: deleteExtHEMS
      description: >-
        Requires: simulation STOPPED. Blocked with 409 while a test run is active
        (see `POST /testrun`), unless the request carries a valid test-run token.
      responses:
        '200':
          description: External HEMS registration removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Simulation is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No external HEMS is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '409':
          description: Blocked because an automated test run is currently active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: The internal simulation engine could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    patch:
      tags:
        - HEMS
      summary: Update the registered real HEMS SKI and/or image
      operationId: updateExtHEMS
      description: >-
        Replaces the registered external HEMS's SKI and/or image. Unlike `GET
        /hemsExt`'s response and `POST /hems/addExt`'s request (which both use
        `remoteSKI`, all caps), this request body's SKI field is `remoteSki`
        (lower-case "ki") — a casing inconsistency in the underlying types. The SKI
        is **not** normalized/lowercased here (unlike `POST /hems/addExt` and
        `POST /hems/trust`). Changing the SKI while the simulation is running is
        rejected with 400; the image can be changed at any time. Any unrecognized
        field (e.g. `deviceName`) is silently ignored.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remoteSki:
                  type: string
                  description: New SKI for the external HEMS (note lower-case "ki", unlike GET/POST)
                imgBase64:
                  type: string
                  description: New Base64-encoded image
            example:
              remoteSki: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
      responses:
        '200':
          description: External HEMS registration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: The SKI was changed while the simulation is running, or the request body is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No external HEMS is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: The internal simulation engine could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/gridmeasurement:
    get:
      tags:
        - HEMS
      summary: Get the aggregated grid measurement and lifetime consumption/feed-in
      operationId: getHEMSGridMeasurement
      description: >-
        Returns the simulated grid's current three-phase measurement plus lifetime
        cumulative energy totals. Note: unlike most other HEMS operations, the
        "no HEMS entity" case here returns 400, not 404.
      responses:
        '200':
          description: Grid measurement and cumulative totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalGridMeasurement"
              example:
                status: OK
                measurement:
                  Voltage: { A: 230, B: 230, C: 230 }
                  VoltageLine: { A: 398, B: 398, C: 398 }
                  Current: { A: 12.5, B: 10.1, C: 8.3 }
                  Power: 6800
                  Frequency: { A: 50, B: 50, C: 50 }
                  PowerFactor: { A: 0.98, B: 0.97, C: 0.99 }
                  Lag: { A: 0, B: 0, C: 0 }
                totalConsumptionWh: 154300
                totalFeedInWh: 2100
        '400':
          description: No HEMS entity exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/LpcDevicesData:
    get:
      tags:
        - HEMS
      summary: Get LPC data (APCL, failsafe, constraints) for all connected devices
      operationId: getHEMSLpcDevicesData
      description: >-
        Returns, per connected LPC controllable-system device, its address, SKI,
        current APCL, current failsafe consumption limit and power-consumption
        constraints in one call — a convenience combining what `GET
        /hems/ActivePowerConsumptionLimit`, `GET /hems/FailsafeActivePowerLimit`
        and `GET /hems/ActivePowerLimitConstraints` return separately. Unlike
        those three (which return objects keyed by device address), this returns
        a bare array. Unlike `GET /hems/LppDevicesData` below, this endpoint does
        **not** gate on the LPC use case being licensed/enabled.
      responses:
        '200':
          description: One entry per connected LPC device. Empty array if none are connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LpcDeviceDataArrayResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsNotFound"
  /hems/LppDevicesData:
    get:
      tags:
        - HEMS
      summary: Get LPP data (APPL, failsafe, constraints) for all connected devices
      operationId: getHEMSLppDevicesData
      description: >-
        Returns, per connected LPP controllable-system device, its address, SKI,
        current APPL, current failsafe production limit and power-production
        constraints in one call — a convenience combining what `GET
        /hems/ActivePowerProductionLimit`, `GET
        /hems/FailsafeActivePowerProductionLimit` and `GET
        /hems/ActivePowerProductionLimitConstraints` return separately. Unlike
        those three (which return objects keyed by device address), this returns
        a bare array.


        Requires: the LPP use case must be licensed/enabled (400 otherwise).
      responses:
        '200':
          description: One entry per connected LPP device. Empty array if none are connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LppDeviceDataArrayResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsNotFound"
        '400':
          description: LPP use case is not supported/licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/FailsafeDurationForLpc:
    post:
      tags:
        - HEMS
      summary: Send only the minimum failsafe duration for LPC to all connected devices
      operationId: sendHEMSFailsafeDurationLpc
      description: >-
        Equivalent to `POST /hems/FailsafeActivePowerLimit` but sends only
        `durationSeconds` (the request body is bound the same way — as an `FCAPL`
        — but `value` is cleared before sending, so any `value` in the request is
        ignored). `durationSeconds` is required (400 "Data missing" if omitted).
        Same vacuous-failure behavior as `POST /hems/FailsafeActivePowerLimit`:
        reports `success=false, reason="No entities found"` when no LPC devices
        are connected.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FCAPL"
            example:
              durationSeconds: 7200
      responses:
        '200':
          description: Write attempted; see `success`/`reason` for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FCAPLDataSuccessResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsNotFound"
        '400':
          $ref: "#/components/responses/DataMissingInBodyBadRequest"
  /hems/FailsafeDurationForLpc/{deviceAddress}:
    post:
      tags:
        - HEMS
      summary: Send only the minimum failsafe duration for LPC to one device
      operationId: sendHEMSFailsafeDurationLpcToDevice
      description: >-
        Equivalent to `POST /hems/FailsafeActivePowerLimit/{deviceAddress}` but
        sends only `durationSeconds` (`value` is cleared before sending).
        `durationSeconds` is required (400 "Data missing" if omitted).


        Requires: the device must be paired and exposing the LPC controllable-system
        role.
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIM60745_Wallbox-9166afa5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FCAPL"
            example:
              durationSeconds: 7200
      responses:
        '200':
          description: Write attempted; see `success`/`reason` for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FCAPLDataSuccessResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No HEMS entity exists, or no LPC device with that address is connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '400':
          $ref: "#/components/responses/DataMissingInBodyBadRequest"
  /hems/FailsafeDurationForLpp:
    post:
      tags:
        - HEMS
      summary: Send only the minimum failsafe duration for LPP to all connected devices
      operationId: sendHEMSFailsafeDurationLpp
      description: >-
        Equivalent to `POST /hems/FailsafeActivePowerProductionLimit` but sends
        only `durationSeconds` (`value` is cleared before sending).
        `durationSeconds` is required (400 "Data missing" if omitted). Unlike the
        other LPP bulk endpoints, this one does **not** check whether the LPP use
        case is licensed/enabled. Same vacuous-failure behavior as `POST
        /hems/FailsafeActivePowerProductionLimit`: reports `success=false,
        reason="No entities found"` when no LPP devices are connected.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lppFSAPPL"
            example:
              durationSeconds: 7200
      responses:
        '200':
          description: Write attempted; see `success`/`reason` for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FSAPPLDataSuccessResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsNotFound"
        '400':
          $ref: "#/components/responses/DataMissingInBodyBadRequest"
  /hems/FailsafeDurationForLpp/{deviceAddress}:
    post:
      tags:
        - HEMS
      summary: Send only the minimum failsafe duration for LPP to one device
      operationId: sendHEMSFailsafeDurationLppToDevice
      description: >-
        Equivalent to `POST /hems/FailsafeActivePowerProductionLimit/{deviceAddress}`
        but sends only `durationSeconds` (`value` is cleared before sending).
        `durationSeconds` is required (400 "Data missing" if omitted).


        **Known issue:** `deviceAddress` is resolved through the LPC device
        registry, not the LPP one (unlike every other `/{deviceAddress}` LPP
        endpoint). In practice this only succeeds for an address that is also
        registered as an LPC controllable system; a device that supports LPP but
        not LPC returns 404 here even though it is a valid LPP device address
        elsewhere (e.g. in `GET /hems/LppDevicesData`).
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIM60745_Wallbox-9166afa5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lppFSAPPL"
            example:
              durationSeconds: 7200
      responses:
        '200':
          description: Write attempted; see `success`/`reason` for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FSAPPLDataSuccessResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No HEMS entity exists, or no matching LPC-registered device with that address was found (see description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '400':
          $ref: "#/components/responses/DataMissingInBodyBadRequest"
  /hems/latestReceivedHeartbeat:
    get:
      tags:
        - HEMS
      summary: Get the latest received heartbeat from every connected remote device
      operationId: getHEMSAllLatestReceivedHeartbeats
      description: >-
        Aggregates `GetLatestReceivedHeartbeat` over every remote device
        currently connected to the HEMS (any use case, not only LPC — contrast
        with `GET /hems/latestReceivedHeartbeat/{deviceAddress}`, which requires
        LPC and a specific address). Devices with no valid received heartbeat yet
        are silently omitted, so the result may have fewer entries than there are
        connected devices.
      responses:
        '200':
          description: Latest received heartbeat per device, keyed by device address
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  result:
                    type: object
                    description: Map of device address to its latest received heartbeat
                    additionalProperties:
                      $ref: "#/components/schemas/HeartbeatData"
              example:
                status: OK
                result:
                  "d:_n:SIM60745_Wallbox-9166afa5":
                    timestamp: "2026-07-17-10-30-00"
                    counter: 42
                    timeout: 120
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsNotFound"
        '500':
          description: Internal failure aggregating heartbeats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/connectedDevices:
    get:
      tags:
        - HEMS
      summary: Get every device (real and simulated) paired with the HEMS
      operationId: getHEMSConnectedDevices
      description: >-
        Lists all remote devices currently connected to the HEMS, grouped by
        device with each of their SPINE entities nested underneath. Unlike `GET
        /hems/extDevices`, this includes both real and simulated devices. Returns
        an empty array `[]` (not a 404) when nothing is connected.
      responses:
        '200':
          description: Connected devices grouped by device SKI. Empty array if none are connected.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: Device type (e.g. ChargingStation)
                    isExternal:
                      type: boolean
                      description: Whether this is a real (non-simulated) device
                    ski:
                      type: string
                      description: SKI of the device
                    entities:
                      type: array
                      description: SPINE entities exposed by this device
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: SPINE entity type (e.g. EVSE, EV)
                          address:
                            type: object
                            properties:
                              device:
                                type: string
                                description: SPINE device address (use this as {deviceAddress} on the per-device endpoints)
                              entity:
                                type: array
                                items:
                                  type: integer
              example:
                - type: ChargingStation
                  isExternal: false
                  ski: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
                  entities:
                    - type: EVSE
                      address:
                        device: "d:_n:SIM60745_Wallbox-9166afa5"
                        entity: [1]
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsNotFound"
  /hems/mob/BatteryIdentification:
    get:
      tags:
        - HEMS
      summary: Get battery manufacturer identification data (MOB use case)
      operationId: getMOBBatteryIdentification
      description: >-
        Returns Monitoring of Battery identification data for every remote battery entity
        the HEMS's MOB handler is paired to. This route has no license/use-case gate at all
        (unlike MOI) and always returns 200. Fallback: when the HEMS is absent or has no
        remote battery paired, the response is built instead from this hub's own simulated
        Inverter entities (each Inverter that models a battery exposes MOB data locally) —
        the two sources are never mixed, remote data wins when present.
      responses:
        '200':
          description: Successful response. Empty array when neither a paired remote battery nor a simulated Inverter with battery data exists.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                      description: SPINE device address of the remote battery, or of the simulated Inverter in the fallback case.
                    batteryIdentication:
                      $ref: "#/components/schemas/BatteryManufacturerData"
              example:
                - deviceAddress: d:_n:SIM60745_Inverter-9166afa5
                  batteryIdentication:
                    manufacturerName: Simulated Battery Co
                    batteryType: liIon
                    batteryCapacityNominalMax: 10000
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/mob/BatteryStates:
    get:
      tags:
        - HEMS
      summary: Get battery state data (MOB use case)
      operationId: getMOBBatteryStates
      description: >-
        Returns Monitoring of Battery state-of-charge/power data for every remote battery
        entity the HEMS's MOB handler is paired to. This route has no license/use-case gate
        at all and always returns 200. Fallback: when the HEMS is absent or has no remote
        battery paired, the response is built instead from this hub's own simulated Inverter
        entities.
      responses:
        '200':
          description: Successful response. Empty array when no data source is available.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                    batteryStateData:
                      $ref: "#/components/schemas/BatteryStateData"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/mob/BatteryMeasurements:
    get:
      tags:
        - HEMS
      summary: Get battery measurement data (MOB use case)
      operationId: getMOBBatteryMeasurements
      description: >-
        Returns Monitoring of Battery cumulative/health measurement data for every remote
        battery entity the HEMS's MOB handler is paired to. This route has no license/use-case
        gate at all and always returns 200. Fallback: when the HEMS is absent or has no
        remote battery paired, the response is built instead from this hub's own simulated
        Inverter entities.
      responses:
        '200':
          description: Successful response. Empty array when no data source is available.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                    batteryMeasurementsData:
                      $ref: "#/components/schemas/BatteryMeasurements"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/moi/inverterIdentification:
    get:
      tags:
        - HEMS
      summary: Get inverter identification data (MOI use case)
      operationId: getMOIInverterIdentification
      description: >-
        Returns Monitoring of Inverter identification data for every remote inverter entity
        the HEMS's MOI handler is paired to. Fallback: when the HEMS is absent or has no
        remote inverter paired, the response is built instead from this hub's own simulated
        Inverter entities. The handler also checks a MOI use-case-availability flag before
        running, but that flag is initialized once at startup (and only re-initialized by
        `POST /sim` with `action: "reset"`) and is never left unset, so the 400 below cannot actually fire in
        a running server — overall license validity is still enforced globally (403 on an
        expired license). This route never returns 404 — it always answers 200, with an
        empty array when neither source has data.
      responses:
        '200':
          description: Successful response. Empty array when no data source is available.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                    inverterIdentification:
                      $ref: "#/components/schemas/InverterIdentification"
        '400':
          description: MOI use case not supported by this build (see description — not reachable once the server is running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/moi/inverterState:
    get:
      tags:
        - HEMS
      summary: Get inverter state (MOI use case)
      operationId: getMOIInverterState
      description: >-
        Returns Monitoring of Inverter operating-state data for every remote inverter entity
        the HEMS's MOI handler is paired to. Fallback: when the HEMS is absent or has no
        remote inverter paired, the response is built instead from this hub's own simulated
        Inverter entities. Same use-case-flag caveat as `GET /hems/moi/inverterIdentification`
        — the 400 below is not reachable in a running server. Never returns 404; always 200,
        empty array when no data source is available.
      responses:
        '200':
          description: Successful response. Empty array when no data source is available.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                    inverterState:
                      $ref: "#/components/schemas/InverterState"
        '400':
          description: MOI use case not supported by this build (see description — not reachable once the server is running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/moi/inverterMeasurement:
    get:
      tags:
        - HEMS
      summary: Get inverter measurement data (MOI use case)
      operationId: getMOIInverterMeasurement
      description: >-
        Returns Monitoring of Inverter power/energy measurement data for every remote
        inverter entity the HEMS's MOI handler is paired to. Fallback: when the HEMS is
        absent or has no remote inverter paired, the response is built instead from this
        hub's own simulated Inverter entities. Same use-case-flag caveat as
        `GET /hems/moi/inverterIdentification` — the 400 below is not reachable in a running
        server. Never returns 404; always 200, empty array when no data source is available.
      responses:
        '200':
          description: Successful response. Empty array when no data source is available.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                    inverterMeasurements:
                      $ref: "#/components/schemas/InverterMeasurementData"
        '400':
          description: MOI use case not supported by this build (see description — not reachable once the server is running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /hems/qr-code:
    get:
      tags:
        - HEMS
      summary: Get the HEMS's SHIP QR-code pairing text
      operationId: getHEMSQRPair
      description: >-
        Returns the SHIP QR-code pairing string for the HEMS's own service (SKI,
        host and port encoded per the SHIP QR-code format), for use by a real
        device's manual-pairing / QR-scan flow. Complements `POST /hems/trust`,
        which is the reverse direction (HEMS trusting a remote SKI).
      responses:
        '200':
          description: QR-code pairing text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRPairDataResponse"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsNotFound"
        '400':
