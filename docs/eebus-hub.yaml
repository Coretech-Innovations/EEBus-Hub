  /heatpump/OhpcfMonitorData:
    get:
      tags:
        - Heat Pump
      summary: Get OHPCF monitor data for every heat pump that announced a process
      operationId: getAllHeatPumpOhpcfMonitorData
      description: >-
        Iterates every heat pump entity and includes only those that have
        announced an optional power-consumption process — see
        `POST /heatpump/{heatPumpId}/announceOptional`
        (`HeatPump.HasAnnouncedOptionalProcess`); a heat pump that has never
        announced is omitted entirely, not returned with empty data. This is a
        heat-pump-only view; the equivalent all-devices endpoint
        `GET /hems/OhpcfMonitorData` covers the same use case from the CEM side.
        Requires: the OHPCF use case must be enabled by the license — 400
