          description: DeviceDiagnosis operating state as the hub reports it, e.g. "Normal Operation". api.OpevEVState.OperatingState
            and api.OscevEVState.OperatingState are plain strings — these four schemas previously pointed
            at DeviceErrorState, which is the object shape a different endpoint returns.
        lastUpdatedAt:
          type: string
          description: when limits were last written by a controller, absent until the first write
          example: 2026/07/14 12:00:05
    LPEvent:
      title: LPC/LPP load-control-limit event
      type: object
      description: >
        One load-control-limit write for the LPC or LPP use case, or a failsafe
        limit write, together with the accept/reject outcome once it settles.
      properties:
        timestamp:
          type: string
          example: "2026/07/14 12:00:05"
        limitType:
          type: string
          description: >-
            APCL/APPL are regular Active Power Consumption/Production limits;
            FSCAPL/FSPAPL are their failsafe counterparts, applied when
            communication with the controller is lost.
          enum: [APCL, APPL, FSCAPL, FSPAPL]
        sourceAddress:
          type: string
          description: SPINE address of the entity that wrote the limit.
        destinationAddress:
          type: string
          description: SPINE address of the entity the limit was written to.
        limit:
          type: number
          format: double
          description: Limit value — Amps for APCL/FSCAPL, Watts for APPL/FSPAPL.
        limitDuration:
          type: number
          format: double
          description: How long the limit applies, in seconds.
          x-unit: s
        isActive:
          type: boolean
          description: Whether the limit is currently in effect.
        limitState:
          type: string
          description: >-
            Applied: just written, outcome pending. Accepted/Rejected: the
            controller's response. Expired: the limit's duration elapsed.
            Timed-out: no response was received in time.
          enum: [Applied, Accepted, Rejected, Expired, Timed-out]
        reason:
          type: string
          description: Populated when the write was rejected.
    EVLimitPhaseValue:
      title: EV limit phase value
      type: object
      description: One phase's limit within a single write message.
      properties:
        limitId:
          type: integer
        value:
          type: number
          format: double
        unit:
          type: string
          description: Unit of `value` — A for a current limit, W for a power limit.
          enum: [A, W]
        isLimitActive:
          type: boolean
    EVLimitEvent:
      title: EV limit event
      type: object
      description: >
        One OPEV or OSCEV limit WRITE MESSAGE and the per-phase limits it carried.
        A per-phase current write (OPEV, or OSCEV current) fills a/b/c; an OSCEV power
        write fills total. Events logged as sent start in the Applied state and move to
        Accepted or Rejected once the EV reports the outcome of the whole write.
      properties:
        timestamp:
          type: string
          example: "2026/07/14 12:00:05"
        useCase:
          type: string
          description: Which EEBUS use case wrote the limit — Overload Protection by EV or Optimization of Self-Consumption during EV Charging.
          enum: [OPEV, OSCEV]
        sourceAddress:
          type: string
        destinationAddress:
          type: string
        evId:
          type: integer
          description: >
            Set only for EVs simulated by this hub. Absent for remote/DUT EVs and
            generally absent on sent events, where the CEM keys EVs by address.
        a:
          $ref: "#/components/schemas/EVLimitPhaseValue"
        b:
          $ref: "#/components/schemas/EVLimitPhaseValue"
        c:
          $ref: "#/components/schemas/EVLimitPhaseValue"
        total:
          $ref: "#/components/schemas/EVLimitPhaseValue"
        limitState:
          type: string
          description: >-
            Applied: just written, outcome pending. Accepted/Rejected: the
            controller's response. Expired: the limit's duration elapsed.
            Timed-out: no response was received in time.
          enum: [Applied, Accepted, Rejected, Expired, Timed-out]
        reason:
          type: string
          description: populated when the write was rejected
