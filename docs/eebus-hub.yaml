      operationId: postHemsCobPccModeMaxLimit
      description: >-
        Writes one of the four PCC-mode maximum power limits to the paired device's
        matching device-configuration key. Requires: a device paired at deviceAddress that
        exposes a configuration key named after limitType. value is required, is in Watts,
        and is sent as-is with no range check. Unlike most COB limit routes, a failed EEBUS
        write is reported as HTTP 500, not 200. The handler also checks a COB
        use-case-availability flag, but that flag is initialized once at startup and never
        left unset, so the 400 below cannot actually fire for that reason in a running
        server — overall license validity is still enforced globally (403 on an expired
        license).
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIM60745_Inverter-9166afa5
        - name: limitType
          in: path
          required: true
          description: >-
            Which PCC maximum-power configuration key to write: AC/DC charge or
            discharge power maximum.
          schema:
            type: string
            description: >-
              maxAcChargePower/maxAcDischargePower apply to AC-coupled limits,
              maxDcChargePower/maxDcDischargePower to DC-coupled limits.
            enum:
              - maxAcChargePower
              - maxAcDischargePower
              - maxDcChargePower
              - maxDcDischargePower
