    LicenseCapability:
      title: Licensable capability
      type: object
      description: >
        A single licensable item (device, use case or feature) with its human readable
        name and whether the current license grants it.
      properties:
        id:
          type: string
          description: Stable identifier, e.g. "inverter", "lpc" or "eebusAnalyzer".
          example: lpc
        name:
          type: string
          description: Full human readable name, e.g. "Limitation of Power Consumption".
          example: Limitation of Power Consumption
        supported:
          type: boolean
          description: Whether the current license grants this capability.
      required:
        - id
        - name
        - supported
    LicenseData:
      title: License information
      type: object
      properties:
        customerName:
          type: string
        email:
          type: string
        issueTime:
          type: string
          format: date-time
        expiryTime:
          type: string
          format: date-time
        valid:
          type: boolean
          description: Whether the license is currently valid (signed, issued and not expired).
        allowedEntities:
          type: array
          description: Raw device kinds granted by the license. Omitted when the license grants all defaults.
          items:
            type: string
          example: ["inverter", "heatpump"]
        allowedUsecases:
          type: array
          description: Raw use case abbreviations granted by the license. Omitted when the license grants all defaults.
          items:
            type: string
          example: ["lpc", "moi"]
        cAllowedUsecases:
          type: array
          description: Use cases the compliance test pipeline may run.
          items:
            type: string
        cAllowedActors:
          type: array
          description: Actors the compliance test pipeline may run.
          items:
            type: string
        devices:
          type: array
          description: >
            The full catalogue of simulated device kinds, mapped from the license's allowed
            entities. Devices the license does not grant are included with supported=false so
            the UI can render them as unavailable. Device kinds granted by the license but
            unknown to this build are appended with supported=true.
          items:
            $ref: "#/components/schemas/LicenseCapability"
        usecases:
          type: array
          description: >
            The full catalogue of use cases, each abbreviation resolved to its full EEBUS name.
            Use cases the license does not grant are included with supported=false. Use cases
            granted by the license but not implemented by this build are appended with
            supported=true.
          items:
            $ref: "#/components/schemas/LicenseCapability"
        features:
          type: array
          description: >
            Non use-case features (shipPairingService, modbusMeter, complianceTests,
            eebusAnalyzer, robotFramework), including the unsupported ones with supported=false.
          items:
            $ref: "#/components/schemas/LicenseCapability"
        spsSupported:
          type: boolean
          description: Whether the SHIP pairing service feature is licensed.
        modbusMeterSupported:
          type: boolean
          description: Whether the Modbus meter feature is licensed.
        complianceTestsSupported:
          type: boolean
          description: Whether the compliance test pipeline feature is licensed.
        eebusAnalyzerSupported:
          type: boolean
          description: Whether the EEBUS Analyzer feature is licensed. When false, all /analyzer/* endpoints return 403.
        robotFrameworkSupported:
          type: boolean
          description: Whether the Robot Framework test layer is licensed.

    testingLpcOptionalSupport:
      type: object
      description: 'Declares which optional LPC functionalities the DUT implements, mirroring the "Optional
        Support" worksheet of the EEBus LPC ParameterSheet. Each flag decides whether the test cases it gates
        run or are skipped.


        Every flag a selected suite requires must be present. Unlike mpcMu/mpcMa, an omitted flag is rejected
        with a 400 rather than defaulting to false, because a missing declaration would otherwise drop test
        cases from a compliance run without anyone declaring them unsupported. The dashboard always sends
        every required flag explicitly, so this only affects direct API clients.'
      properties:
        supportsUnlimitedAutonomous:
          type: boolean
          description: The DUT implements the Unlimited/Autonomous state.
        csBlackStartCapable:
          type: boolean
          description: The Controllable System is black start capable.
        autoAdjustTooLargeApcl:
          type: boolean
          description: The DUT auto-adjusts an Active Power Consumption Limit larger than its nominal maximum
            instead of rejecting it.
        persistsFailsafeValues:
          type: boolean
          description: The DUT persists its failsafe values across a restart.
        egBlackStartCapable:
          type: boolean
          description: The Energy Guard is black start capable.
        egQuickResendOnRejectedApcl:
          type: boolean
          description: The Energy Guard quickly resends an APCL that was rejected.
        verifyNominalMaxConsumptionLimiting:
          type: boolean
          description: Verify that the CS limits itself to the nominal maximum. Declaring this true requires
            the DUT's JSON-RPC server to implement GetOwnActivePowerConsumptionWatt and GetOwnActivePowerConsumptionLimit;
            without them ATC_LPC_COM_PT_CSUnlAuto_002 fails on the missing method rather than on DUT behaviour.
        ins1PermittedApclRejection:
          type: boolean
          description: INS1 — the DUT is permitted to reject an APCL.
        ins2PermittedApclRejection:
          type: boolean
          description: INS2 — the DUT is permitted to reject an APCL.
    testingLppOptionalSupport:
      type: object
      description: 'Declares which optional LPP functionalities the DUT implements, mirroring the "Optional
        Support" worksheet of the EEBus LPP ParameterSheet. The worksheet is row-for-row the same as the LPC
        one, so this is the production counterpart of testingLpcOptionalSupport and behaves identically.


        Note the spelling: the LPP limit is APPL, so these keys read "Appl" where the LPC ones read "Apcl".


        Every flag a selected suite requires must be present. An omitted flag is rejected with a 400 rather
        than defaulting to false, because a missing declaration would otherwise drop test cases from a compliance
        run without anyone declaring them unsupported. The dashboard always sends every required flag explicitly,
        so this only affects direct API clients.'
      properties:
        supportsUnlimitedAutonomous:
          type: boolean
          description: The DUT implements the Unlimited/Autonomous state.
        csBlackStartCapable:
          type: boolean
          description: The Controllable System is black start capable.
        autoAdjustTooLargeAppl:
          type: boolean
          description: The DUT auto-adjusts an Active Power Production Limit larger than its nominal maximum
            instead of rejecting it.
        persistsFailsafeValues:
          type: boolean
          description: The DUT persists its failsafe values across a restart.
        egBlackStartCapable:
          type: boolean
          description: The Energy Guard is black start capable.
        egQuickResendOnRejectedAppl:
          type: boolean
          description: The Energy Guard quickly resends an APPL that was rejected.
        verifyNominalMaxProductionLimiting:
          type: boolean
          description: Verify that the CS limits itself to the nominal maximum production. Declaring this
            true requires the DUT's JSON-RPC server to implement GetOwnActivePowerProductionWatt and GetOwnActivePowerProductionLimit;
            without them ATC_LPP_COM_PT_CSUnlAuto_002 fails on the missing method rather than on DUT behaviour.
        ins1PermittedApplRejection:
          type: boolean
          description: INS1 — the DUT is permitted to reject an APPL.
        ins2PermittedApplRejection:
          type: boolean
          description: INS2 — the DUT is permitted to reject an APPL.
    LpcLppViewConsumptionConstraints:
      title: LPC power consumption constraints
      description: A controllable system declares only the maximum that bounds it — an energy management system
        its contractual maximum, every other device type its own nominal maximum. The inapplicable field is
        omitted rather than reported as zero, so an absent field means "not declared by this device". LpcLppViewProductionConstraints
        follows the same convention.
      type: object
      properties:
        powerConsumptionNominalMax:
          type: number
        contractualConsumptionNominalMax:
          type: number
    LpcLppViewEntry:
      title: LPC/LPP limitation view entry
      type: object
      properties:
        displayName:
          type: string
          description: Configured device name for simulated devices; the SPINE device address for external
            ones.
        deviceAddress:
          type: string
          description: SPINE device address. Empty while a simulated device's EEBUS service is not running.
        ski:
          type: string
          description: SHIP SKI of the device.
        source:
          type: string
          enum:
          - simulated
          - external
        simulatedEntityId:
          type: integer
          description: Engine entity id. Only present when source is `simulated`.
        availableUseCases:
          $ref: '#/components/schemas/LpcLppViewUseCases'
        lpc:
          $ref: '#/components/schemas/LpcLppViewLpcSection'
        lpp:
          $ref: '#/components/schemas/LpcLppViewLppSection'
    LpcLppViewLpcSection:
      title: LPC block of a limitation view entry
      type: object
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/CSState'
          description: Controllable system state. Only present for simulated devices — the state machine is
            hub-internal and is not propagated over EEBUS.
        activePowerConsumptionLimit:
          $ref: '#/components/schemas/lpcAPCL'
        failsafeActivePowerConsumption:
          $ref: '#/components/schemas/FCAPL'
        powerConsumptionConstraints:
          $ref: '#/components/schemas/LpcLppViewConsumptionConstraints'
    LpcLppViewLppSection:
      title: LPP block of a limitation view entry
      type: object
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/CSState'
          description: Controllable system state. Only present for simulated devices — the state machine is
            hub-internal and is not propagated over EEBUS.
        activePowerProductionLimit:
          $ref: '#/components/schemas/lppAPPL'
        failsafeActivePowerProduction:
          $ref: '#/components/schemas/lppFSAPPL'
        powerProductionConstraints:
          $ref: '#/components/schemas/LpcLppViewProductionConstraints'
    LpcLppViewProductionConstraints:
      title: LPP power production constraints
      description: 'The production-side mirror of LpcLppViewConsumptionConstraints, with the same omit-when-inapplicable
        convention: an absent field means "not declared by this device", never "declared as zero".'
      type: object
      properties:
        powerProductionNominalMax:
          type: number
        contractualProductionNominalMax:
          type: number
    LpcLppViewSnapshot:
      title: LPC/LPP limitation view snapshot
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/LpcLppViewEntry'
        simulatedCount:
          type: integer
          description: Number of entries sourced from the hub's own simulated devices.
        externalCount:
          type: integer
          description: Number of entries sourced from external devices observed as Energy Guard.
    LpcLppViewUseCases:
      title: LPC/LPP use case availability
      type: object
      properties:
        lpc:
          type: boolean
        lpp:
          type: boolean
    PVStringData:
      title: MPS (Monitoring of PV String) data for a single PV String entity
      type: object
      properties:
        pvStringDCPowerInWatts:
          type: number
          nullable: true
          description: DC power of the PV string in Watts
        pvStringDCCurrentInAmperes:
