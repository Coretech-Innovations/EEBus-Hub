  /controlbox/ActivePowerProductionLimit:
    post:
      tags:
        - ControlBox
      summary: Send the Active Power Production Limit (APPL) to all paired LPP devices
      operationId: controlBoxSendAPPL
      description: >-
        ControlBox equivalent of `POST /hems/ActivePowerProductionLimit` — the
        ControlBox is the limit sender for LPP too (production side), commanding every
        downstream device paired to it that exposes the LPP controllable-system role.
        Sends an LPP load-control limit write to every connected device (splitting
        `value` evenly across all of them when active=true and value < 0). `active` is
        required; `value` is additionally required when `active` is true (400
        "Data missing" otherwise).


        `success` reflects whether *all* targeted devices accepted the write.
        **Differs from HEMS**: when zero LPP devices are connected, this endpoint
        reports success=**false** (HEMS reports true for the same vacuous case) —
        verified against `ControlBox.SendLppApplToAllDevices`. See
        `GET /controlbox/LppDevicesData` to discover connected devices.


        Requires: the LPP use case to be enabled. In practice the corresponding
        `useCasesEnable.LppEnabled == nil` check in the handler never fires once the
        server is running — that flag is set once at startup and is never left unset —
        so this 400 branch is not reachable in a running server; LPP availability is
        actually enforced by license validity (see `POST /license`, 403 responses).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lppAPPL"
            example:
              active: true
              value: -3000
              durationSeconds: 3600
      responses:
        '200':
          description: Write attempted; see success/reason for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlBoxAPPLSuccessResponse"
        '400':
          description: LPP use case not enabled (see description — not reachable once the server is running), or required data missing from the body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/ControlBoxNotFound"
    patch:
      tags:
        - ControlBox
      summary: Send the Active Power Production Limit (APPL) to all paired LPP devices (partial)
      operationId: controlBoxModifyAPPL
      description: >-
