          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
  /ev/{evId}/LoadControlLimit:
    get:
      tags:
      - EV
      summary: Get the EV's OPEV load-control limits
      operationId: getLoadControlLimit
      description: 'Returns the raw SPINE LoadControlLimitListData the EV currently holds for the OPEV use
        case, as exactly 3 entries in phase A, B, C order (the phase is implied by array position, not carried
        in the payload). Requires: the EV must be connected to an EVSE (400 otherwise), and the OPEV handler
        must be running (400 if OPEV is disabled for this EV).'
      parameters:
      - name: evId
        in: path
        schema:
          type: integer
        required: true
        example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadControlLimitListData'
        '400':
          description: Invalid ID number, the EV is not connected to an EVSE, or OPEV is not available for
            this EV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/NoExistingEvIdNotFound'
        '500':
          description: The EV is not plugged into an EVSE. Reported as 500 by the handler even though it
            is a client-state condition; documented as it behaves.
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                title: response status error
  /ev/{evId}/ElectricalConnectionPermitted:
    get:
      tags:
      - EV
      summary: Get the EV's permitted electrical connection value
      operationId: getElectricalConnectionPermitted
      description: 'Returns the OPEV/EVCC electrical-connection permitted value and range for phase A, as
        a single-element array. Requires: the EV must be connected to an EVSE, with both its OPEV and EVCC
        handlers running (400 otherwise).'
      parameters:
      - $ref: '#/components/parameters/EvIdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermittedValueSetListData'
        '400':
          description: Invalid ID number, the EV is not connected to an EVSE, or OPEV/EVCC is not available
            for this EV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/NoExistingEvIdNotFound'
        '500':
          description: The EV is not plugged into an EVSE. Reported as 500 by the handler even though it
            is a client-state condition, and — unlike almost every other route — under the key "error" rather
            than "err".
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                title: response status error
    patch:
      tags:
      - EV
      summary: Set the EV's permitted electrical connection values
      operationId: patchElectricalConnectionPermitted
      description: Writes the OPEV/EVCC electrical-connection permitted value and range for all three phases.
        The request body must contain exactly 3 entries, in phase A, B, C order — fewer than 3 entries causes
        the request to fail (the handler indexes elements 0/1/2 directly). Requires the EV's OPEV and EVCC
        handlers to be running (400 otherwise). Unlike the GET on this path, which returns only phase A,
        the PATCH always writes all three phases.
      parameters:
      - name: evId
        in: path
        schema:
          type: integer
        required: true
        example: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermittedValueSetListData'
            example:
            - permittedValue: 6
              range:
                min: 6
                max: 32
            - permittedValue: 6
              range:
                min: 6
                max: 32
            - permittedValue: 6
              range:
                min: 6
                max: 32
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusOk'
        '400':
          description: Invalid ID or malformed body, or OPEV/EVCC is not available for this EV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          description: EV not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '500':
          description: The write to the EV failed. Reported under the key "error" rather than "err", unlike
            almost every other route.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                title: response status error
  /ev/{evId}/LastHeartbeatData:
    get:
      tags:
        - EV
      summary: Get the last OPEV heartbeat received from the HEMS
      operationId: getLastHeartbeatData
      description: >-
        Reads the DeviceDiagnosisHeartbeatData last received from the CEM/HEMS over
        the OPEV connection. Requires: the EV must be connected to an EVSE, a CEM
        entity must be visible on that EVSE's paired device, and the EV's OPEV
        handler must be running (400/500 otherwise — see responses).
      parameters:
        - $ref: "#/components/parameters/EvIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatData"
        '400':
          description: Invalid ID number, or the EV is not connected to an EVSE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
        '500':
          description: >-
            No CEM entity paired, OPEV is not available, or the received heartbeat
            data is incomplete/invalid
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /ev/{evId}/HEMSState:
    get:
      tags:
        - EV
      summary: Get the HEMS operating state as seen by this EV
      operationId: getHEMSState
      description: >-
        Reads the DeviceDiagnosisStateData the CEM/HEMS last reported over the
        OPEV connection — the HEMS's own operating state and last error code, from
        this EV's point of view. Requires: the EV must be connected to an EVSE, a
        CEM entity must be visible on that EVSE's paired device, and the EV's OPEV
