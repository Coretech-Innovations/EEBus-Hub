          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /heatpump/{heatPumpId}/qr-code:
    get:
      tags:
        - Heat Pump
      summary: Get SHIP QR-pairing data for the heat pump
      operationId: getHeatPumpQRPair
      description: >-
        Returns the SHIP QR-code pairing text for the heat pump's own EEBUS
        service. Requires: the heat pump's service must already be running
        (started via `POST /heatpump/{heatPumpId}/trust` or otherwise) — 400
        ("service not initialized") otherwise. A malformed `heatPumpId`, and a
        `heatPumpId` resolving to a non-heat-pump entity, both return 400; 404 is
        reserved for a `heatPumpId` that resolves to no entity at all.
      parameters:
        - name: heatPumpId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRPairDataResponse"
        '400':
          $ref: "#/components/responses/InvalidIdBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HeatPumpNotFound"
  /inverter/add:
    post:
      tags:
      - Inverter
      summary: Create a simulated Inverter entity
      operationId: addInverter
      description: 'Creates an Inverter (dual-role controllable system: LPC consumer + LPP producer) with
        an optional battery and/or PV string sub-device — see `BatteryInfo`/`PVStringInfo` and `POST /inverter/{inverterId}/battery`
        / `.../pvstring` for managing them afterwards.


        Requires: the simulation must not be running (400). `lpcCS` and `lppCS` are both required in the
        body (400 if either is missing/null) — an inverter without both controllable-system configs cannot
        be created via this endpoint. `deviceName` must be unique across all inverters, and the (vendorCode,
        serialNumber, deviceModel) triple must be unique — either collision is 400. `deviceCode`, `serialNumber`,
        `vendor.code`, `vendor.name` and `inverterType` must also be non-empty; battery/PV numeric fields
        (if present) must be non-negative and `batteryInfo.initialStateOfChargeInPercent` must be 0..100
        (400 with a per-field boolean map — see `validateInverterInfo` — otherwise).


        `lpcEnabled`/`lppEnabled`/`cobEnabled`/`moiEnabled`/`mobEnabled` and `mpcEnabled` in the body are
        ignored — the server always overwrites them from the license/feature configuration, same as `brandName`
        (always "Coretech-Innovations") and `gridCode` (always "VDE-AR-N 4105:2018"). `lpcCS.contractualPowerMax`/`lppCS.contractualPowerMax`
        are also cleared before validation (not settable at creation).'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InverterInfo'
            example:
              deviceName: SimulatedInverter
              deviceCode: INV-1
              serialNumber: '20001'
              vendor:
                code: SIMINV
                name: Coretech-Innovations
              inverterType: HybridInverter
              lpcCS:
                failsafeValue: 0
                failsafeDuration: 2
                failSafeDurationMax: 24
                nominalPower:
                  min: 0
                  max: 8000
                nominalCurrent:
                  min: 0
                  max: 16
              lppCS:
                failsafeValue: 0
                failsafeDuration: 2
                failSafeDurationMax: 24
                nominalPower:
                  min: 0
                  max: 8000
                nominalCurrent:
                  min: 0
                  max: 16
              brandName: Coretech-Innovations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: integer
                    description: Engine entity ID of the new inverter
        '400':
          description: The simulation is running, lpcCS/lppCS is missing, deviceName or (vendorCode, serialNumber,
            deviceModel) already exists, a field failed validation (per-field map), or the entity could
            not be constructed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /inverter/list:
    get:
      tags:
        - Inverter
      summary: List all inverters
      operationId: listInverters
      description: >-
        One entry per inverter with its config, SKI, device address, HEMS-connection
        state and both controllable systems' live FSM states. Empty array if none exist.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InverterControlBlock"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /inverter/{inverterId}:
    patch:
      tags:
      - Inverter
      summary: Update an inverter's configuration
      operationId: updateInverter
      description: 'Partial update: the current config is read, the JSON body is bound on top of it (so
        omitted fields keep their previous value — unlike a strict PATCH-merge, arrays/objects present in
        the body fully replace their old value), then re-validated with the same rules as `POST /inverter/add`.
        `brandName` cannot be changed (restored from the old config before comparing/applying); `lpcCS.contractualPowerMax`/`lppCS.contractualPowerMax`
        are cleared the same way as on creation. If the resulting config is byte-identical to the old one,
        the endpoint still returns 200 with `changes`/`new`/`old` but applies nothing. Device identity fields
        (deviceName/deviceCode/serialNumber/vendor/etc.) are only actually pushed into the running EEBUS
        service if the service has not started yet — see `SetNewConfiguration`; renaming a paired inverter
        takes effect in the API response but not on the wire until it is deleted and re-added.'
      parameters:
      - $ref: '#/components/parameters/InverterIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InverterInfo'
      responses:
        '200':
          description: The applied (or no-op) change
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: object
                    description: Raw JSON body as submitted, before validation/merging
                  new:
                    $ref: '#/components/schemas/InverterInfo'
                  old:
                    $ref: '#/components/schemas/InverterInfo'
        '400':
          description: 'Rejected before anything changed, and nothing is applied: a malformed body, a field
            that failed validation, or a field this route refuses to change. Every failed field is reported
            in one response. Covers heartbeatTimeoutInSeconds set to an explicit `0` or outside the supported
            range 2..86400, and inverterType when it differs from the current value - the type follows the
            battery and PV string attached at creation and cannot be changed afterwards, though repeating
            the current value is accepted. An omitted field, or an explicit `null`, keeps the current value.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/statusError'
                - $ref: '#/components/schemas/FieldValidationError'
                - $ref: '#/components/schemas/FieldRejectionError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/InverterNotFound'
        '409':
          description: The field can only be changed while the device is stopped (heartbeatTimeoutInSeconds
            is handed to the EEBUS service at setup).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRejectionError'
    delete:
      tags:
      - Inverter
      summary: Delete an inverter
      operationId: deleteInverter
      description: 'Tears down the inverter''s EEBUS service (untrusting every paired remote first), disconnects
        it from the simulated grid bus, and removes it from the engine.


        Requires: the simulation must not be running (400), and no compliance test run may be active unless
        the request carries a valid X-EEBUS-Internal-Test-Token header (409 otherwise).'
      parameters:
      - $ref: '#/components/parameters/InverterIdParam'
      - name: X-EEBUS-Internal-Test-Token
        in: header
        required: false
        description: Internal token used by test automation to bypass the active-test-run block.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: Invalid ID, or the simulation is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/InverterNotFound'
        '409':
          description: Blocked because a compliance test run is active and the request did not carry a valid
            X-EEBUS-Internal-Test-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /inverter/{inverterId}/trust:
    post:
      tags:
        - Inverter
      summary: Trust a remote device / start pairing for this inverter
      operationId: inverterTrustDevice
      description: >-
        Registers `remoteSki` as trusted for SHIP pairing on this inverter. If the
        inverter's EEBUS service has not started yet (empty local SKI) it is started
        (`Run()`) first, as part of the same call, and the SKI is registered either way —
        so the first trust call on a freshly created inverter both boots the service and
        establishes the trust edge. `remoteSki` is required and normalized.


        Requires: the simulation must not be in the brief transitional "stopping" window
        after `POST /sim` `action: stop` (`Engine.isAllowedToPairDevices` — despite its
        name this is **not** "the simulation must be running": it also returns true while
        the simulation has never been started, or is fully stopped; only the few seconds
        while a Stop() teardown is in flight return false). 400 "Simulation not running"
        otherwise (the error message is misleading given the actual condition).
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustDeviceRequest"
            example:
              remoteSki: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
      responses:
        '200':
          description: >-
            ski is the inverter's own local SKI — on the first call (service just
            started) this is the newly generated SKI; remoteSki is not echoed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ski:
                    type: string
        '400':
          description: Invalid (empty after normalization) SKI, or the simulation is mid-teardown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
        '500':
          description: The inverter's EEBUS service failed to start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - Inverter
      summary: Untrust a remote device from this inverter
      operationId: inverterUntrustDevice
      description: Disconnects (if connected) and unregisters remoteSki. Does not require the simulation to be running.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustDeviceRequest"
            example:
              remoteSki: 6ea57f6e6e6b41ff389a0aa64f8e648fd39fd936
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: Invalid (empty after normalization) SKI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/lpcCurrentState:
    get:
      tags:
        - Inverter
      summary: Get the inverter's LPC (consumption) controllable-system state
      operationId: getInverterLpcCurrentState
      description: >-
        The inverter is a dual-role controllable system: this reports the consumption
        (LPC) side's live FSM state; see `GET .../lppCurrentState` for the production
        (LPP) side. See `CSState` for what each of the five values means. Note: on
        this route (and every other simple GET below down to electricalMeasurements),
        a resolved-but-wrong-type entity ID returns 400 "Failed to get inverter
        entity", not 404 — 404 is reserved for an ID that does not exist in the engine
        at all. This differs from the newer `resolveInverter`-based endpoints further
        down this tag (battery/pvstring/mode/values/forceState), which return 404 for
        both cases.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentState:
                    $ref: "#/components/schemas/CSState"
        '400':
          $ref: "#/components/responses/InvalidIdBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/lppCurrentState:
    get:
      tags:
        - Inverter
      summary: Get the inverter's LPP (production) controllable-system state
      operationId: getInverterLppCurrentState
      description: The production-side counterpart of GET .../lpcCurrentState. See CSState for what each value means.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentState:
                    $ref: "#/components/schemas/CSState"
        '400':
          $ref: "#/components/responses/InvalidIdBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/lpcActivePowerLimit:
    get:
      tags:
        - Inverter
      summary: Get the Active Power Consumption Limit (APCL) currently in force on this inverter
      operationId: getInverterLpcActivePowerLimit
      description: >-
        Reads the inverter's own LPC controllable-system state directly (not a value
        sent by a remote HEMS/ControlBox — this is what the inverter itself currently
        reports/enforces). 400 if the inverter has no LPC controllable system
        configured ("no LPC supported") — in practice unreachable since
        `POST /inverter/add` requires `lpcCS`.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  result:
                    $ref: "#/components/schemas/lpcAPCL"
        '400':
          description: Invalid ID, wrong entity type, or the inverter has no LPC controllable system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/InverterNotFound"
  /inverter/{inverterId}/lppActivePowerLimit:
    get:
      tags:
        - Inverter
      summary: Get the Active Power Production Limit (APPL) currently in force on this inverter
      operationId: getInverterLppActivePowerLimit
      description: >-
        Production-side counterpart of GET .../lpcActivePowerLimit. 400 if the
        inverter has no LPP controllable system configured ("no LPP supported") — in
        practice unreachable since POST /inverter/add requires lppCS.
      parameters:
        - $ref: "#/components/parameters/InverterIdParam"
      responses:
        '200':
          description: Successful response
