    EvIdParam:
      name: evId
      in: path
      schema:
        type: integer
      required: true
      example: 1
    HeatPumpIdParam:
      name: heatPumpId
      in: path
      required: true
      schema:
        type: integer
      example: 1
    InverterIdParam:
      name: inverterId
      in: path
      schema:
        type: integer
      required: true
      example: 1
    DeviceAddressParam:
      name: deviceAddress
      in: path
      schema:
        type: string
      required: true
    RealDeviceTypeParam:
      name: deviceType
      in: path
      required: true
      description: >-
        One of the 14 SPINE device types accepted by
        `RealDevicesHandler.ValidateDeviceType` (internal/realDevices.go). Any other
        value is rejected with 400 ("invalid device type").
      schema:
        type: string
        enum:
          - ChargingStation
          - Dishwasher
          - Dryer
          - ElectricitySupplySystem
          - EnergyManagementSystem
          - EnvironmentSensor
          - Generic
          - HVACController
          - HeatGenerationSystem
          - HeatSinkSystem
          - HeatStorageSystem
          - Inverter
          - SubMeter
          - Washer
      example: ChargingStation
  schemas:
    TrustDeviceRequest:
      type: object
      properties:
        remoteSki:
          type: string
          description: Normalized (case/format) before use; empty after normalization is rejected with 400.
    HeartbeatWrapperWithExample:
      type: object
      properties:
        status:
          type: string
          example: OK
        result:
          $ref: '#/components/schemas/HeartbeatData'
    HeartbeatWrapper:
      type: object
      properties:
        status:
          type: string
        result:
          $ref: '#/components/schemas/HeartbeatData'
    APCLDataSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: >-
            true only if every targeted device accepted the write (for the
            all-devices endpoints) or the single targeted device accepted it (for
            the /{deviceAddress} endpoints)
        data:
          $ref: '#/components/schemas/lpcAPCL'
          description: Echo of the request body actually sent (isLimitChangeable cleared)
        reason:
          type: string
          description: >-
            Rejection reason(s) when success is false — one device's description
            for the /{deviceAddress} endpoint, or all rejected devices' descriptions
            joined with ", " for the all-devices endpoint. Omitted (empty) when
            success is true and at least one device was targeted. Exception: the
            all-devices endpoint reports success=true with reason="No entities
            found" when no LPC controllable-system devices are connected at all.
    FCAPLDataSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: >-
            true only if every targeted device accepted the write (for the
            all-devices endpoints) or the single targeted device accepted it (for
            the /{deviceAddress} endpoints)
        data:
          $ref: '#/components/schemas/FCAPL'
          description: Echo of the request body actually sent (isValueChangeable/isDurationChangeable cleared)
        reason:
          type: string
          description: >-
            Rejection reason(s) when success is false — one device's description
            for the /{deviceAddress} endpoint, or all rejected devices' descriptions
            joined with ", " for the all-devices endpoint. Omitted (empty) when
            success is true. Note: the all-devices endpoint reports success=false
            with reason="No entities found" when no LPC controllable-system devices
            are connected at all (unlike the APCL bulk endpoint, which reports
            success=true for that same case).
    APPLDataSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: >-
            true only if every targeted device accepted the write (for the
            all-devices endpoints) or the single targeted device accepted it (for
            the /{deviceAddress} endpoints)
        data:
          $ref: '#/components/schemas/lppAPPL'
          description: Echo of the request body actually sent (isLimitChangeable cleared)
        reason:
          type: string
          description: >-
            Rejection reason(s) when success is false — one device's description
            for the /{deviceAddress} endpoint, or all rejected devices' descriptions
            joined with ", " for the all-devices endpoint. Omitted (empty) when
            success is true and at least one device was targeted. Exception: the
            all-devices endpoint reports success=true with reason="No entities
            found" when no LPP controllable-system devices are connected at all.
    FSAPPLDataSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: >-
            true only if every targeted device accepted the write (for the
            all-devices endpoints) or the single targeted device accepted it (for
            the /{deviceAddress} endpoints)
        data:
          $ref: '#/components/schemas/lppFSAPPL'
          description: Echo of the request body actually sent (isValueChangeable/isDurationChangeable cleared)
        reason:
          type: string
          description: >-
            Rejection reason(s) when success is false — one device's description
            for the /{deviceAddress} endpoint, or all rejected devices' descriptions
            joined with ", " for the all-devices endpoint. Omitted (empty) when
            success is true. Note: the all-devices endpoint reports success=false
            with reason="No entities found" when no LPP controllable-system devices
            are connected at all (unlike the APPL bulk endpoint, which reports
            success=true for that same case).
    ControlBoxAPCLSuccessResponse:
      title: ControlBox APCL write outcome
      type: object
      properties:
        success:
          type: boolean
          description: >-
            true only if every targeted device accepted the write (all-devices
            endpoints) or the single targeted device accepted it (/{deviceAddress}
            endpoints). Differs from the HEMS equivalent (APCLDataSuccessResponse):
            when the all-devices endpoint finds zero connected LPC devices, the
            ControlBox reports success=**false** (HEMS reports true for that same
            vacuous case) — verified against ControlBox.SendLpcApclToAllDevices,
            which returns `false, "No entities found"` when totalEntities is 0.
        data:
          $ref: '#/components/schemas/lpcAPCL'
          description: Echo of the request body actually sent (isLimitChangeable cleared)
        reason:
          type: string
          description: >-
            Rejection reason(s) when success is false — one device's description for
            the /{deviceAddress} endpoint, or all rejected devices' descriptions
            joined with ", " for the all-devices endpoint; "No entities found" when
            no LPC controllable-system devices are connected at all.
    ControlBoxFCAPLSuccessResponse:
      title: ControlBox FCAPL / failsafe-duration write outcome
      description: >-
        Also the exact response shape of POST /controlbox/FailsafeDurationForLpc{,
        /{deviceAddress}} — those two endpoints build this same struct (only
        durationSeconds populated, value cleared), not a generic object.
      type: object
      properties:
        success:
          type: boolean
          description: >-
            true only if every targeted device accepted the write (all-devices
            endpoints) or the single targeted device accepted it
            (/{deviceAddress} endpoints). The all-devices endpoint reports
            success=false with reason="No entities found" when no LPC
            controllable-system devices are connected at all (same as HEMS).
        data:
          $ref: '#/components/schemas/FCAPL'
          description: Echo of the request body actually sent (isValueChangeable/isDurationChangeable cleared)
        reason:
          type: string
          description: >-
            Rejection reason(s) when success is false — one device's description for
            the /{deviceAddress} endpoint, or all rejected devices' descriptions
            joined with ", " for the all-devices endpoint.
    ControlBoxAPPLSuccessResponse:
      title: ControlBox APPL write outcome
      type: object
      properties:
        success:
          type: boolean
          description: >-
            true only if every targeted device accepted the write (all-devices
            endpoints) or the single targeted device accepted it (/{deviceAddress}
            endpoints). Differs from the HEMS equivalent (APPLDataSuccessResponse):
            when the all-devices endpoint finds zero connected LPP devices, the
            ControlBox reports success=**false** (HEMS reports true) — verified
            against ControlBox.SendLppApplToAllDevices, which returns
            `false, "No entities found"` when totalEntities is 0.
        data:
          $ref: '#/components/schemas/lppAPPL'
          description: Echo of the request body actually sent (isLimitChangeable cleared)
        reason:
          type: string
          description: >-
            Rejection reason(s) when success is false — one device's description for
            the /{deviceAddress} endpoint, or all rejected devices' descriptions
            joined with ", " for the all-devices endpoint; "No entities found" when
            no LPP controllable-system devices are connected at all.
    ControlBoxFSAPPLSuccessResponse:
      title: ControlBox FSAPPL / failsafe-duration write outcome
      description: >-
        Also the exact response shape of POST /controlbox/FailsafeDurationForLpp{,
        /{deviceAddress}} — those two endpoints build this same struct (only
        durationSeconds populated, value cleared), not a generic object.
      type: object
      properties:
        success:
          type: boolean
          description: >-
            true only if every targeted device accepted the write (all-devices
            endpoints) or the single targeted device accepted it
            (/{deviceAddress} endpoints). The all-devices endpoint reports
            success=false with reason="No entities found" when no LPP
            controllable-system devices are connected at all (same as HEMS).
        data:
          $ref: '#/components/schemas/lppFSAPPL'
          description: Echo of the request body actually sent (isValueChangeable/isDurationChangeable cleared)
        reason:
          type: string
          description: >-
            Rejection reason(s) when success is false — one device's description for
            the /{deviceAddress} endpoint, or all rejected devices' descriptions
            joined with ", " for the all-devices endpoint.
    LpcDeviceDataArrayResponse:
      type: array
      items:
        $ref: '#/components/schemas/LpcDeviceData'
    LppDeviceDataArrayResponse:
      type: array
      items:
        $ref: '#/components/schemas/LppDeviceData'
    QRPairDataResponse:
      type: object
      properties:
        data:
          type: string
          description: QR code text
    TrustPeerRef:
      type: object
      description: >-
        Identifies one endpoint of a trust connection. Exactly one of `id` or
        `ski` must be set. `id` references a simulated entity by its engine id
        (its SKI is resolved when the simulation starts); `ski` references a real
        device by its 40-character SKI.
      properties:
        id:
          type: integer
          format: uint
          description: Engine id of a simulated entity (mutually exclusive with `ski`).
        ski:
          type: string
          description: SKI of a real device (mutually exclusive with `id`).
    TrustEdge:
      type: object
      description: An undirected mutual-trust connection between two peers.
      required:
        - a
        - b
      properties:
        a:
          $ref: "#/components/schemas/TrustPeerRef"
        b:
          $ref: "#/components/schemas/TrustPeerRef"
    TrustEdgeStatus:
      description: >-
        A mutual-trust connection annotated with its live connection state.
        `established` is true only while the simulation is running and the
        underlying SHIP connection is up; a configured-but-not-started topology
        reports `established: false` for every edge.
      allOf:
        - $ref: "#/components/schemas/TrustEdge"
        - type: object
          required:
            - established
          properties:
            established:
              type: boolean
              description: >-
                Whether the SHIP connection for this edge is currently
                established.
    analyzerError:
      title: Analyzer error envelope
      type: object
      description: >-
        Error shape returned by every /analyzer/* handler, including the
        license-gate 403. Distinct from the hub-wide `statusError` schema,
        which uses the key `err` instead of `error`.
      properties:
        error:
          type: string
    AnalyzerHealth:
      type: object
      properties:
        enabled:
          type: boolean
        capturing:
          type: boolean
          description: Whether event capture is currently active. When false, no events reach the ring buffer, SQLite writer, or SSE hub.
        manualCapture:
          type: boolean
          description: Whether manual-capture mode is active. When true, capture does not auto-start with the hub and must be started explicitly; when false (default), capture auto-starts.
        droppedTotal:
          type: integer
          format: int64
        sessionId:
          type: string
        ringEntries:
          type: integer
    AnalyzerSession:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [live, imported], description: "live: still capturing traffic from a running hub. imported: loaded from a file, capture already complete." }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        eventCount: { type: integer, format: int64 }
        violationCount: { type: integer, format: int64 }
    AnalyzerEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: string }
        ts: { type: string, format: date-time }
        monoNs: { type: integer, format: int64 }
        kind:
          type: string
          description: >-
            Event category: ship.frame (raw SHIP wire frame), ship.lifecycle
            (SHIP connection state change), spine.message (a SPINE
            request/reply), spine.subscription/spine.binding (subscription or
            binding lifecycle), spine.entity/spine.device (entity or device
            appearing/disappearing), spine.usecase (use-case detection),
            analyzer.dropped (an event the analyzer could not decode),
            analyzer.violation (a rule-engine finding).
          enum: [ship.frame, ship.lifecycle, spine.message, spine.subscription, spine.binding, spine.entity, spine.device, spine.usecase, analyzer.dropped, analyzer.violation]
        direction: { type: string, enum: [Send, Recv, NA], description: "Message direction relative to this hub: Send, Recv, or NA when direction does not apply to this event kind." }
        ski: { type: string }
        actor: { type: string }
        frame:
          type: object
          properties:
            init: { type: boolean }
            msgType: { type: string }
        spine:
          type: object
          properties:
            cmdClassifier: { type: string, enum: [read, reply, write, call, notify, result], description: "SPINE command classifier carried by this message." }
            functionSet: { type: string }
            msgCounter: { type: integer, format: int64 }
            msgCounterRef: { type: integer, format: int64 }
            ackRequest: { type: boolean }
            sourceDevice: { type: string }
            destDevice: { type: string }
        decoded: { type: object }
    AnalyzerLifecycleStep:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [pass, fail, partial, pending, na], description: "pass/fail: step fully completed or failed. partial: some but not all of the step's evidence was observed. pending: not yet observed. na: not applicable to this device." }
        details: { type: string }
    AnalyzerUseCaseLifecycle:
      type: object
      properties:
        deviceAddr: { type: string }
        actor: { type: string }
        useCaseAbbr: { type: string }
        useCaseName: { type: string }
        available: { type: boolean }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AnalyzerLifecycleStep"
        overallStatus: { type: string, enum: [pass, fail, partial, pending, na], description: "Worst status across all of this use case's lifecycle steps (see AnalyzerLifecycleStep.status)." }
    simulationParameters:
      title: POST /sim request body
      type: object
      properties:
        action:
          type: string
          description: >-
            start: begin ticking the simulation. stop: pause it. reset: tear
            down every simulated entity and rebuild a fresh default HEMS.
            cfgreset: restore every existing entity to its initial configuration
            without deleting any of them.
          enum:
            - start
            - stop
            - reset
            - cfgreset
        speedFactor:
          type: number
          format: double
          description: >-
            Only meaningful for action=start. Simulated seconds per real second.
            Values less than 1 (or omitted/0) are coerced to 1; also forced to 1
            if no CEM/HEMS entity exists yet.
          x-unit: s(simulated)/s(real)
    simulationResponseOk:
      title: response ok for simulation actions
      type: object
      properties:
        status:
          type: string
          example: "OK"
        request:
          type: object
          description: Echoes the request that was applied.
          properties:
            action:
              type: string
              description: See the `action` enum on the request schema (simulationParameters) for what each value does.
              enum: [start, stop, reset, cfgreset]
            speedFactor:
              type: number
              format: double
    simulationResponseBadRequest:
      title: response bad request for simulation action
      type: object
      properties:
        status:
          type: string
          example: "error"
        err:
          type: string
        request:
          type: object
          description: Present for the "unknown action" and fuse-limit-exceeded cases; absent for a failed cfgreset.
          properties:
            action:
              type: string
            speedFactor:
              type: number
    simulationStatus:
      title: state of simulation
      type: object
      properties:
        state:
          type: string
          description: "running: the tick loop is active. stopped: it is paused/not started."
          enum: [running, stopped]
        speedFactor:
          type: number
          format: double
          description: Currently configured simulated seconds per real second.
          x-unit: s(simulated)/s(real)
        elapsedTime:
          type: integer
          description: Simulated time elapsed since the simulation was last started, in whole minutes (truncated).
          x-unit: min
    EVConfig:
      title: possible parameters for new EV
      type: object
      description: No field validation is performed by POST /ev/add or PATCH /ev/{evId} beyond the OSCEV checks
        called out on those operations — a malformed or empty body is accepted, and every field below (including
        the enums) is advisory only, not enforced server-side.
      properties:
        dischargingEnable:
          type: boolean
        chargingEnable:
          type: boolean
        communicationStandard:
          type: string
          description: ISO 15118 edition 1 or edition 2 (both PLC-based), or ISO 61851 (PWM/analog signaling
            only, no data channel). The Go field is a plain string with no omitempty, so an EV that has not
            reported yet serialises as "" rather than being absent.
          enum:
          - ''
          - iso15118-2ed1
          - iso15118-2ed2
          - iso61851
        asymmetricCharging:
          type: boolean
        identification:
          type: object
          properties:
            type:
              type: string
              description: 'Identifier length: eui64 (8-byte EUI-64) or eui48 (6-byte EUI-48/MAC-48). The
                Go field is a plain string with no omitempty, so an EV that has not reported yet serialises
                as "" rather than being absent.'
              enum:
              - ''
              - eui64
              - eui48
            value:
              type: string
        device:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
            serialNumber:
              type: string
            softwareRev:
              type: string
            hardwareRev:
              type: string
            vendor:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
            brandName:
              type: string
            manufacturer:
              type: object
              properties:
                label:
                  type: string
                description:
                  type: string
            powerLimitsRange:
              type: object
              properties:
                min:
                  type: integer
                max:
                  type: integer
                scale:
                  type: integer
            powerLimitsValue:
              type: object
              properties:
                min:
                  type: integer
                max:
                  type: integer
                scale:
                  type: integer
        currentLimits:
          type: object
          properties:
            min:
              type: integer
              x-unit: A
              description: Minimum charging current.
            max:
              type: integer
              x-unit: A
              description: Maximum charging current. (This field's description previously read "initial charged
                percentage" — copy/paste error; the actual field for that is top-level `charged`.)
        oscevEnabled:
          type: boolean
          description: OSCEV use case enabled. Overridden by the server from the configured license/use-case
            toggle on POST /ev/add; the submitted value is ignored there. Settable as submitted on PATCH /ev/{evId}.
        oscevPVChargeMode:
          $ref: '#/components/schemas/OscevPVChargeMode'
        oscevSurplusWithThresholdSupported:
          type: boolean
          description: Immutable after creation — PATCH /ev/{evId} rejects any request that includes this
            key.
        oscevSurplusThresholdInWatts:
          type: number
          format: double
          x-unit: W
          description: Must be non-negative when present; must be unset if threshold support is disabled.
        oscevStartDelayInSeconds:
          type: integer
          x-unit: s
          description: Must be non-negative when present.
        oscevStopDelayInSeconds:
          type: integer
          x-unit: s
          description: Must be non-negative when present.
        imgBase64:
          type: string
          description: Base64 encoded image
        chargingCapacity:
          type: number
          x-unit: kWh
          description: battery capacity
        charged:
          type: number
          x-unit: '%'
          description: initial charged percentage (0-100)
        batteryHealth:
          type: number
          x-unit: '%'
          description: battery health percentage (0-100)
        operatingState:
          type: string
          description: SPINE DeviceDiagnosis operating state — normalOperation, or failure when the device
            reports an error condition. The Go field is a plain string with no omitempty, so an EV that has
            not reported yet serialises as "" rather than being absent.
          enum:
          - ''
          - normalOperation
          - failure
        opevEnabled:
          type: boolean
          description: OPEV use case enabled. Overridden by the server from the configured license/use-case
            toggle on POST /ev/add; the submitted value is ignored there. Settable as submitted on PATCH /ev/{evId}.
        evsocEnabled:
          type: boolean
          description: EVSOC use case enabled. Overridden by the server from the configured license/use-case
            toggle on POST /ev/add; the submitted value is ignored there. Settable as submitted on PATCH /ev/{evId}.
        dischargeCurrent:
          type: integer
          x-unit: A
          description: discharge current
    Image:
      type: object
      properties:
        image:
          type: string
          description: Base64 encoded image
    EVSEConfig:
      title: possible parameters for EVSE Configuration
      type: object
      description: Used both by POST /evse/add (create) and PATCH /evse/{evseId} (update); a few fields behave
        differently between the two — see each field's description.
      properties:
        trustConnections:
          type: array
          description: Optional peers to mutually trust once the simulation starts. Only honored by POST /evse/add
            — PATCH /evse/{evseId} silently ignores this field if present.
          items:
            $ref: '#/components/schemas/TrustPeerRef'
        deviceName:
          type: string
          description: Required, non-empty. Must be unique across all EVSEs (create and update both reject
            a duplicate deviceName with 400).
        deviceCode:
          type: string
          description: Required, non-empty.
        serialNumber:
          type: string
          description: Required, non-empty. The (vendor.code, serialNumber, deviceModel) triple must be unique
            across all EVSEs (create and update both reject a duplicate combination with 400, reported as
            "Device address already exists").
        softwareRev:
          type: string
        hardwareRev:
          type: string
        vendor:
          type: object
          properties:
            name:
              type: string
              description: Required, non-empty.
            code:
              type: string
              description: Required, non-empty. Part of the device-address uniqueness triple.
        brandName:
          type: string
          description: 'Required, non-empty, to pass validation — but the value submitted has no effect: on
            create the server always overwrites it with "Coretech-Innovations", and on update the server always
            restores the EVSE''s existing brandName, discarding whatever is submitted.'
        manufacturer:
          type: object
          properties:
            label:
              type: string
            description:
              type: string
        deviceModel:
          type: string
          description: Part of the device-address uniqueness triple.
        imgBase64:
          type: string
        evseccEnabled:
          type: boolean
          description: EVSECC use case enabled. On create only, overridden by the server from the configured
            license/use-case toggle if one is set — the submitted value is ignored in that case. On update
            the submitted value is applied as-is.
        mpcEnabled:
          type: boolean
          description: MPC use case enabled. On create, always overridden by the server from the configured
            license/use-case toggle. On update the submitted value is applied as-is.
        lpcEnabled:
          type: boolean
          description: LPC use case enabled. On create only, overridden by the server from the configured
            license/use-case toggle if one is set. On update the submitted value is applied as-is.
        failsafeValue:
          type: number
          format: double
          x-unit: W
          description: Failsafe power limit value. Must be >= 0.
        failsafeDuration:
          type: number
          format: double
          x-unit: h
          description: Failsafe duration. Must be between 2 and 24 hours inclusive.
        failSafeDurationMax:
          type: number
          format: double
          x-unit: h
          description: Maximum failsafe duration. Must be between 2 and 24 hours inclusive.
        nominalPower:
          type: object
          description: Required (a missing object fails validation as if min/max were 0).
          properties:
            min:
              type: number
              format: double
              x-unit: W
              description: Must be >= 0 and strictly less than nominalPower.max.
            max:
              type: number
              format: double
              x-unit: W
              description: Must be >= 0 and strictly greater than nominalCurrent.min.
        contractualPowerMax:
          type: number
          format: double
          x-unit: W
          nullable: true
          description: Read-only from this API's perspective — always cleared to null by the server on both
            create and update, regardless of what is submitted.
        nominalCurrent:
          type: object
          description: Required (a missing object fails validation as if min/max were 0).
          properties:
            min:
              type: number
              format: double
              x-unit: A
              description: Must be >= 0 and strictly less than nominalPower.max (not nominalCurrent.max —
                verified in code, likely unintentional).
            max:
              type: number
              format: double
              x-unit: A
              description: Must be >= 0 and strictly greater than nominalCurrent.min.
        approveWriteLimit:
          type: boolean
          description: Whether to approve write limit operations
        heartbeatTimeoutInSeconds:
          type: integer
          format: int64
          minimum: 2
          maximum: 86400
          description: 'SPINE heartbeat timeout advertised to peers, in seconds. Optional: when the field
            is omitted the device type''s default applies - 4 for EVSE, heat pump and HEMS, 60 for inverter
            and control box. An explicit 0, or a value outside 2..86400, is rejected with 400; the lower bound
            exists because SPINE only applies its 2 s transmit margin above 2 s, the upper bound because the
            value is converted to a duration. The timeout is handed to the eebus service at setup, so it can
            only be changed while that service does not exist yet; a change after the device is started is
            rejected with 409.'
    ExtDeviceConfig:
      title: Registered external (real) HEMS, as returned by GET /hemsExt
      type: object
      properties:
        remoteSKI:
          type: string
          description: SKI of the registered real HEMS/CEM
        imgBase64:
          type: string
          description: Base64-encoded image for the real HEMS, if one was set
        deviceName:
          type: string
    ErrorState:
      title: error state parameters
      type: object
      description: >-
        The body of the setErrorState endpoints. operatingState is accepted but
        currently ignored by every consumer — the device is always driven into
        DeviceDiagnosisOperatingStateType "failure" regardless of what (if
        anything) is submitted here; only lastErrorCode is actually applied.
      properties:
        operatingState:
          type: string
          description: Accepted but ignored — see the schema description.
        lastErrorCode:
          type: string
          description: string to represent error code
    HEMSConfig:
      title: HEMS Configuration parameters
