  /heatpump/{heatPumpId}/trust:
    post:
      tags:
        - Heat Pump
      summary: Trust a remote device from the heat pump side (imperative SKI pairing)
      operationId: heatPumpTrustDevice
      description: >-
        Registers `remoteSki` as trusted for pairing on this heat pump's own SHIP
        service, starting that service first if it has not run yet. This is the
        imperative, one-shot counterpart to the declarative `POST /trust` /
        `trustConnections` mechanism (see `GET /trust`): it acts on a single,
        already-identified entity immediately, rather than recording a desired
        relationship the engine re-applies on every `POST /sim` start. This is one
        half of mutual trust — the peer (e.g. the HEMS/CEM) must also trust this
        heat pump's SKI (`ski` in the response, or `GetHeatPump`'s `ski` field) on
        its own side for pairing to actually complete.


        Requires: the simulation must not be in the brief transitional "stopping"
        window after `POST /sim` `action: stop` is called (`Engine.isAllowedToPairDevices`
        — despite its name this is **not** "simulation must be running": it also
        returns true while the simulation has never been started, or is fully
        stopped; only the few seconds while a Stop() teardown is in flight return
        false). 400 "Simulation not running" otherwise (the error message is
        misleading given the actual condition).


        If starting the heat pump's EEBUS service fails (`hpEntity.Run()` returns an
        error, attempted only when the local SKI is not yet set), the call is a 500
        and no SKI is registered.
      parameters:
        - $ref: "#/components/parameters/HeatPumpIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remoteSki:
                  type: string
                  description: Normalized (colons/case) before use; empty after normalization is rejected with 400.
                  example: d:_i:19667_Elli-123456
      responses:
        '200':
          description: >-
            Pairing registered. `ski` is this heat pump's own local SKI (started as
            part of this call if it was not already running) — share it with the
            peer so it can trust this device back.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  ski:
                    type: string
        '400':
          description: Empty/invalid remote SKI, or the simulation is in the brief "stopping" window (see description).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HeatPumpNotFound"
        '500':
          description: >-
            Failed to start the heat pump's EEBUS service — see the known handler
            bug noted above; the response actually observed may be the subsequent
            200 instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /heatpump/{heatPumpId}/lpcCurrentState:
