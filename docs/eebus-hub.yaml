        ski:
          type: string
          description: SKI of the real (paired) device to fetch cached data for
        reqData:
          type: string
          description: Which cached dataset to return
          enum:
          - evseManufacturerData
          - currentLimits
          - currentMeasurements
          - meterMeasurements
          - evseFailsafeValues
    HeartbeatAction:
      title: possible actions to start and stop Heartbeat
      type: object
      properties:
        action:
          type: string
          description: start begins the heartbeat, stop ends it.
          enum:
            - start
            - stop

    ThreePhaseDevice:
      title: Uncontrollable device configuration (three-phase current draw)
      description: >-
        `api.UncontrollableDevice`. There is no distinct Go type for a single-phase
        device — `SinglePhaseDevice` is the same shape with `current.b`/`current.c`
        omitted (they default to 0 A, so the device draws current on phase A only).
      type: object
      properties:
        deviceName:
          type: string
          description: Defaults to "my device" if omitted/empty on create.
        current:
          type: object
          description: >-
            Per-phase current draw while the device is powered on
            (`powerStateOn: true`). Counted against the simulation's fuse limit —
            see the description of `powerStateOn` below and `POST /sim`.
          properties:
            a:
              type: number
              x-unit: A
              minimum: 0
            b:
              type: number
              x-unit: A
              minimum: 0
            c:
              type: number
              x-unit: A
              minimum: 0
        powerFactor:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Unitless, (0, 1]. A value outside this range (including 0 or negative)
            is silently replaced with 1.0 rather than rejected.
        powerStateOn:
          type: boolean
          description: >-
            Whether the device is drawing current. While true, `current` is summed
            into the simulation's per-phase total on every engine tick and checked
            against the EnergyMeter's fuse limit both continuously
            (`Engine.validateTotalCurrents`, which stops the simulation if exceeded)
            and up front on `POST /sim` with `action: start` (which instead rejects
            the start with 400 if the uncontrollable-device total alone already
            exceeds the limit).
        imgBase64:
          type: string
          description: Base64-encoded image. Also settable/gettable via the dedicated image endpoints.
    SinglePhaseDevice:
      title: Uncontrollable device configuration (single-phase current draw)
      description: >-
        Same underlying shape as `ThreePhaseDevice` (`api.UncontrollableDevice`)
        with only phase A current supplied; phases B/C default to 0 A.
      type: object
      properties:
        deviceName:
          type: string
          description: Defaults to "my device" if omitted/empty on create.
        current:
          type: object
          properties:
            a:
              type: number
              x-unit: A
              minimum: 0
        powerFactor:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Unitless, (0, 1]. A value outside this range (including 0 or negative)
            is silently replaced with 1.0 rather than rejected.
        powerStateOn:
          type: boolean
        imgBase64:
          type: string
          description: Base64-encoded image. Also settable/gettable via the dedicated image endpoints.
