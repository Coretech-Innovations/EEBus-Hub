openapi: 3.0.0
info:
  title: EEBUS-Hub
  version: 3.1.0
  description: |-
    REST API of the EEBUS Hub — a testing and simulation framework for validating
    EEBUS device integration. The Hub simulates EEBUS actors (HEMS/CEM, EVSE, EV,
    inverter with battery and PV strings, heat pump, control box, uncontrollable
    devices) and lets you drive complete EEBUS scenarios over this API: build a
    site topology, run the simulation, pair actors over SHIP, exercise use cases
    (LPC, LPP, MPC, MGCP, OPEV, OSCEV, EVSOC, EVSECC, OHPCF, COB, MOB, MOI), and
    observe the resulting states and measurements.

    ## Scenario lifecycle — the five phases

    Every scenario follows the same state machine. The `Requires:` line in each
    operation's description tells you which phase it belongs to.

    **Phase A — Build the topology (simulation STOPPED).**
    Create entities while the simulation is stopped; create/delete/config
    operations return `400` while it is running. `POST /hems/add` creates the
    singleton HEMS (a second add returns `400`). Add controllable systems with
    `POST /evse/add`, `/inverter/add`, `/heatpump/add`, `/controlbox/add`, and
    loads with `POST /uncontrollabledevice`. Add EVs with `POST /ev/add` and
    plug one into a charging station with `POST /ev/{evId}/evse/{evseId}`.
    Optionally pre-declare mutual trust edges with `POST /trust` (by engine `id`
    for simulated entities or SKI for real devices); these edges persist across
    simulation restarts. Toggle which use cases are active with
    `PATCH /sim/usecases` (subject to license).

    **Phase B — Start the simulation.**
    `POST /sim` with `{"action": "start", "speedFactor": n}`. Start validates
    that the total uncontrollable-device current does not exceed the HEMS fuse
    limit (else `400`) and initialises every controllable system into the LPC
    `Init` state. `speedFactor` multiplies simulated time per real second
    (values below 1 are treated as 1). Start is blocked with `409` while a
    compliance test run is active, unless the request carries a valid
    `X-EEBUS-Internal-Test-Token` header.

    **Phase C — Pair over SHIP (simulation RUNNING).**
    SKI-based pairing requires a running simulation — trust endpoints return
    `400` ("Simulation not running") otherwise. Fetch the HEMS SKI with
    `GET /hems`, then establish mutual trust: tell the device to trust the HEMS
    (`POST /evse/{evseId}/trust`, `/inverter/{inverterId}/trust`,
    `/heatpump/{heatPumpId}/trust` — each returns that device's SKI) and tell
    the HEMS to trust the device (`POST /hems/trust`). Discover real devices on
    the network with `GET /mdns`. Pairing a device starts its EEBUS service and
    any EV connected to a paired EVSE.

    **Phase D — Operate and observe.**
    Start heartbeats (`POST /hems/heartbeat`), send limits (LPC:
    `POST /hems/ActivePowerConsumptionLimit`, LPP:
    `POST /hems/ActivePowerProductionLimit`, per-device variants under
    `/{deviceAddress}`), configure failsafe values and durations, and read back
    states (`GET /evse/{evseId}/lpcCurrentState`), limits, heartbeats, and
    measurements (`GET /hems/MpcMeasurementData`, `/hems/MgcpMeasurementData`).
    Controllable-system LPC/LPP states are: `Init` (starting), `Limited`
    (an active limit is applied), `Unlimited/Controlled` (heartbeat alive, no
    active limit), `Failsafe` (heartbeat lost or error — the failsafe limit
    applies), `Unlimited/Autonomous` (no controller — device acts on its own).
    For deterministic tests, testing aids exist: `PATCH /hems/testingMode`
    suspends automatic OPEV/OSCEV limit distribution so manual writes persist;
    `PATCH /{entity}/{id}/mode` plus `.../values` pin reported values verbatim;
    `POST .../forceState` injects a controllable-system state directly; and
    `PATCH /evse/{evseId}/electricalMeasurements` injects measurements (only
    while running and with no EV connected).

    **Phase E — Stop, reset, tear down.**
    `POST /sim` with `"stop"` pauses (trust edges are kept), `"reset"` clears
    the simulation state, `"cfgreset"` additionally restores default
    configuration. Deleting entities requires the simulation to be stopped.

    ## Conventions

    - **Units:** power in Watts (W), current in Amperes (A), energy in
      Watt-hours (Wh), durations in seconds unless an operation states
      otherwise. Fields whose name embeds a unit (e.g. `limitValueInWatts`,
      `valueInAmps`, `durationInSeconds`) are authoritative.
    - **Licensing:** every operation is gated by the runtime license unless its
      tag says otherwise (License, Version, Streaming; Analyzer uses its own
      feature flag). An expired license yields `403` on any gated route; a
      feature (entity kind or use case) missing from the license yields `403`
      on that feature's routes. `GET /api/v1/license` and `GET /api/v1/version`
      always work.
    - **Identifiers:** simulated entities are addressed by the integer `id`
      returned from their `add` operation; remote/paired devices by SKI
      (Subject Key Identifier of their certificate) or SPINE `deviceAddress`.
    - **Beyond REST:** live event streams are served on
      `GET /api/v1/events` (SSE), `/eebus_ws` (SHIP log WebSocket, outside the
      /api/v1 prefix) and `/events_ws` (event log WebSocket, outside the
      /api/v1 prefix).
servers:
  - url: /api/v1
    description: Relative to the Hub host (default port 8080, auto-increments if busy).
  - url: http://localhost:8080/api/v1
    description: Local development default.
tags:
  - name: SIM
    description: Simulation engine lifecycle, use-case toggles, logging, and monitoring log exports.
  - name: EV
    description: Simulated electric vehicle entities and their charging/measurement data.
  - name: EVSE
    description: Simulated EV supply equipment (charging stations) acting as LPC controllable systems.
  - name: HEMS
    description: The singleton Home Energy Management System (CEM) — pairing, limits (LPC/LPP), monitoring, and use-case control.
  - name: Heat Pump
    description: Simulated heat pump entities (LPC controllable systems with OHPCF flexibility).
  - name: Uncontrollable Device
    description: Simulated fixed-consumption devices that draw current but accept no control.
  - name: Energy Meter
    description: Aggregated energy meter view of the simulated site.
  - name: Internal Meter
    description: The Hub's internal metering service and its readings.
  - name: Real Devices
    description: Registration and management of real (non-simulated) EEBUS devices.
  - name: Testing
    description: Compliance test runner — DUT configuration, test selection, execution, and reports.
  - name: Inverter
    description: Simulated PV/battery inverter entities (LPC+LPP controllable systems, MOB/MOI monitoring).
  - name: ControlBox
    description: Simulated control box (SMGW/controllable-systems controller) sending LPC/LPP limits.
  - name: License
    description: License inspection. Not license-gated.
  - name: Version
    description: Hub version information. Not license-gated.
  - name: Updates
    description: Update notification registration and remote version lookup.
  - name: Trust
    description: Declarative mutual-trust topology between simulated entities and real devices (persists across simulation restarts).
  - name: Analyzer
    description: >-
      EEBUS traffic analyzer — capture sessions, protocol events, metrics,
      and exports. Gated twice, independently: (1) the `--analyzer` /
      `EEBUS_ANALYZER` runtime flag (default on) — every /analyzer/* route
      below is registered only when this is true at hub startup; if the
      analyzer was started disabled, none of these routes exist at all and
      any request to them 404s at the router level. (2) the `eebus-analyzer`
      license feature — checked per-request on every mounted /analyzer/*
      handler, independently of the hub-wide license middleware used by
      other tags, returning 403 with an `{"error": ...}` body (not the
      hub-wide `{"err": ...}` shape) when not licensed.
  - name: Streaming
    description: >-
      Push channels rather than request/response: the Server-Sent Events stream for UI
      state updates and the two root-level WebSocket log streams. None of them sit behind
      the license middleware, and the WebSocket pair is not under the /api/v1 prefix.
  - name: Power Limitation
    description: >-
      The combined LPC/LPP view across every device the hub simulates or observes.
paths:
  /sim:
    post:
      tags:
        - SIM
      summary: Start, stop, reset, or configuration-reset the simulation
      operationId: postSimulation
      description: >
        Drives the simulation engine's lifecycle. Use `start` to begin ticking the
        simulation at a given speed, `stop` to pause it, `reset` to tear down every
        simulated entity and rebuild a fresh default HEMS, or `cfgreset` to restore
        every existing entity to its initial configuration without deleting anything.


        Requires: preconditions differ per action — see the `action` enum below.
        While a compliance test run is active (`/testing`), all four actions are
        blocked with 409 unless the request carries a valid
        `X-EEBUS-Internal-Test-Token` header.
      parameters:
        - name: X-EEBUS-Internal-Test-Token
          in: header
          required: false
          description: >-
            Internal token used by test automation to authorize simulation control
            while a compliance test run is active. Must match the server's
            EEBUS_HUB_INTERNAL_TEST_TOKEN environment variable; if that variable is
            unset, no token can bypass the block.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/simulationParameters"
            example:
              action: start
              speedFactor: 5
      responses:
        '200':
          description: Action applied; echoes the request back in `request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulationResponseOk"
              example:
                status: OK
                request:
                  action: start
                  speedFactor: 5
        '400':
          description: >-
            Unknown `action` value, `start` rejected because the combined phase
            currents of running uncontrollable devices exceed the energy meter's
            fuse limit, or `cfgreset` failed (e.g. no CEM/HEMS found). A malformed
            JSON request body is rejected before any of these checks with an empty
            400 response (no JSON payload).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulationResponseBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '409':
          description: >-
            Blocked because a compliance test run is active and the request did not
            carry a valid X-EEBUS-Internal-Test-Token. Applies to all four actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    get:
      tags:
        - SIM
      summary: Get simulation run state, speed factor, and elapsed time
      operationId: getSimulationStatus
      description: >
        Reports whether the simulation is currently running, its configured speed
        factor, and how much simulated time has elapsed since it was last started.


        Requires: none — safe to call regardless of simulation state.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  response:
                    $ref: "#/components/schemas/simulationStatus"
              example:
                status: OK
                response:
                  state: running
                  speedFactor: 5
                  elapsedTime: 12
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /sim/undo:
    post:
      tags:
        - SIM
      summary: Undo the last unsaved action
      operationId: undo
      description: >
        Reverts the most recently performed action that has not yet been saved
        (see `/sim/save`) and pushes it onto the redo stack so it can be replayed
        with `/sim/redo`. Performing any new action after an undo discards the
        redo stack.


        Requires: simulation stopped (see `/sim` action=stop).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Simulation is running, or there is nothing left to undo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Internal engine is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/redo:
    post:
      tags:
        - SIM
      summary: Redo the last undone action
      operationId: redo
      description: >
        Re-applies the most recently undone action (see `/sim/undo`), moving it
        back onto the unsaved action history.


        Requires: simulation stopped (see `/sim` action=stop).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Simulation is running, or there is nothing left to redo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Internal engine is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/speedfactor:
    patch:
      tags:
        - SIM
      summary: Change the simulated-time-per-real-second speed factor
      operationId: modifySpeedFactor
      description: >
        Sets how many seconds of simulated time elapse per real second while the
        simulation is running (see `elapsedTime` in `GET /sim`). Takes effect the
        next time the simulation is started with `POST /sim` action=start, or
        immediately if the simulation is already using this value.


        Requires: simulation stopped. Values below 1 are coerced up to 1; there is
        no configured upper bound. If the new value equals the current one, this
        is a no-op that still returns 200 without logging a change.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                speedFactor:
                  type: number
                  format: double
                  description: >-
                    Simulated seconds per real second. Values less than 1 are
                    coerced to 1.
                  example: 5
            example:
              speedFactor: 5
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Cannot update the speed factor while the simulation is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Internal engine is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/save:
    post:
      tags:
        - SIM
      summary: Save all unsaved actions and clear the redo history
      operationId: save
      description: >
        Moves every action recorded since the last save (creates, config changes,
        patches) into the persistent save history that `GET /sim/export` reads
        from, collapsing repeated patches on the same entity down to their latest
        value. This also clears the redo history built up by `/sim/undo`, so any
        undone-but-not-redone actions are discarded.


        Requires: none. Always succeeds; there is nothing to fail on.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    get:
      tags:
        - SIM
      summary: Check whether there are unsaved actions
      operationId: saveupdate
      description: >
        Reports whether every action performed so far has already been saved.
        `status: true` means `/sim/save` has nothing new to do (no pending
        actions); `status: false` means there are unsaved changes.


        Requires: none.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
               type: object
               properties:
                  status:
                    type: boolean
                    description: "true when there are no unsaved actions pending"
              example:
                status: true
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /sim/export:
    get:
      tags:
        - SIM
      summary: Download the saved action history as a JSON file
      operationId: exportFile
      description: >
        Streams the saved action history (see `/sim/save`) as a downloadable JSON
        file (`EEBUS-Hub-export.json`), suitable for later re-loading with
        `POST /sim/import` on this or another hub instance.


        Requires: at least one saved action; call `/sim/save` first if
        `GET /sim/save` reports unsaved changes.
      responses:
        '200':
          description: >-
            The saved action history and trust topology, sent with
            Content-Disposition so a browser saves it as EEBUS-Hub-export.json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationExport"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No saved actions to export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to encode the saved actions to JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/import:
    post:
      tags:
        - SIM
      summary: Load a previously exported configuration file
      operationId: importFile
      description: >
        Uploads a JSON file previously downloaded from `GET /sim/export` and
        replays its create/config/patch actions to reconstruct the entities it
        describes, merging them into the current save history.


        Requires: simulation stopped. `status: false` (still HTTP 200) means the
        import was rejected because at least one entity in the file would exactly
        duplicate an already-existing entity's configuration; no entities are
        created in that case.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The exported JSON file (form field name "file").
              required:
                - file
      responses:
        '200':
          description: Import attempted; see `status` for whether it was applied.
          content:
            application/json:
              schema:
               type: object
               properties:
                  status:
                    type: boolean
                    description: false when the file was rejected as a duplicate of existing entities
              example:
                status: true
        '400':
          description: >-
            Simulation is running, the "file" form field is missing, or the
            uploaded file's size does not match its declared Content-Length.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Failed to open the uploaded file, or failed to parse it as JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/log/start:
    post:
      tags:
        - SIM
      summary: Start recording every REST API call the backend receives
      operationId: startLogging
      description: >
        Turns on the API call recorder: every subsequent request (method, URI,
        and JSON body for non-GET requests) is appended to an in-memory log until
        `POST /sim/log/stop` is called. Intended for capturing a repeatable script
        of API calls, distinct from the EEBUS/event file logs under `/sim/logs/*`.


        Requires: API logging not already running (see `GET /sim/logState`).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: API logging has already been started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /sim/log/stop:
    post:
      tags:
        - SIM
      summary: Stop the API call recorder and download the recorded script
      operationId: getLogs
      description: >
        Stops the API call recorder started by `POST /sim/log/start` and returns
        the recorded calls as a downloadable replay script — a `.bat` file on
        Windows, a `.sh` file on Linux/macOS (server OS, not client OS).


        Requires: API logging currently running.
      responses:
        '200':
          description: Successful response — script file download
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: API logging has not been started, so there is nothing to stop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /sim/log/clear:
    post:
      tags:
        - SIM
      summary: Clear the recorded API call log
      operationId: clearLogs
      description: >
        Empties the in-memory API call log recorded by `POST /sim/log/start`,
        independently of whether recording is currently running.


        Requires: none. Always succeeds.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /sim/usecases:
    patch:
      tags:
      - SIM
      summary: Enable or disable EEBUS use cases at runtime
      operationId: usecasesRuntime
      description: 'Toggles which EEBUS use case handlers the CEM (HEMS) and, for MGCP, the ControlBox advertise
        and respond to. Only the flags present in the request body are changed; omitted flags are left as-is.
        Use this before creating any EVSE/EV/Inverter/Uncontrollable-device entity to decide which use cases
        a scenario will exercise.


        Requires: simulation stopped, and no EV/EVSE/Inverter/Uncontrollable-device entity created yet (use
        `POST /sim` action=reset first if any exist). Every flag is additionally constrained by the current
        license — enabling a use case the license does not grant is rejected with 403. Flags are re-read
        from the license automatically on `POST /sim` action=reset.


        Dependency, applied silently to the request body before anything is stored: both OPEV and OSCEV
        build on EVSECC, so disabling `evseccEnabled` forces `opevEnabled` AND `oscevEnabled` off, and enabling
        either `opevEnabled` or `oscevEnabled` forces `evseccEnabled` on. These coercions are not reported
        — the call returns 200 and a later `GET /sim/usecases` is the only way to observe the resulting
        state, which may differ from what was sent.

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseCasesAvailability'
            example:
              lpcEnabled: true
              mpcEnabled: true
              oscevEnabled: true
      responses:
        '200':
          description: Successful response — request echoes the flags actually applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  request:
                    $ref: '#/components/schemas/UseCasesAvailability'
        '400':
          description: Malformed JSON body (empty 400 response), the simulation is running, or an EV/EVSE/Inverter/Uncontrollable-device
            entity already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          description: One or more requested flags enable a use case the current license does not grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '500':
          description: Internal engine is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
    get:
      tags:
      - SIM
      summary: Get the current use-case availability flags
      operationId: getUsecasesAvailability
      description: 'Returns the current on/off state of all 12 use-case flags (a subset of which may be
        further restricted by the license — see `PATCH /sim/usecases`).


        Requires: none.

        '
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  usecasesEnable:
                    $ref: '#/components/schemas/UseCasesAvailability'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
  /sim/logs/{action}:
    post:
      tags:
        - SIM
      summary: Start or stop the in-memory verbosity-log capture window
      operationId: loggingAction
      description: >
        Starts or stops an in-memory capture window that buffers every log line
        written at any verbosity (Normal/Error/Trace/Debug/Event/EEBUS) while
        active, keyed by verbosity. Distinct from the always-on per-run log files
        under `./logs/` (see `/sim/eebuslog`) and from the API call recorder
        controlled by `/sim/log/*`. Starting a new window discards any previously
        buffered capture; once stopped, the EEBUS and Event streams captured
        during the window can be downloaded via `/sim/logs/eebuslogs` and
        `/sim/logs/eventlogs`.


        Requires: none — safe to call regardless of current capture state.
        Calling `start` again while already capturing restarts the window and
        discards whatever was buffered so far; calling `stop` while already
        stopped is a no-op. Both still return 200.
      parameters:
        - name: action
          in: path
          schema:
            type: string
            enum: [start, stop]
            description: start begins the capture window, stop ends it.
          required: true
          description: "`start` begins the capture window; `stop` ends it."
          example: start
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  Logging state:
                    type: string
                    description: "\"Logging started\" or \"Logging stopped\""
              example:
                status: OK
                Logging state: Logging started
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '400':
          description: "The `action` path value was neither `start` nor `stop`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/logs/eebuslogs:
    get:
      tags:
        - SIM
      summary: Download the EEBUS-verbosity capture from the last logging window
      operationId: getEEBusLogs
      description: >
        Downloads the EEBUS-verbosity portion of the in-memory buffer captured
        by `POST /sim/logs/{action} (action=start)` / `(action=stop)` (SHIP/SPINE
        trace lines).


        Requires: the capture window must be stopped, and at least one EEBUS-level
        line must have been logged during it.
      responses:
        '200':
          description: Successful response — log file download
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: >-
            The capture window is still running (stop it first), or no
            EEBUS-verbosity lines were captured during the last window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /sim/logs/eventlogs:
    get:
      tags:
        - SIM
      summary: Download the Event-verbosity capture from the last logging window
      operationId: getEventLogs
      description: >
        Downloads the Event-verbosity portion of the in-memory buffer captured by
        `POST /sim/logs/{action} (action=start)` / `(action=stop)` — the same
        category of entries streamed live over the `/events_ws` websocket.


        Requires: the capture window must be stopped, and at least one Event-level
        line must have been logged during it.
      responses:
        '200':
          description: Successful response — log file download
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: >-
            The capture window is still running (stop it first), or no
            Event-verbosity lines were captured during the last window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /sim/logState:
    get:
      tags:
        - SIM
      summary: Get whether the in-memory API call recorder is running
      operationId: getAPILoggingState
      description: >
        Reports whether the API call recorder controlled by `/sim/log/start` and
        `/sim/log/stop` is currently `Running` or `Stopped`. Unrelated to the
        file-based EEBUS/event loggers controlled by `/sim/logs/{action}`.


        Requires: none.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APILoggingState"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /sim/eebuslog:
    get:
      tags:
        - SIM
      summary: Download the current EEBUS log file
      operationId: getEEBUSLog
      description: >
        Downloads the EEBUS-verbosity log file the logger is currently writing to
        (one file per run; see `internal/logger.go`), regardless of whether
        file logging was explicitly started via `/sim/logs/{action}`.


        Requires: the log file must exist on disk.
      responses:
        '200':
          description: Successful response - file download
          content:
            text/plain:
              schema:
                type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: Log file not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/eebuslogfile:
    get:
      tags:
        - SIM
      summary: Get the current EEBUS log file's path
      operationId: getEEBUSLogFilePath
      description: >
        Returns the filesystem path of the EEBUS-verbosity log file the logger is
        currently writing to, without downloading its contents (see
        `GET /sim/eebuslog` to download it).


        Requires: the log file must exist on disk.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  filepath:
                    type: string
              example:
                status: OK
                filepath: ./logs/eebus_2026-07-17.log
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: Log file not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/LPView:
    get:
      tags:
        - SIM
      summary: Get the LPC/LPP load-control-limit log
      operationId: getLPView
      description: >
        Returns every load-control-limit write exchanged for the LPC (Limitation
        of Power Consumption) and LPP (Limitation of Power Production) use cases,
        in insertion order — both regular limits (`APCL`/`APPL`) and failsafe
        limits (`FSCAPL`/`FSPAPL`) written by the CEM (HEMS) or a ControlBox to a
        controllable system (EVSE/Inverter/HeatPump). An entry appears whenever
        such a limit is written or its state changes (Applied → Accepted/Rejected).
        The buffer holds at most 1000 entries; once full, the oldest is dropped
        as a new one arrives.


        Requires: none — safe to call regardless of simulation state. Cleared by
        `DELETE /sim/LPView` and automatically by `POST /sim` action=reset.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LPEvent"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: LP logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear the LPC/LPP load-control-limit log
      operationId: clearLPView
      description: >
        Empties the LP log buffer (see `GET /sim/LPView`).


        Requires: none.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: LP logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportLPView:
    get:
      tags:
        - SIM
      summary: Export the LPC/LPP load-control-limit log to CSV
      operationId: exportLPView
      description: >
        Exports the LP log (see `GET /sim/LPView`) as a CSV download, sorted by
        timestamp. Any query parameter below filters the export by exact match;
        passing none exports everything currently buffered.


        Requires: none.
      parameters:
        - name: Limit_Type
          in: query
          required: false
          description: Filter to one limit type.
          schema:
            type: string
            enum: [APCL, APPL, FSCAPL, FSPAPL]
            description: >-
              Active Power Consumption Limit, Active Power Production Limit,
              Failsafe Active Power Consumption Limit, Failsafe Active Power
              Production Limit.
        - name: source_Address
          in: query
          required: false
          schema:
            type: string
        - name: destination_Address
          in: query
          required: false
          schema:
            type: string
        - name: Limit_state
          in: query
          required: false
          schema:
            type: string
            enum: [Applied, Accepted, Rejected, Expired, Timed-out]
            description: >-
              Applied: just written, outcome pending. Accepted/Rejected: the
              controller's response. Expired: the limit's duration elapsed.
              Timed-out: no response was received in time.
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Exact limit value, in the limit's own unit (A for APCL/FSCAPL, W for APPL/FSPAPL).
          schema:
            type: number
        - name: limit_duration
          in: query
          required: false
          description: Exact limit duration, in seconds.
          schema:
            type: number
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No logs match the given filter parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: LP logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/EVLimitLogs:
    get:
      tags:
        - SIM
      summary: Get the OPEV/OSCEV EV limit log
      description: >
        Returns every OPEV and OSCEV limit exchange recorded so far, in insertion
        order. Each exchange is one entry, carrying the EV's accept/reject
        outcome. The buffer holds at most 1000 entries; once full, the oldest is
        dropped as a new one arrives.


        Requires: none — safe to call regardless of simulation state. Cleared by
        `DELETE /sim/EVLimitLogs` and automatically by `POST /sim` action=reset.
      operationId: getEVLimitLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EVLimitEvent"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: EV limit logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear the OPEV/OSCEV EV limit log
      operationId: clearEVLimitLogs
      description: >
        Empties the EV limit log buffer and resets the per-entity bookkeeping
        that decides what gets logged: the CEM's record of previously sent OPEV
        limits and each simulated EV's record of previously logged limits.
        Clearing only the buffer without this bookkeeping would leave the first
        limit written after the clear looking like an unchanged duplicate and
        suppress it from the fresh log.


        Requires: none.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: EV limit logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportEVLimitLogs:
    get:
      tags:
        - SIM
      summary: Export the EV limit log to CSV
      description: >
        Exports the EV limit log as CSV, sorted by timestamp. Any query parameter
        below filters the export; passing no parameters exports everything.


        Requires: none.
      operationId: exportEVLimitLogs
      parameters:
        - name: useCase
          in: query
          required: false
          schema:
            type: string
            enum: [OPEV, OSCEV]
            description: Which EEBUS use case wrote the limit — Overload Protection by EV or Optimization of Self-Consumption during EV Charging.
        - name: limitState
          in: query
          required: false
          schema:
            type: string
            enum: [Applied, Accepted, Rejected, Expired, Timed-out]
            description: >-
              Applied: just written, outcome pending. Accepted/Rejected: the
              controller's response. Expired: the limit's duration elapsed.
              Timed-out: no response was received in time.
        - name: evId
          in: query
          required: false
          schema:
            type: integer
        - name: sourceAddress
          in: query
          required: false
          schema:
            type: string
        - name: destinationAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No logs match the given filter parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: EV limit logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/MPCLogs:
    get:
      tags:
        - SIM
      summary: Get the MPC measurement log
      operationId: getMPCLogs
      description: >
        Returns every MPC (Monitoring of Power Consumption) measurement snapshot
        recorded so far, in insertion order. An entry is appended whenever a
        controllable system (EVSE/Inverter/HeatPump) or the CEM/ControlBox
        publishes a new measurement notify (power, current, voltage, energy, or
        frequency) to its MPC handler. The buffer holds at most 1000 entries;
        once full, the oldest is dropped as a new one arrives.


        Requires: none — safe to call regardless of simulation state. Cleared by
        `DELETE /sim/MPCLogs` and automatically by `POST /sim` action=reset.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MPCevent"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: MPC logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear the MPC measurement log
      operationId: clearMPCLogs
      description: >
        Empties the MPC log buffer (see `GET /sim/MPCLogs`).


        Requires: none.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
