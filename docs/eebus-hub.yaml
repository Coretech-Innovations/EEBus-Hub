              properties:
                value:
                  type: number
                  x-unit: W
                  description: New maximum power limit in Watts. Not range-checked before sending.
            example:
              value: 5000
      responses:
        '200':
          description: Device accepted the new limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                  reason:
                    type: string
        '400':
          description: Invalid limitType or missing value (COB-not-supported is checked but not reachable in a running server — see description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/HemsEntityOrCobDeviceNotFound"
        '500':
          description: The EEBUS write to the device failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    type: object
                  reason:
                    type: string
