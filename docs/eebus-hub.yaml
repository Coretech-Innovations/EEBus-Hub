        capacityInWattHours:
          type: number
          x-unit: Wh
          description: Battery capacity in Wh. Must be greater than 0.
        nominalVoltageInVolts:
          type: number
          x-unit: V
          description: Battery DC voltage in V. Must be greater than 0.
        stateOfChargeInPercent:
          type: number
          x-unit: percent
          description: Sets the live state of charge, 0..100.
        chargingEnabled:
          type: boolean
        dischargingEnabled:
          type: boolean
        batteryType:
          type: string
          description: DeviceConfiguration battery type. Must be one of the MOB-072 enum values.
          enum:
          - liIon
          - leadAcid
          - redoxFlow
          - sodiumIon
        maxCycleCountPerDay:
          type: integer
          description: DeviceConfiguration max cycles per day. Must be >= 0.
        standbyPowerThresholdInWatts:
          type: number
          description: Standby-detection power threshold in W. Must be >= 0.
        stateOfHealthInPercent:
          type: number
