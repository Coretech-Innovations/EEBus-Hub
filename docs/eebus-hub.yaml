        supportsLineToNeutralVoltage:
          type: boolean
        supportsLineToLineVoltage:
          type: boolean
        supportsFrequency:
          type: boolean
        connectedPhases:
          type: array
          items:
            type: string
            description: AC phase (a, b, c)
            enum: [a, b, c]

    testingDUTConfig:
