        pvStringDCEnergyInWh:
          type: number
          nullable: true
          description: DC energy produced by the PV string in Wh
        insulationResistanceInOhms:
          type: number
          nullable: true
          description: Insulation resistance in Ohms
        componentTemperatureInCelsius:
          type: number
          nullable: true
          description: Component temperature in degrees Celsius (normalized from the reported unit)
        tiltInDegrees:
          type: number
          nullable: true
          description: Panel tilt angle in degrees
        azimuthInDegrees:
          type: number
          nullable: true
          description: Panel azimuth angle in degrees
    FieldValidationError:
      title: per-field validation failure
      description: The validation map the EVSE, inverter and heat pump endpoints return. Each key is a field
        of the request body that failed validation; the value is always false and carries no message.
      type: object
      properties:
        err:
          type: object
          additionalProperties:
            type: boolean
          example:
            heartbeatTimeoutInSeconds: false
    FieldRejectionError:
      title: rejection of a single named field
      type: object
      properties:
        err:
          type: string
          description: Why the field was refused.
          example: heartbeatTimeoutInSeconds must be between 2 and 86400 seconds
        fields:
          type: array
          description: The rejected field names, as they were spelled in the request body.
          items:
            type: string
          example:
          - heartbeatTimeoutInSeconds
    HEMSProtectedFieldsError:
      title: rejection of use-case fields sent to PATCH /hems
      type: object
      properties:
        err:
          type: string
          example: Use-case availability cannot be changed through /hems; use PATCH /sim/usecases
        fields:
          type: array
          description: The rejected field names, as they were spelled in the request body.
          items:
            type: string
          example:
          - controllableSystemEnabled
    ActionLoggerEntry:
      title: one entry of the saved action history
      type: object
      description: Serialized from ActionLoggerEntry (cmd/eebus-hub/actionLogger.go). The log is replayed
        in order by POST /sim/import to rebuild a topology.
      properties:
        actionId:
          type: integer
          description: Position in the replay order, assigned when the action was logged.
        actionType:
          type: string
          enum:
          - create
          - destroy
          - config
          - patch
          description: create adds an entity, destroy removes one, config/patch change one.
        entityIdRef:
          type: integer
          description: Engine entity id the action applies to.
        entityType:
          type: string
          enum:
          - Engine
          - EV
          - EVSE
          - Inverter
          - Heat Pump
          - HEMS
          - Uncontrollable
          - Real EVSE
          - Real Inverter
          - Real Heat Pump
          - Real HEMS
          - Real Device
          - CB
          - InternalMeter
          description: Which kind of entity the action applies to.
        config:
          type: object
          additionalProperties: true
          description: The entity configuration carried by the action. Its shape follows entityType — an EVSE
            action carries an EVSEConfig, a HEMS action a HEMSConfig, and so on — so it is left open here
            rather than modelled as a union that would go stale.
    SimulationExport:
      title: exported simulation state
      type: object
      description: The body of GET /sim/export and the file POST /sim/import accepts. Serialized from cmd/eebus-hub/simApi.go:simulationExport.
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionLoggerEntry'
          description: The saved action history, in replay order.
        trustConnections:
          type: array
          items:
            $ref: '#/components/schemas/TrustEdge'
          description: The trust topology at export time. Omitted entirely by hubs older than the trust-topology
            feature, so an import must treat it as optional.
    testingValidationError:
      title: testing configuration validation error
      type: object
      required:
      - err
      properties:
        err:
          type: string
          description: Human-readable summary, present on every rejection. For a configuration validation
            failure it joins the entries of errors.
        errors:
          type: array
          minItems: 1
          description: One entry per rejected value, present only when the request failed test configuration
            validation. Every problem with the submitted configuration is reported, not just the first.
          items:
            type: string
    testingShipParameters:
      type: object
      description: 'Declares the manufacturer-supplied SHIP test execution parameters, mirroring the "EXECUTION
        PARAMETERS" block of the EEBus SHIP ParameterSheet V1.0.0 (the PAR_* parameters of SHIP Test Specification
        V1.0.0 section 2.5). Required for the ship-dut suite.


        Like lpcOptionalSupport and unlike mpcMu/mpcMa, an omitted mandatory declaration is rejected with
        a 400 rather than defaulting, because these declarations decide which of the 33 SHIP test cases apply
        to the DUT and a missing one would silently drop test cases from a compliance run.


        Mandatory: shipSvc, initiateClose, queryAccessMethods, clientDetailedDiscoverySupported, shipVersion
        and helloProlongationCount. shipId is mandatory only when shipSvc is false, since a DUT that announces
        its SHIP service supplies the ID through mDNS. testToolShipVersion and pinRequirement are optional
        and take the defaults documented below.'
      properties:
        shipSvc:
          type: boolean
          description: PAR_shipSvc — the DUT announces its SHIP service via mDNS. True is recommended; false
            is only permissible for a DUT conforming to the German "FNN Lastenheft Steuerbox", and skips the
            13 test cases that need a DUT SHIP server port.
        shipVersion:
          type: string
          description: PAR_shipVersion — the maximum SHIP version the DUT supports, as "major.minor" (a "major.minor.patch"
            form is accepted and the patch ignored, and a bare major such as "1" is read as "1.0"). Each number
            must be 0-255. Must share a major number with testToolShipVersion.
          example: '1.0'
        testToolShipVersion:
          type: string
          description: PAR_testToolShipVersion — the maximum SHIP version the test tool announces. Must share
            shipVersion's major number, since only versions with the same major are compatible; the handshake
            negotiates the greatest version both support. Defaults to "1.0" when omitted.
          example: '1.0'
        helloProlongationCount:
          type: integer
          minimum: 2
          description: PAR_helloProlongationCount — how many prolongation requests TC_SHIP_HELLO_002 sends.
            The specification requires at least 2 and the ParameterSheet recommends 3. Each round adds roughly
            60 seconds to that test case.
          example: 3
        initiateClose:
          type: boolean
          description: PAR_initiateClose — the DUT announces a termination with an SME "close" message before
            closing the connection. Gates TC_SHIP_TERM_001.
        queryAccessMethods:
          type: boolean
          description: 'PAR_queryAccessMethods — the DUT sends an SME access methods request on reaching the
            SME state "connection data exchange". Selects between two mutually exclusive test cases: true
            runs TC_SHIP_AMDATA_002, false runs TC_SHIP_AMDATA_004, so exactly one runs for any DUT.'
        clientDetailedDiscoverySupported:
          type: boolean
          description: PAR_clientDetailedDiscoverySupported — the DUT initiates a SPINE nodeManagementDetailedDiscoveryData
            read request after connecting. Gates TC_SHIP_AMDATA_003.
        shipId:
          type: string
          description: PAR_shipId — the DUT's unique SHIP ID, which TC_SHIP_AM_001 checks against accessMethods.id.
            Mandatory only when shipSvc is false; otherwise the ID is read from the mDNS TXT record "id" key
            and that announced value takes precedence over anything declared here.
        pinRequirement:
          type: string
          default: none
          example: none
          description: 'Mirrors the ParameterSheet''s "DUT CREDENTIALS" block, which fixes this to "none":
            no PIN is required for a regular SHIP connection, which is what TC_SHIP_PIN_001 verifies. Only
            "none" is accepted, compared without regard to case, and any other value is rejected. Optional
            - the value is defaulted when omitted, and the dashboard does not send it at all.


            Deliberately not declared as an enum. OpenAPI enum matching is case-sensitive, so `enum: ["none"]`
            made a spec-validating client reject "None" while the handler accepted it.'
    CobSetpointConstraints:
      title: Constraints and state of one COB setpoint
      description: 'One setpoint of a control mode, merged from its setpoint description (scopeType), its
        setpoint constraints (the range and the step size) and its setpoint data (the two flags). setpointId
        and scopeType are always present. Every other property is present only when the Inverter has actually
        published it: an Inverter with no declared power bound reports no range at all rather than a bound
        of 0, and accepts any value the CEM writes. The range follows the passive sign convention, so the
        minimum is the largest discharge power and the maximum the largest charge power.'
      type: object
      required:
      - setpointId
      - scopeType
      properties:
        setpointId:
          type: integer
        scopeType:
          type: string
          enum:
          - batteryAcPower
          - batteryDcPower
          - pccPower
        setpointRangeMinInWatts:
          type: number
        setpointRangeMaxInWatts:
          type: number
        setpointStepSizeInWatts:
          type: number
        isSetpointChangeable:
          type: boolean
        isSetpointActive:
          type: boolean