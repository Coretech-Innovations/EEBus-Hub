                    deviceAddress:
                      type: string
                      example: d:_n:SIMCT_HeatPump-1-2157b8c6
                    data:
                      $ref: "#/components/schemas/OhpcfMonitorData"
                    optionalAccepted:
                      type: boolean
                      description: Whether the heat pump's current OHPCF state is one an accepting HEMS put it into (see IsOhpcfAccepted).
        '400':
          description: The OHPCF use case is not enabled by the current license.
