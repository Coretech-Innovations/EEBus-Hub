        '500':
          description: MPC logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportMPCLogs:
    get:
      tags:
        - SIM
      summary: Export the MPC measurement log to CSV
      operationId: exportMPCLogs
      description: >
        Exports the MPC log (see `GET /sim/MPCLogs`) as a CSV download, one row
        per snapshot, in the order the entries were recorded. No filtering is
        supported; the export always contains everything currently buffered.


        Requires: none.
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: MPC logger is not initialized, or the CSV could not be written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/MGCPLogs:
    get:
      tags:
        - SIM
      summary: Get the MGCP measurement log
      operationId: getMGCPLogs
      description: >
        Returns every consolidated MGCP (Monitoring of Grid Connection Point)
        measurement snapshot the CEM (MA) has received from any GCP, in
        insertion order. One entry is appended per SPINE notify; a notify may
        populate any subset of the scenario fields (power, energy, current,
        voltage, frequency), and includes [MGCP-003] value-state rejections.
        The buffer holds at most 1000 entries; once full, the oldest is dropped
        as a new one arrives.


        Requires: none — safe to call regardless of simulation state. Cleared by
        `DELETE /sim/MGCPLogs` and automatically by `POST /sim` action=reset.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MGCPEvent"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: MGCP logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear the MGCP measurement log
      operationId: clearMGCPLogs
      description: >
        Empties the MGCP log buffer (see `GET /sim/MGCPLogs`).


        Requires: none.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: MGCP logs cleared successfully
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: MGCP logger is not initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportMGCPLogs:
    get:
      tags:
        - SIM
      summary: Export the MGCP measurement log to CSV
      operationId: exportMGCPLogs
      description: >
        Exports the MGCP log (see `GET /sim/MGCPLogs`) as a CSV download, one row
        per snapshot, in the order the entries were recorded. No filtering is
        supported; the export always contains everything currently buffered.
        Cells for scenario fields absent from a given notify are left empty.


        Requires: none.
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: MGCP logger is not initialized, or the CSV could not be written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/TCPServer:
    get:
      tags:
        - SIM
      summary: Get the (deprecated) TCP trace server status
      operationId: getTCPServerStatus
      description: >
        Deprecated: the legacy TCP-12345 EEBusTracer surface was removed. This
        endpoint is a stub kept for backward compatibility; it always reports
        `enabled: false` and `port: ""`. Use `/api/v1/analyzer/stream` (SSE) for
        live SHIP/SPINE traffic instead.


        Requires: none.
      responses:
        '200':
          description: Successful response — always reports the trace server as disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Always false; the legacy TCP trace surface has been removed.
                  port:
                    type: string
                    description: Always empty.
              example:
                enabled: false
                port: ""
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    patch:
      tags:
        - SIM
      summary: Configure the (deprecated) TCP trace server
      operationId: configureTCPServer
      description: >
        Deprecated: the legacy TCP-12345 EEBusTracer surface was removed. Sending
        `enabled: false` is accepted as a no-op and returns 200. Sending
        `enabled: true` always fails with 500, since the server can no longer be
        started; `port` is accepted but not validated or used. Use
        `/api/v1/analyzer/stream` (SSE) for live SHIP/SPINE traffic instead.


        Requires: none.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Must be false; true always yields a 500 error.
                port:
                  type: string
                  description: Accepted but ignored — the legacy server can no longer start.
            example:
              enabled: false
              port: ""
      responses:
        '200':
          description: Successful response (only reachable with enabled=false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Malformed JSON request body.
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: >-
            enabled=true was requested; the legacy TCP trace surface has been
            removed. Note this error body uses the key "error", not the "err"
            key used by most other endpoints' error responses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "TCP-12345 EEBusTracer surface removed; use /api/v1/analyzer/stream"
  /mdns:
    get:
      tags:
        - SIM
      summary: List EEBUS-capable devices discovered on the network via mDNS
      operationId: getAvailableMdnsDevices
      description: >
        Returns every SHIP-capable device the mDNS scanner currently sees on the
        network (only entries advertising a valid 40-character SKI are kept),
        sorted by name. Use this to find the SKI of a real device before trusting
        it — see `POST /hems/trust` (and the per-entity trust endpoints) for the
        pairing step that follows discovery.


        By default this hub's own simulated entities are suppressed from the
        list (matched by a "Coretech-Innovations" brand marker) so they don't
        clutter discovery of real devices; start the hub with
        `--mdnsnosuppres` to include them too.


        Requires: none.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                title: Array of discovered mDNS entries
                type: array
                items:
                  $ref: "#/components/schemas/MdnsEntry"
              example:
                - name: "EVSE-001"
                  host: "evse-001.local"
                  addresses: ["192.168.1.42"]
                  port: 4712
                  elements:
                    ski: "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"
                    brand: "Some-Vendor"
                    type: "EVSE"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /ev/view:
    get:
      tags:
        - EV
      summary: Get aggregated EV view data
      operationId: getEVView
      description: >-
        Merges every simulated EV with every remote EV the HEMS has discovered
        into one deduplicated, deterministically sorted list — a remote entry
        whose SPINE entity address matches a simulated EV is dropped in favor of
        the simulated one. Each entry's `availableSections.oscev`/`opev` reflect
        whether those use cases are currently licensed; the charging/measurements
        sections are always present for simulated EVs.
      responses:
        '200':
          description: Aggregated simulated and HEMS-discovered remote EV view data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVViewSnapshot"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /ev/add:
    post:
      tags:
        - EV
      summary: Create a simulated EV
      operationId: addEV
      description: >-
        Creates a new simulated EV entity, unconnected to any EVSE (connect it
        afterwards with POST /ev/{evId}/evse/{evseId}). No field validation is
        performed on the device/identification data — a malformed or empty body is
        accepted with each field defaulting to its Go zero value. Requires: the
        simulation must not be running (400 otherwise).


        `opevEnabled`, `evsocEnabled` and `oscevEnabled` in the request body are
        overridden by the server from the currently configured license/use-case
        toggles before the entity is created — the values you submit for these
        three flags are ignored.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EVConfig"
            example:
              communicationStandard: iso15118-2ed2
              asymmetricCharging: false
              identification:
                type: eui48
                value: "00:1D:A0:00:00:01"
              device:
                name: EV-1
                code: EV001
                serialNumber: SN-0001
                vendor:
                  name: Coretech-Innovations
                  code: CTI
              currentLimits:
                min: 6
                max: 32
              chargingCapacity: 60
              charged: 50
              batteryHealth: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVAddResponseOk"
              example:
                status: OK
                id: 3
        '400':
          description: Simulation is running, or the request body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '500':
          description: Failed to get the internal engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /ev/list:
    get:
      tags:
        - EV
      summary: List all simulated EVs
      operationId: listEVs
      description: >-
        Returns every simulated EV entity with its full configuration, plus whether
        it is currently connected to an EVSE and, if so, that EVSE's engine ID.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVList"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /ev/{evId}:
    patch:
      tags:
        - EV
      summary: Update an EV's configuration
      operationId: modifyEV
      description: >-
        Applies a partial update to the EV's static configuration (device data,
        current limits, battery, OSCEV device configuration, etc.). The request body
        is merged onto the existing config field-by-field — only JSON keys actually
        present in the body overwrite the corresponding field; omitted keys keep
        their current value. If the merged result is identical to the current
        configuration, the entity is left untouched (still returns 200 with
        changes/new/old).


        OSCEV fields carry extra validation, applied only when the corresponding key
        is present in the request body:

        - `oscevPVChargeMode` must be one of `off` / `surplusOnly` /
        `surplusWithThreshold`; `surplusWithThreshold` is rejected unless the EV's
        `oscevSurplusWithThresholdSupported` is already `true`.

        - `oscevSurplusWithThresholdSupported` is immutable after creation — a
        request that includes this key is always rejected with 400, regardless of
        the value supplied.

        - `oscevSurplusThresholdInWatts`, `oscevStartDelayInSeconds` and
        `oscevStopDelayInSeconds` must be non-negative when present.

        - If threshold support is disabled, `oscevSurplusThresholdInWatts` may not
        be set and `oscevPVChargeMode` may not be `surplusWithThreshold` (enforced
        both when the fields are freshly submitted and against the EV's existing
        stored configuration).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EVConfig"
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    description: Echo of the raw request body as submitted
                    $ref: "#/components/schemas/EVConfig"
                  new:
                    description: The EV's full configuration after the update
                    $ref: "#/components/schemas/EVConfig"
                  old:
                    description: The EV's full configuration before the update
                    $ref: "#/components/schemas/EVConfig"
        '400':
          description: >-
            Invalid ID number, malformed body, or an OSCEV validation failure (see
            description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/invalidId"
    get:
      tags:
        - EV
      summary: Get one EV's configuration
      operationId: getEV
      description: >-
        Returns the given EV's full configuration merged with its live connection
        state (`evId`, `connectedToEVSE`, and `evseId` when connected). Requires:
        none beyond a valid license (default license-gated route).
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EVConfig"
                  - type: object
                    properties:
                      evId:
                        type: integer
                      connectedToEVSE:
                        type: boolean
                      evseId:
                        type: integer
                        description: >-
                          Engine ID of the connected EVSE. Present only when
                          connectedToEVSE is true.
        '400':
          $ref: "#/components/responses/InvalidIdNumberBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/invalidId"
    delete:
      tags:
        - EV
      summary: Delete a simulated EV
      operationId: deleteEV
      description: >-
        Removes the EV entity. If it is currently connected to an EVSE it is
        disconnected first (equivalent to DELETE /ev/{evId}/evse/{evseId}); a
        disconnect failure is only logged, it does not block the deletion. Requires:
        the simulation must not be running, and no compliance test run may be active
        (unless a valid X-EEBUS-Internal-Test-Token is supplied).
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
        - name: X-EEBUS-Internal-Test-Token
          in: header
          required: false
          description: Internal token used by test automation to bypass the active-test-run block.
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVDelete"
        '400':
          description: Invalid ID number, or the simulation is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/invalidId"
        '409':
          description: Blocked because a compliance test run is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /ev/{evId}/evse/{evseId}:
    post:
      tags:
        - EV
      summary: Plug an EV into an EVSE
      operationId: connectToEVSE
      description: >-
        Simulates plugging the EV's cable into the EVSE: registers the EV with the
        EVSE (fails with 400 if the EV is already connected to any EVSE, or if the
        EVSE ID does not resolve to an EVSE entity). If the target EVSE already has
        a local SKI — i.e. it has already been started via POST
        /evse/{evseId}/trust or was already running — the EV's own EEBUS service
        (EVCC/EVEM and, if enabled, OPEV/OSCEV/EVSOC handlers) is started
        immediately as part of this call; otherwise the EV's service starts later,
        when the EVSE is trusted. An EV can be connected to at most one EVSE at a
        time; use DELETE on this path first to move it to a different EVSE. An EV
        plugged into an EVSE in testing mode enters testing mode too, pinned at 0 W,
        and returns to simulation mode when it is unplugged or the EVSE leaves testing
        mode, unless PATCH /ev/{evId}/mode sets testing mode on it in between.
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            Invalid ID number, the EV is already connected to an EVSE, or the EVSE
            ID does not resolve to an EVSE entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
    delete:
      tags:
        - EV
      summary: Unplug an EV from its EVSE
      operationId: disconnectFromEVSE
      description: >-
        Simulates unplugging the EV: removes it from the EVSE's connected-EV list
        and tears down the EV's EEBUS service (EVCC/EVEM and any running
        OPEV/OSCEV/EVSOC handlers unsubscribe from SPINE events). Returns 400 if
        the EV is not currently connected to any EVSE. The evseId path parameter
        must resolve to an existing EVSE entity, but the EV is disconnected from
        whichever EVSE it is actually attached to — it need not be the one named in
        the path. An EV in testing mode because of its EVSE returns to simulation
        mode; one put into testing mode through PATCH /ev/{evId}/mode stays in it.
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
        - $ref: "#/components/parameters/EvseIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid ID number, or the EV is not connected to any EVSE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
  /ev/{evId}/opev:
    get:
      tags:
        - EV
      summary: Get EV OPEV state
      description: >
        Returns the OPEV per-phase load-control limits the EV is currently operating
        under, together with the OPEV connection, heartbeat and controller operating
        state. Limits are read from the EV's live SPINE LoadControl feature.
      operationId: getEVOPEVState
      parameters:
        - $ref: "#/components/parameters/EvIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpevEVState"
        '400':
          description: invalid ID number or entity is not an EV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          description: OPEV use case is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
        '500':
          description: engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /ev/{evId}/oscev:
    get:
      tags:
        - EV
      summary: Get EV OSCEV state
      description: >-
        Returns the OSCEV PV-charge configuration (mode, surplus threshold,
        start/stop delays) together with the current-consumption/power
        recommendation the EV is acting on, its OSCEV connection heartbeat and
        controller operating state. Requires the OSCEV use case to be licensed
        (403 otherwise).
      operationId: getEVOSCEVState
      parameters:
        - $ref: "#/components/parameters/EvIdParam"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevEVState"
        '400':
          description: invalid ID number or entity is not an EV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          description: OSCEV use case is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
        '500':
          description: engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    patch:
      tags:
        - EV
      summary: Update EV OSCEV configuration
      description: >-
        Updates the EV's own OSCEV PV-charge configuration (as opposed to PATCH
        /ev/{evId}, which can also set these same fields as part of a broader
        config update — both paths converge on the same underlying state).
        Requires the OSCEV use case to be licensed (403 otherwise). Validation,
        applied per field only when present in the body:

        - `pvChargeMode` must be one of `off` / `surplusOnly` /
        `surplusWithThreshold`; `surplusWithThreshold` is rejected unless the EV
        currently supports threshold mode (surplusWithThresholdSupported).

        - `surplusThresholdInWatts` must be non-negative, and may not be set at
        all when threshold support is disabled.

        - `startDelayInSeconds` and `stopDelayInSeconds` must be non-negative.
      operationId: updateEVOSCEVConfiguration
      parameters:
        - $ref: "#/components/parameters/EvIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OscevEVPatchRequest"
            example:
              pvChargeMode: surplusOnly
              startDelayInSeconds: 30
              stopDelayInSeconds: 60
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevEVState"
        '400':
          description: invalid request body, invalid ID number, invalid OSCEV value, or entity is not an EV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          description: OSCEV use case is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          $ref: "#/components/responses/NoExistingEvIdNotFound"
        '500':
          description: engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /ev/{evId}/image:
    post:
      tags:
        - EV
      summary: Upload Image
      operationId: uploadEVImage
      description: >-
        Stores a Base64-encoded image for the given EV (used by UIs for device
