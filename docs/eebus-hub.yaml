        tiltInDegrees:
          type: number
          description: MPS panel tilt in degrees (DeviceConfiguration), 0..90. Defaults to 30.
          example: 30
        azimuthInDegrees:
          type: number
          description: MPS panel azimuth in degrees (DeviceConfiguration), 0..360. Defaults to 180.
          example: 180
    BatteryPatchRequest:
      title: Partial battery configuration update
