        entities specifically (this endpoint requires LPC, unlike `GET
        /hems/latestReceivedHeartbeat` which aggregates over all connected remote
        devices regardless of use case).


        Requires: the LPC use case must be enabled.
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIM60745_Wallbox-9166afa5
      responses:
        '200':
          description: Latest received heartbeat data for that device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatWrapperWithExample"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          $ref: "#/components/responses/NoHemsFoundUpper"
        '500':
          description: >-
            LPC use case is disabled, no device with that address is connected, or
            no heartbeat has been received/fully populated yet for it
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /hems/MpcMeasurementData:
    get:
      tags:
        - HEMS
      summary: Get MPC measurement data from every connected device
      operationId: getMPCMeasurementData
      description: >-
        Returns the latest Monitoring of Power Consumption measurement snapshot for every
        remote entity paired to the HEMS's MPC handler (EVSE, Inverter, HeatPump, ControlBox
        SubMeter and similar monitored-unit actors). Requires: a HEMS present. The handler
        also checks the MPC use-case-availability flag, but that flag is initialized once at
        startup (and only re-initialized by `POST /sim` with `action: "reset"`) and is never left unset, so in
        a running server the "not supported" branch below cannot actually be reached —
        overall license validity is still enforced globally (403 on an expired license).
      responses:
        '200':
          description: Successful response. Empty array when no HEMS or no MPC-capable entity is connected.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                      description: SPINE device address of the remote entity.
                    measurements:
                      $ref: "#/components/schemas/MPCMeasurementData"
        '400':
          description: MPC use case not supported by this build (see description — not reachable once the server is running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: MPC handler returned an error while collecting measurements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/MgcpMeasurementData:
    get:
      tags:
        - HEMS
      summary: Get the latest MGCP measurement snapshot the HEMS (MA) holds
      description: >
        Returns a point-in-time snapshot (not history — see `GET /sim/MGCPLogs` for the
        append-only log) of the grid-connection-point measurements the HEMS currently holds,
        keyed by the HEMS's own device address so the UI Data badge attaches to the HEMS bus
        item. Requires: the monitored ControlBox (GCP) already added and trust-paired to this
        HEMS — see `POST /controlbox/add` and `POST /controlbox/trust`; the snapshot stays
        empty until the SPINE data-change callback that populates it has fired at least once
        for that device. The handler also checks the MGCP use-case-availability flag, but
        that flag is initialized once at startup and never left unset, so in a running server
        the "not enabled" branch below cannot actually be reached.
      operationId: getMGCPMeasurementData
      responses:
        '200':
          description: Successful response. Empty array before the first GCP measurement notify is received.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                      description: The HEMS (MA)'s own device address.
                    measurements:
                      $ref: "#/components/schemas/MGCPMeasurements"
        '400':
          description: MGCP use case not supported by this build (see description — not reachable once the server is running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: no HEMS found or the MGCP handler returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/OhpcfMonitorData:
    get:
      tags:
        - HEMS
      summary: Get OHPCF data for every announced heat pump
      operationId: getOhpcfMonitorData
      description: >-
        Returns the latest OHPCF (Optimization of Self Consumption by Heat Pump Compressor
        Flexibility) PowerSequence data for every remote Compressor entity paired to the
        HEMS's OHPCF handler. A heat pump is included only once it has announced an optional
        power-consumption process with a non-empty Alternatives/PowerSequence — see
        `POST /heatpump/{heatPumpId}/announceOptional` — devices that have not (yet)
        announced are silently omitted, not reported with an empty entry. Requires: a HEMS
        present. The handler also checks the OHPCF use-case-availability flag, but that flag
        is initialized once at startup and never left unset, so in a running server the "not
        supported" branch cannot actually be reached.
      responses:
        '200':
          description: Successful response. Empty array when no HEMS or no heat pump has announced yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceAddress:
                      type: string
                      description: SPINE device address of the heat pump's Compressor entity.
                    data:
                      $ref: "#/components/schemas/OhpcfMonitorData"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: OHPCF returned an error (handler not initialized, or no Compressor entities found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/SendOhpcfStartTime/{deviceAddress}:
    post:
      tags:
        - HEMS
      summary: Send an OHPCF start time to a heat pump
      operationId: sendOhpcfControl
      description: >-
        Writes a start time to the announced PowerSequence of the heat pump at deviceAddress
        (`Alternatives[0].PowerSequence[0].Schedule.StartTime`). Identical in every respect to
        `PATCH /hems/SendOhpcfStartTime/{deviceAddress}` below — both HTTP methods are wired
        to the same handler. Requires: the heat pump has already announced an optional
        power-consumption process (see `POST /heatpump/{heatPumpId}/announceOptional`) whose
        PowerSequence has both a State and a Description block. The EEBUS write outcome
        (success or failure) is always reported in the 200 body via success/reason; it does
        not change the HTTP status.
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_HeatPump-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ohpcfStartTime"
            example:
              startTime: 3600
      responses:
        '200':
          description: Successful response. success reflects whether the device accepted the write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
              example:
                success: true
                reason: ""
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: HEMS not found, or no OHPCF-capable device found at deviceAddress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '400':
          description: request body could not be parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    patch:
      tags:
        - HEMS
      summary: Send an OHPCF start time to a heat pump
      operationId: modifyOhpcfControl
      description: >-
        Identical to `POST /hems/SendOhpcfStartTime/{deviceAddress}` above — both HTTP
        methods are wired to the same handler and behave the same way, including the
        "already announced" requirement.
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_HeatPump-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ohpcfStartTime"
            example:
              startTime: 3600
      responses:
        '200':
          description: Successful response. success reflects whether the device accepted the write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: HEMS not found, or no OHPCF-capable device found at deviceAddress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/ChangeOhpcfState/{deviceAddress}:
    patch:
      tags:
        - HEMS
      summary: Change a heat pump's OHPCF PowerSequence state
      operationId: UpdateOhpcfControl
      description: >-
        Writes state to the announced PowerSequence of the heat pump at deviceAddress
        (`Alternatives[0].PowerSequence[0].State.State`). Requires: the heat pump has already
        announced an optional power-consumption process (see
        `POST /heatpump/{heatPumpId}/announceOptional`) whose PowerSequence has a Description
        block. The hub is a testing tool: the requested state is forwarded to the device
        as-is with no client-side transition validation, so a tester can request a transition
        the OHPCF state machine would normally forbid to observe the device's reaction — the
        `isPausable`/`isStoppable` flags reported by `GET /hems/OhpcfMonitorData` are
        informational only and are not consulted before the write. The EEBUS write outcome is
        always reported in the 200 body via success/reason; it does not change the HTTP
        status.
      parameters:
        - name: deviceAddress
          in: path
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_HeatPump-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ohpcfChangeState"
            example:
              state: paused
      responses:
        '200':
          description: Successful response. success reflects whether the device accepted the write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
              example:
                success: true
                reason: ""
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: HEMS not found, or no OHPCF-capable device found at deviceAddress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '400':
          description: request body could not be parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /realDevice:
    post:
      tags:
        - Real Devices
      summary: Register a real (non-simulated) device under test by SKI and type
      operationId: addRealDevice
      description: >-
        Registers a physical/external device so the Hub can track it and (optionally)
        pre-wire trust connections to simulated peers before the simulation starts.
        This does not itself pair or start any SHIP connection — it only records the
        device's SKI/type/name in the `RealDevicesHandler` registry; actual pairing
        happens the same way as for any other peer, via the trust mechanisms below.


        Requires: simulation STOPPED (400 otherwise). `remoteSki` must be a
        40-character SKI (400 otherwise) and must not already be registered (400,
        "the Entered SKI is already Registered"). `deviceType` must be one of the 14
        accepted values (400 "invalid device type" otherwise — see the `realDevice`
        schema's `deviceType` enum). At most one real device of type
        `EnergyManagementSystem` may ever be registered, and only if no simulated
        HEMS currently exists (400 otherwise) — a real device and a simulated HEMS
        are mutually exclusive, and only one real HEMS is supported. If
        `trustConnections` is supplied, every entry must reference a simulated peer
        by `id` (a real device cannot be wired to another real device — the Hub does
        not control either side's hardware to establish trust) and must pass the same
        device-role validation as `POST /trust` (see `TrustPeerRef`); on success each
        connection is recorded exactly as if `POST /trust` had been called with
        `{ski: remoteSki}` as one endpoint — see `GET /trust` for how the two
        mechanisms relate.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/realDevice"
            example:
              remoteSki: "00-1D-A0-00-00-00-00-00-00-00-00-00-00-00-00-00-00-00"
              deviceName: "Lab charging station"
              deviceType: ChargingStation
              trustConnections:
                - id: 1
      responses:
        '200':
          description: Real device registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  Id:
                    type: integer
                    description: >-
                      Engine-scoped id assigned to this real device, unique per
                      `deviceType` (not globally). Note the capitalized JSON key —
                      the handler writes it as `"Id"`, not `"id"`.
                    example: 0
        '400':
          description: >-
            Malformed body; invalid/duplicate SKI; unsupported `deviceType`; a HEMS
            already exists (simulated or real); a `trustConnections` entry references
            another real device or fails device-role validation; or the simulation
            is running.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /realDevices:
    get:
      tags:
        - Real Devices
      summary: List every registered real device, across all device types
      operationId: listAllRealDevices
      description: >-
        Returns all real devices registered via `POST /realDevice`, regardless of
        `deviceType`, sorted by `remoteSki`. Returns an empty array (not an error)
        both when the registry has not been initialised yet and when it has no
        entries.


        Requires: none beyond a valid license (default license-gated route).
      responses:
        '200':
          description: Every registered real device.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RealDeviceRecord"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /realDevice/{deviceType}/{deviceId}:
    get:
      tags:
        - Real Devices
      summary: Get one registered real device by type and id
      operationId: getRealDevice
      description: >-
        `deviceId` is scoped per `deviceType` — ids are assigned independently
        within each type's own registry (see `POST /realDevice`), so `deviceId=0`
        can identify a different device under a different `deviceType`.
      parameters:
        - $ref: "#/components/parameters/RealDeviceTypeParam"
        - name: deviceId
          in: path
          schema:
            type: integer
          required: true
          description: Id scoped to `deviceType` (assigned sequentially by `POST /realDevice`).
          example: 1
      responses:
        '200':
          description: The registered real device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealDeviceRecord"
        '400':
          description: Unsupported `deviceType`, or a non-numeric/negative `deviceId`.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '404':
          description: No registered device with this deviceType/deviceId pair.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    delete:
      tags:
        - Real Devices
      summary: Unregister a real device
      operationId: deleteRealDevice
      description: >-
        Removes the device from the registry and drops every trust edge that
        references its SKI (`TrustManager.RemoveEdgesFor`) — including edges the
        Hub established automatically after out-of-band pairing, not just ones
        added via `trustConnections`/`POST /trust`.


        Requires: simulation STOPPED (400 otherwise). Same test-run-active guard
        as every other destructive endpoint: blocked with 409 while a compliance
        test run is active, unless the request carries a valid
        `X-EEBUS-Internal-Test-Token`.
      parameters:
        - $ref: "#/components/parameters/RealDeviceTypeParam"
        - name: deviceId
          in: path
          schema:
            type: integer
          required: true
          description: Id scoped to `deviceType` (assigned sequentially by `POST /realDevice`).
          example: 1
        - name: X-EEBUS-Internal-Test-Token
          in: header
          required: false
          description: Internal token used by test automation to bypass the active-test-run block.
          schema:
            type: string
      responses:
        '200':
          description: The device is now unregistered (and its trust edges dropped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: >-
            Unsupported `deviceType`, a non-numeric/negative `deviceId`, no device
            found at that type/id, or the simulation is running.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '409':
          description: >-
            Blocked because a compliance test run is active and the request did not
            carry a valid X-EEBUS-Internal-Test-Token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    patch:
      tags:
        - Real Devices
      summary: Replace the stored image for a real device
      operationId: updateRealDeviceImage
      description: >-
        Overwrites the device's `imgBase64` field. Unlike the simulated-device image
        endpoints (e.g. `POST /heatpump/{heatPumpId}/image`), there is no separate
        GET/DELETE for a real device's image and no validation on the supplied
        string — an empty value clears it. This is the only mutable field on a real
        device; SKI/name/type are fixed at `POST /realDevice` time.
      parameters:
        - $ref: "#/components/parameters/RealDeviceTypeParam"
        - name: deviceId
          in: path
          schema:
            type: integer
          required: true
          description: Id scoped to `deviceType` (assigned sequentially by `POST /realDevice`).
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                imgBase64:
                  type: string
                  description: Base64-encoded image. Empty string clears the stored image.
      responses:
        '200':
          description: Image updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          $ref: "#/components/responses/InvalidDataBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /uncontrollabledevice:
    post:
      tags:
        - Uncontrollable Device
      summary: Add a fixed-load uncontrollable device (e.g. dishwasher, dryer)
      operationId: addUncontrollableDevice
      description: >-
        Creates a simple simulated load with no EEBUS presence of its own: no SPINE
        service, no use cases, nothing to pair or trust. It exists purely to draw a
        configured per-phase current whenever `powerStateOn` is true, so that
        LPC/OPEV/etc. scenarios can be tested against a household with background
        load. `deviceName` defaults to `"my device"` if omitted or empty. A negative
        current on any phase is rejected; an out-of-range `powerFactor` (<= 0 or > 1)
        is silently coerced to 1.0 rather than rejected.


        Requires: simulation STOPPED (400 otherwise).
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/ThreePhaseDevice"
                - $ref: "#/components/schemas/SinglePhaseDevice"
            example:
              deviceName: "Dishwasher"
              current: { a: 6.5, b: 0, c: 0 }
              powerFactor: 0.95
              powerStateOn: true
      responses:
        '200':
          description: Device created.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/ResponseAddUncontrollableDevice"
        '400':
          description: A negative current was supplied on one or more phases, the body is malformed, or the simulation is running.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
    get:
      tags:
        - Uncontrollable Device
      summary: List every uncontrollable device
      operationId: listUncontrollableDevices
      description: >-
        Requires: none beyond a valid license (default license-gated route).
      responses:
        '200':
          description: Every uncontrollable device currently configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UncontrollableDeviceList"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /uncontrollabledevice/{devId}:
    delete:
      tags:
        - Uncontrollable Device
      summary: Delete an uncontrollable device
      operationId: deleteUncontrollableDevice
      description: >-
        Requires: simulation STOPPED (400 otherwise — note the handler's error
        message says "can not add uncontrollable device while simulation is
        running", a copy/paste artifact from the POST handler; the check itself is
        genuinely for delete). Same test-run-active guard as every other
        destructive endpoint: blocked with 409 while a compliance test run is
        active, unless the request carries a valid `X-EEBUS-Internal-Test-Token`.
      parameters:
        - name: devId
          in: path
          schema:
            type: integer
          required: true
          example: 1
        - name: X-EEBUS-Internal-Test-Token
          in: header
          required: false
          description: Internal token used by test automation to bypass the active-test-run block.
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Non-numeric/negative devId, or the simulation is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No uncontrollable device with this id.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
        '409':
          description: >-
            Blocked because a compliance test run is active and the request did not
            carry a valid X-EEBUS-Internal-Test-Token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    patch:
      tags:
        - Uncontrollable Device
      summary: Update an uncontrollable device's configuration
      operationId: modifyUncontrollableDevice
      description: >-
        Applies only the top-level keys present in the request body (`deviceName`,
        `powerStateOn`, `current`, `powerFactor`); a `current` object may set any
        subset of `a`/`b`/`c`, leaving the others unchanged. The 200 response is
        written immediately after binding the body — before the per-key changes are
        actually applied to the entity — so `new` always reflects the fully-merged
        request body, whether or not it turned out to be a no-op.


        Requires: none beyond a valid license (default license-gated route). No
        check on simulation state — unlike POST/DELETE on this tag, this endpoint
        may be called while the simulation is running.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/ThreePhaseDevice"
                - $ref: "#/components/schemas/SinglePhaseDevice"
      parameters:
        - name: devId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: >-
            The keys actually present in the request (`changes`) and the fully-merged
            configuration (`new`) — note `new` is computed before validating whether
            anything changed, so it always mirrors the request body applied on top
            of the previous configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    $ref: "#/components/schemas/ThreePhaseDevice"
                  new:
                    $ref: "#/components/schemas/ThreePhaseDevice"
        '400':
          $ref: "#/components/responses/InvalidIdNumberLowerBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No uncontrollable device with this id.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /uncontrollabledevice/{devId}/image:
    post:
      tags:
        - Uncontrollable Device
      summary: Set an uncontrollable device's image
      operationId: uploadUncontrollableDeviceImage
      description: >-
        Overwrites `imgBase64` unconditionally (no validation of the string
        content). Requires: none beyond a valid license (default license-gated route).
      requestBody:
        content:
          application/json:
            schema:
             $ref: "#/components/schemas/Image"
      parameters:
        - name: devId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Image stored.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          $ref: "#/components/responses/InvalidIdNumberLowerBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: No uncontrollable device with this id.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    get:
      tags:
        - Uncontrollable Device
      summary: Get an uncontrollable device's stored image
      operationId: getUncontrollableDeviceImage
      description: >-
        Requires: none beyond a valid license (default license-gated route).
      parameters:
        - name: devId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/ResponseImage"
        '400':
          $ref: "#/components/responses/InvalidIdNumberLowerBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: >-
            No uncontrollable device with this id, or no image has been stored for
            it. The two cases are not distinguished, and the "no image" case sends its
            message under the JSON key `error` rather than the `err` of `statusError` —
            a spelling a number of handlers across this API use.
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - Uncontrollable Device
      summary: Clear an uncontrollable device's stored image
      operationId: deleteUncontrollableDeviceImage
      description: >-
        Requires: none beyond a valid license (default license-gated route). When
        there is no saved image the call is a 404 and nothing is written; otherwise
        the image is cleared and the call is a 200.
      parameters:
        - name: devId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Image cleared (also observed when there was no image to clear — see above).
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          $ref: "#/components/responses/InvalidIdNumberLowerBadRequest"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
        '404':
          description: >-
            No uncontrollable device with this id. (The "no saved image" case also
            writes a 404 body first — see the handler quirk noted above — but does
            not stop there.)
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
  /heatpump/add:
    post:
      tags:
      - Heat Pump
      summary: Add a new heat pump to the simulation
      operationId: addHeatPump
      description: 'Creates a simulated heat pump entity with its own EEBUS service (SHIP/SPINE not started
        until it is trusted — see `POST /heatpump/{heatPumpId}/trust`).


        Requires: simulation STOPPED (400 otherwise). `deviceName` must be unique across every existing
        heat pump, and the `(vendor.code, serialNumber, deviceModel)` triple must also be unique (400 "Device
        name already exists" / "Device address already exists"). Body validation (see `HeatPumpInfo` for
        the exact bounds): `deviceName`, `brandName`, `deviceCode`, `serialNumber`, `vendor.code` and `vendor.name`
        must be non-empty; `failsafeValue` >= 0; `failsafeDuration` and `failsafeDurationMax` in [2, 24]
        hours; `nominalPower` and `nominalCurrent` are both required objects (despite being optional in
        the schema) with `min`/`max` >= 0, `min < max` within each, and `nominalCurrent.min < nominalPower.max`
        — a genuine cross-field constraint, not a units mismatch. On validation failure, the 400 body''s
        `err` is not a string but an object whose keys are the names of the fields that failed (each mapped
        to the literal value `false`) — e.g. `{"err": {"failsafeDuration": false}}`.


        Two fields in the request body are silently overridden and not honored as sent: `brandName` is always
        forced to `"Coretech-Innovations"`, and `lpcEnabled`/`mpcEnabled` are overwritten from the server''s
        license-derived use-case availability when that value is set (see the per-use-case nil checks noted
        throughout this specification — in practice only an expired license''s 403 meaningfully blocks use-case
        availability, these overrides rarely change behavior for a valid license). `trustConnections` (if
        supplied) is validated against the device-role rules — a heat pump is a controllable device, so
        every peer must resolve to a controller (HEMS or ControlBox) — and recorded the same way as `POST
        /trust`.
'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatPumpInfo'
            example:
              deviceName: SimulatedHeatPump
              deviceCode: HP-1
              serialNumber: '30001'
              brandName: Coretech-Innovations
              deviceModel: HP-1000
              vendor:
                name: Coretech-Innovations
                code: CTI
              failsafeValue: 0
              failsafeDuration: 2
              failSafeDurationMax: 24
              nominalPower:
                min: 0
                max: 5000
              nominalCurrent:
                min: 0
                max: 16
      responses:
        '200':
          description: Heat pump added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  id:
                    type: integer
                    format: uint
                    example: 1
        '400':
          description: Simulation is running, deviceName/device-address already exists, a body validation
            bound failed (see description above for the exact error-object shape) — or the underlying EEBUS
            service failed to construct, in which case
            this status code is not actually reliable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '500':
          description: The internal simulation engine could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
  /heatpump/list:
    get:
      tags:
        - Heat Pump
      summary: Get list of all heat pumps
      operationId: listHeatPumps
      description: >-
        Requires: none beyond a valid license (default license-gated route).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatPumpControlBlock"
        '403':
          $ref: "#/components/responses/LicenseExpiredForbidden"
  /heatpump/{heatPumpId}:
    get:
      tags:
      - Heat Pump
      summary: Get heat pump details by ID
      operationId: getHeatPump
      description: 'Requires: none beyond a valid license (default license-gated route).'
      parameters:
      - $ref: '#/components/parameters/HeatPumpIdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatPumpControlBlock'
        '400':
          $ref: '#/components/responses/InvalidHeatPumpIdBadRequest'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/HeatPumpNotFound'
    patch:
      tags:
      - Heat Pump
      summary: Update heat pump configuration
      operationId: updateHeatPump
      description: Applies the same validation as `POST /heatpump/add` (see there for the exact bounds and
        the error-object shape) except the uniqueness check on deviceName/device-address ignores this heat
        pump's own current record. `brandName` is preserved from the existing configuration regardless of
        what the request sends (not overridden to a fixed value like on create). If the merged configuration
        is byte-for-byte identical to the current one, the handler returns 200 immediately without touching
        the entity or logging a change. No check on simulation state — unlike add/delete, this endpoint
        may be called while the simulation is running.
      parameters:
      - $ref: '#/components/parameters/HeatPumpIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatPumpInfo'
      responses:
        '200':
          description: '`changes` is the raw request body as submitted (before merging); `new` and `old`
            are the full configuration after and before the update.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: object
                  new:
                    $ref: '#/components/schemas/HeatPumpInfo'
                  old:
                    $ref: '#/components/schemas/HeatPumpInfo'
        '400':
          description: 'Rejected before anything changed: a malformed body, a field that failed validation,
            or a field this route refuses to change.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/statusError'
                - $ref: '#/components/schemas/FieldValidationError'
                - $ref: '#/components/schemas/FieldRejectionError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/HeatPumpNotFound'
        '409':
          description: The field can only be changed while the device is stopped (heartbeatTimeoutInSeconds
            is handed to the EEBUS service at setup).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRejectionError'
    delete:
      tags:
      - Heat Pump
      summary: Delete a heat pump
      operationId: deleteHeatPump
      description: 'Requires: simulation STOPPED (400 otherwise). Same test-run-active guard as every other
        destructive endpoint: blocked with 409 while a compliance test run is active, unless the request
        carries a valid `X-EEBUS-Internal-Test-Token`.'
      parameters:
      - $ref: '#/components/parameters/HeatPumpIdParam'
      - name: X-EEBUS-Internal-Test-Token
        in: header
        required: false
        description: Internal token used by test automation to bypass the active-test-run block.
        schema:
          type: string
      responses:
        '200':
          description: Heat pump deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusOk'
        '400':
          description: Cannot delete while simulation is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '403':
          $ref: '#/components/responses/LicenseExpiredForbidden'
        '404':
          $ref: '#/components/responses/HeatPumpNotFound'
        '409':
          description: Blocked because a compliance test run is active and the request did not carry a valid
            X-EEBUS-Internal-Test-Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
        '500':
          description: The internal simulation engine could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusError'
