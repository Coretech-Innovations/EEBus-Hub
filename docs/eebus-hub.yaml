    BatteryForcedValuesRequest:
      title: Battery forced-values request
      description: Body of PATCH /inverter/:id/battery/values — DC/MOB overrides pinned while the battery
        is in testing mode (400 otherwise). Every field optional.
      type: object
      properties:
        forcedPowerInWatts:
          type: number
          x-unit: W
          description: DC battery power pinned verbatim (positive = charging, negative = discharging).
        forcedCurrentInAmpere:
          type: number
          x-unit: A
          description: DC current pinned verbatim (else derived from the pinned power).
        forcedVoltageInVolts:
          type: number
          x-unit: V
          description: DC voltage pinned verbatim (else the configured voltage).
        forcedEnergyChargedInWattHours:
          type: number
          x-unit: Wh
          description: MOB energy-charged counter pinned verbatim.
        forcedEnergyDischargedInWattHours:
          type: number
          x-unit: Wh
          description: MOB energy-discharged counter pinned verbatim.
        forcedUsableCapacityInWattHours:
          type: number
          x-unit: Wh
          description: Usable capacity pinned verbatim.
        forcedStateOfEnergyInWattHours:
          type: number
          x-unit: Wh
          description: Remaining energy (state of energy) pinned verbatim.
        forcedOperatingState:
          type: string
          description: DeviceDiagnosis operating state pinned verbatim. One of normalOperation, standby, failure,
            serviceNeeded, overrideDetected, inAlarm, notReachable, finished, temporarilyNotReady, off.
          enum:
          - normalOperation
          - standby
          - failure
          - serviceNeeded
          - overrideDetected
          - inAlarm
          - notReachable
          - finished
          - temporarilyNotReady
          - 'off'
        forcedBatteryType:
          type: string
          description: DeviceConfiguration battery type pinned verbatim. Must be one of the MOB-072 enum values.
          enum:
          - liIon
          - leadAcid
          - redoxFlow
          - sodiumIon
        forcedMaxCycleCountPerDay:
          type: integer
          description: DeviceConfiguration max cycles per day pinned verbatim. Must be >= 0.
        forcedStateOfHealthInPercent:
          type: number
          description: MOB State of Health (MOB-022) pinned verbatim, 0..100.
        forcedLoadCycleCount:
          type: integer
          description: MOB Cumulated Load Cycle Count (MOB-071) pinned verbatim, >= 0.
        forcedInternalTemperatureInDegC:
          type: number
          description: MOB Internal Temperature (MOB-091) pinned verbatim.
