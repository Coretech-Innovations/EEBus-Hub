          description: Whether to approve write limit operations
    InverterInfo:
      title: Inverter configuration
      description: Go type `api.InverterInfo`. `lpcCS`/`lppCS` are required on `POST /inverter/add`; deviceCode/serialNumber/vendor.code/vendor.name/
        inverterType must be non-empty; deviceName and the (vendor.code, serialNumber, deviceModel) triple
        must be unique across inverters — see `POST /inverter/add` for the exact validation.
      type: object
      properties:
        trustConnections:
          type: array
          description: Optional peers to mutually trust when the simulation starts. Accepted on POST /inverter/add
            only.
          items:
            $ref: '#/components/schemas/TrustPeerRef'
        deviceName:
          type: string
          description: Must be unique across all inverters.
        deviceCode:
          type: string
          description: Required (non-empty) on create/update.
        serialNumber:
          type: string
          description: Required (non-empty) on create/update; part of the (vendor.code, serialNumber, deviceModel)
            uniqueness triple.
        softwareRev:
          type: string
        hardwareRev:
          type: string
        vendor:
          type: object
          properties:
            name:
              type: string
              description: Required (non-empty) on create/update.
            code:
              type: string
              description: Required (non-empty) on create/update; part of the uniqueness triple.
        brandName:
          type: string
          description: Ignored on input — the server always overwrites it with "Coretech-Innovations".
        deviceModel:
          type: string
          description: Part of the (vendor.code, serialNumber, deviceModel) uniqueness triple.
        gridCode:
          type: string
          description: Ignored on input — the server always overwrites it with "VDE-AR-N 4105:2018".
        imgBase64:
          type: string
        lpcEnabled:
          type: boolean
          description: Set server-side from the license/feature configuration; not settable by the client.
        lppEnabled:
          type: boolean
          description: Set server-side from the license/feature configuration; not settable by the client.
        moiEnabled:
          type: boolean
          nullable: true
          description: Set server-side from the license/feature configuration; not settable by the client.
        mobEnabled:
          type: boolean
          nullable: true
          description: Set server-side from the license/feature configuration; not settable by the client.
        inverterType:
          type: string
          description: Required (non-empty) on create/update. Purely descriptive — does not change simulated
            behavior.
          enum:
          - Inverter
          - PhotovoltaicInverter
          - HybridInverter
          - BatteryInverter
        batteryInfo:
          $ref: '#/components/schemas/BatteryInfo'
        pvstringInfo:
          $ref: '#/components/schemas/PVStringInfo'
        lppCS:
          allOf:
          - $ref: '#/components/schemas/ControllableSystemInfo'
          description: LPP (production) controllable-system config. Required on POST /inverter/add. contractualPowerMax
            is cleared before validation, so it cannot be set at creation.
        lpcCS:
          allOf:
          - $ref: '#/components/schemas/ControllableSystemInfo'
          description: LPC (consumption) controllable-system config. Required on POST /inverter/add. contractualPowerMax
            is cleared before validation, so it cannot be set at creation.
        heartbeatTimeoutInSeconds:
          type: integer
          format: int64
          minimum: 2
          maximum: 86400
          description: 'SPINE heartbeat timeout advertised to peers, in seconds. Optional: when the field
            is omitted the device type''s default applies - 4 for EVSE, heat pump and HEMS, 60 for inverter
            and control box. An explicit 0, or a value outside 2..86400, is rejected with 400; the lower bound
            exists because SPINE only applies its 2 s transmit margin above 2 s, the upper bound because the
            value is converted to a duration. The timeout is handed to the eebus service at setup, so it can
            only be changed while that service does not exist yet; a change after the device is started is
            rejected with 409.'
        defaultAcPowerInWatts:
          type: number
          description: Default AC battery power setpoint for COB Scenario 3, in Watts. Applied in Power Control
            state on a battery inverter until the CEM activates a Charge/Discharge AC Power setpoint. Read-only
            for the CEM; write attempts are rejected with errorNumber 7 (COB-030/2).
          default: 0
        defaultDcPowerInWatts:
          type: number
          description: Default DC battery power setpoint for COB Scenario 3, in Watts. Applied in Power Control
            state on a hybrid inverter until the CEM activates a Charge/Discharge DC Power setpoint. Read-only
            for the CEM; write attempts are rejected with errorNumber 7 (COB-030/2).
          default: 0
        defaultPccPowerInWatts:
          type: number
          description: Default PCC power setpoint for COB Scenario 3, in Watts. Applied in PCC Control state
            until the CEM activates a PCC Power setpoint. Read-only for the CEM; write attempts are rejected
            with errorNumber 7 (COB-030/2).
          default: 0
    BatteryInfo:
      title: Battery sub-entity configuration
      type: object
      properties:
        deviceName:
          type: string
        deviceCode:
          type: string
        serialNumber:
          type: string
        softwareRev:
          type: string
        hardwareRev:
          type: string
        vendor:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
        brandName:
          type: string
        manufacturer:
          type: object
        deviceModel:
          type: string
        imgBase64:
          type: string
        maxPowerInWatts:
          type: number
          x-unit: W
          description: Maximum charge/discharge power in W. Defaults to 6000 when omitted.
          example: 10000
        capacityInWattHours:
          type: number
          x-unit: Wh
          description: Battery capacity in Wh. Defaults to 5000 when omitted.
          example: 15000
        nominalVoltageInVolts:
          type: number
          x-unit: V
          description: Battery DC voltage in V. Defaults to 400 when omitted.
          example: 400
        initialStateOfChargeInPercent:
          type: number
          x-unit: percent
          description: State of charge the battery starts at, 0..100. Defaults to 50.
          example: 50
        chargingEnabled:
          type: boolean
          description: When false the battery cannot charge. Defaults to true.
        dischargingEnabled:
          type: boolean
          description: When false the battery cannot discharge. Defaults to true.
        batteryType:
          type: string
          description: DeviceConfiguration battery type reported over SPINE. Must be one of the MOB-072 enum
            values below. Defaults to "liIon" when omitted.
          enum:
          - liIon
          - leadAcid
          - redoxFlow
          - sodiumIon
          example: liIon
        maxCycleCountPerDay:
          type: integer
          description: DeviceConfiguration max charge/discharge cycles per day (MOB-084). Must be >= 0. Defaults
            to 2 when omitted.
          example: 2
        standbyPowerThresholdInWatts:
          type: number
          description: '|power| in W below which a full or empty battery reports the standby operating state.
            Must be >= 0. Defaults to 10 when omitted.'
          example: 10
        stateOfHealthInPercent:
          type: number
          description: MOB Battery State of Health (MOB-022), 0..100. Scales the reported usable capacity
            and state of energy. Defaults to 100 when omitted.
          example: 100
        loadCycleCount:
          type: integer
          description: MOB Cumulated Load Cycle Count (MOB-071). Cumulative charge/discharge cycles, >= 0.
            Defaults to 0 when omitted.
          example: 0
        internalTemperatureInDegC:
          type: number
          description: MOB Internal Temperature (MOB-091) in °C. Defaults to 25 when omitted.
          example: 25
    PVStringInfo:
      title: PV string sub-entity configuration
      type: object
      properties:
        deviceName:
          type: string
        deviceCode:
          type: string
        serialNumber:
          type: string
        softwareRev:
          type: string
        hardwareRev:
          type: string
        vendor:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
        brandName:
          type: string
        manufacturer:
          type: object
        deviceModel:
          type: string
        imgBase64:
          type: string
        maxPowerInWatts:
          type: number
          x-unit: W
          description: Peak DC production power in W as a positive magnitude. Defaults to 6000.
          example: 8000
        nominalVoltageInVolts:
          type: number
          x-unit: V
          description: PV string DC voltage in V. Defaults to 400 when omitted.
          example: 400
        sunFactor:
          type: number
          x-unit: ratio
          description: Irradiance scaling factor, 0 (night) to 1 (full sun). Defaults to 1.
